---
# Caddy upgraden met behoud van zijn modules, en daarna elke site nakijken.
#
#   ansible-playbook playbooks/caddy-upgrade.yml
#
# Waarom een playbook en niet `apt upgrade`: de draaiende binary is de
# pakketversie met caddy-dns/cloudflare eraan toegevoegd via
# `caddy add-package`. Apt zet daar de kale binary voor terug, en die weigert
# te starten tegen een Caddyfile die de DNS-module gebruikt - waarmee elke
# *.neodata.be-naam offline gaat. Daarom staat het pakket op hold.
# `caddy upgrade` herbouwt met de huidige moduleset en houdt de plugin.
#
# Dit playbook vertrouwt daar niet blind op: het noteert de modules vooraf en
# faalt als er achteraf één mist.
#
# In site.yml: nee, en ook niet op een schema. Dit vervangt de binary waar
# elke dienst achter staat, dus het is iets wat je kiest.

- name: Upgrade Caddy, keeping its modules
  hosts: caddy
  gather_facts: false
  vars:
    # Dit playbook past de caddy-rol niet toe, dus de defaults van die rol
    # gelden hier niet. Hier genoemd zodat de foutmelding je het exacte
    # herstelcommando kan geven.
    caddy_dns_module: github.com/caddy-dns/cloudflare

  tasks:
    - name: Record the version and modules in use
      ansible.builtin.command: "caddy {{ item }}"
      register: caddy_upgrade_before
      changed_when: false
      check_mode: false
      loop:
        - version
        - list-modules

    - name: Remember the non-standard modules
      ansible.builtin.set_fact:
        caddy_upgrade_modules_before: >-
          {{ caddy_upgrade_before.results[1].stdout_lines
             | select('match', '^\s*dns\.providers\.')
             | map('trim') | list }}
        caddy_upgrade_version_before: "{{ caddy_upgrade_before.results[0].stdout.split()[0] }}"

    - name: Show what is about to be upgraded
      ansible.builtin.debug:
        msg: >-
          {{ caddy_upgrade_version_before }} with
          {{ caddy_upgrade_modules_before | join(', ') | default('no dns modules', true) }}

    - name: Refuse to upgrade a Caddy with no DNS module
      ansible.builtin.assert:
        that: caddy_upgrade_modules_before | length > 0
        fail_msg: >-
          Geen dns.providers.*-module gevonden. Deze host hoort een build met
          caddy-dns/cloudflare te draaien; upgraden vanaf hier zet die niet
          terug. Kijk eerst naar `caddy list-modules`.
        success_msg: "Moduleset genoteerd, upgraden kan"

    - name: Upgrade Caddy
      ansible.builtin.command: caddy upgrade
      register: caddy_upgrade_run
      changed_when: "'already running the latest' not in caddy_upgrade_run.stdout"
      failed_when:
        - caddy_upgrade_run.rc != 0
        - "'already running the latest' not in caddy_upgrade_run.stdout"
      notify:
        - Restart Caddy on the new binary
        - Wait for Caddy to answer again

    - name: Read the version and modules afterwards
      ansible.builtin.command: "caddy {{ item }}"
      register: caddy_upgrade_after
      changed_when: false
      check_mode: false
      loop:
        - version
        - list-modules

    - name: Require every DNS module to have survived
      ansible.builtin.assert:
        that: >-
          caddy_upgrade_modules_before | difference(
            caddy_upgrade_after.results[1].stdout_lines
            | select('match', '^\s*dns\.providers\.') | map('trim') | list
          ) | length == 0
        fail_msg: >-
          Modules kwijtgeraakt in de upgrade. Voorheen:
          {{ caddy_upgrade_modules_before | join(', ') }}. Certificaten voor
          *.{{ caddy_domain }} gaan nu falen. Zet ze terug met
          `caddy add-package {{ caddy_dns_module }}` en herstart.
        success_msg: >-
          {{ caddy_upgrade_version_before }} ->
          {{ caddy_upgrade_after.results[0].stdout.split()[0] }},
          modules intact


  # Handlers en geen gewone taken: ze draaien aan het eind van deze play, en
  # dat is nog voor de smoketest hieronder. Zo blijft de volgorde
  # upgrade -> herstart -> nakijken overeind.
  handlers:
    - name: Restart Caddy on the new binary
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted

    - name: Wait for Caddy to answer again
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 443
        timeout: 60
      delegate_to: localhost
      become: false

# Bewijst de upgrade tegen elke site, en niet alleen dat het proces draait.
# De DNS-check loopt mee: die is snel en ongevaarlijk.
- name: Smoke test every site
  ansible.builtin.import_playbook: smoketest.yml
