---
# Eerste contact met ÉÉN nieuwe host: maakt het `ansible`-serviceaccount aan,
# met zijn sleutel en een sudo-regel zonder wachtwoord.
#
#   ansible-playbook playbooks/bootstrap.yml --limit newhost -u root -k
#
# De play richt zich op `linux` zodat --limit gewoon werkt, maar weigert tegen
# meer dan één host te draaien. Zonder die rem herschrijft een vergeten
# --limit /etc/sudoers.d/ansible op alle acht: idempotent, dus er breekt
# niets, maar een playbook dat voor een nieuwe machine bedoeld is hoort de
# rest niet te kunnen raken.
#
# In site.yml: nee, dit logt in als root met een wachtwoord. Voor een nieuwe
# LXC uit OpenTofu is playbooks/new-guest.yml de weg; die roept dezelfde
# taken aan.

- name: Bootstrap ansible service account
  hosts: linux
  vars:
    svc_user: ansible
    svc_pubkey: "{{ lookup('file', '~/.ssh/ansible_ed25519.pub') }}"

  tasks:
    - name: Refuse to bootstrap more than one host at a time
      ansible.builtin.assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          Dit zou {{ ansible_play_hosts | length }} hosts bootstrappen
          ({{ ansible_play_hosts | join(', ') }}). Richt het op één:
          --limit <host>. Geef -e bootstrap_allow_many=true alleen mee als je
          ze echt allemaal bedoelt.
        success_msg: "Bootstrap van {{ ansible_play_hosts | first }}"
      when: not (bootstrap_allow_many | default(false) | bool)
      run_once: true

    - name: Provision the service account
      ansible.builtin.import_tasks: tasks/bootstrap_host.yml
