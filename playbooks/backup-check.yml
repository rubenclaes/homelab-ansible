---
# Is elke back-up recent? Rood als een guest of host zijn back-up mist.
#
#   ansible-playbook playbooks/backup-check.yml
#
# Proxmox en PBS melden een back-up die faalt, niet een die niet draait: een
# job die uit staat, een schema dat weg is, een storage die offline is. Dit
# kijkt naar de uitkomst in plaats van naar de job.
#
# Wat er moet zijn, volgt uit de jobs in group_vars/proxmox/backup.yml (welke
# guests, welke storage) en uit pbs_client_backup_id in de host_vars. Een
# guest bewust uitsluiten doe je daar, in `exclude` van de job, niet hier.
#
# In site.yml: nee, het leest alleen.

- name: Back-ups die wegvallen
  hosts: pve01
  gather_facts: false
  vars:
    # Dagelijks om 02:00 (pbs_client) en 02:30 (PBS): boven 26 uur is er een
    # nacht gemist.
    backup_check_daily_max_hours: 26
    # Zondag 01:00 naar de Mac mini: een week plus twee uur.
    backup_check_weekly_max_hours: 170
    backup_check_daily_job: "{{ pve_backup_jobs | selectattr('params.storage', 'eq', 'pbs') | first }}"
    backup_check_weekly_job: "{{ pve_backup_jobs | selectattr('params.storage', 'eq', 'macmini-backup') | first }}"
    backup_check_hosts: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('pbs_client_backup_id', 'defined')
         | map(attribute='pbs_client_backup_id') | select | list }}
  tasks:
    - name: List the guests
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      register: backup_check_guests
      changed_when: false
      check_mode: false

    # Faalt ook als de Mac mini of zijn share weg is, en dat is dan de melding.
    - name: List the weekly dumps on the Mac mini
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ inventory_hostname }}/storage/{{ backup_check_weekly_job.params.storage }}/content"
          - --content
          - backup
          - --output-format
          - json
      register: backup_check_dumps
      changed_when: false
      check_mode: false

    - name: List the backup groups in PBS
      ansible.builtin.uri:
        url: >-
          https://{{ hostvars['pbs'].ansible_host }}:8007/api2/json/admin/datastore/{{ report_pbs_datastore }}/groups
        headers:
          Authorization: "PBSAPIToken={{ report_pbs_token_id }}:{{ hostvars['pbs'].report_pbs_token }}"
        validate_certs: false
        return_content: true
      register: backup_check_groups
      delegate_to: localhost
      become: false
      no_log: true
      check_mode: false

    # Een regel per back-up die te oud is of ontbreekt; leeg is goed.
    - name: Compare each backup with its schedule
      ansible.builtin.set_fact:
        backup_check_problems: >-
          {%- set now = now().timestamp() | int -%}
          {%- set pbs = {} -%}
          {%- for g in backup_check_groups.json.data -%}
          {%-   set _ = pbs.update({g['backup-type'] ~ '/' ~ g['backup-id']: g['last-backup']}) -%}
          {%- endfor -%}
          {%- set dumps = backup_check_dumps.stdout | from_json | sort(attribute='ctime')
                          | items2dict(key_name='vmid', value_name='ctime') -%}
          {%- set daily_exclude = (backup_check_daily_job.params.exclude | default('')).split(',')
                                  | select | map('int') | list -%}
          {%- set weekly = (backup_check_weekly_job.params.vmid | default('')).split(',')
                           | select | map('int') | list -%}
          {%- set out = [] -%}
          {%- for g in backup_check_guests.stdout | from_json | sort(attribute='vmid')
                if not g.template | default(0) | bool and g.vmid not in daily_exclude -%}
          {%-   set last = pbs[('vm' if g.type == 'qemu' else 'ct') ~ '/' ~ g.vmid] | default(0) -%}
          {%-   if now - last > backup_check_daily_max_hours * 3600 -%}
          {%-     set _ = out.append('PBS ' ~ g.vmid ~ ' ' ~ g.name ~ ': '
                    ~ (((now - last) // 3600) ~ ' uur oud' if last else 'geen back-up')) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- for id in backup_check_hosts -%}
          {%-   set last = pbs['host/' ~ id] | default(0) -%}
          {%-   if now - last > backup_check_daily_max_hours * 3600 -%}
          {%-     set _ = out.append('PBS host/' ~ id ~ ': '
                    ~ (((now - last) // 3600) ~ ' uur oud' if last else 'geen back-up')) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- for vmid in weekly -%}
          {%-   set last = dumps[vmid] | default(0) -%}
          {%-   if now - last > backup_check_weekly_max_hours * 3600 -%}
          {%-     set _ = out.append('Mac mini ' ~ vmid ~ ': '
                    ~ (((now - last) // 3600) ~ ' uur oud' if last else 'geen dump')) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{- out | join('\n') -}}

    - name: Every backup is recent
      ansible.builtin.assert:
        that: backup_check_problems | length == 0
        fail_msg: "{{ backup_check_problems }}"
        success_msg: >-
          Alles recent: PBS binnen {{ backup_check_daily_max_hours }} uur,
          de Mac mini binnen {{ backup_check_weekly_max_hours }} uur.
