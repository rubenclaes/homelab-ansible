---
# Provisions the things in the house that Ansible cannot log into.
#
#   ansible-playbook playbooks/devices.yml
#
# A new device is one commit and one run: add it to
# inventory/group_vars/all/devices.yml, run this, and its name, its address
# reservation and its filtering policy exist before the device is unboxed.
# When it first joins the Wi-Fi everything already applies to it.
#
# Deliberately NOT in site.yml. The UniFi play writes address reservations,
# which changes what the gateway hands out at the next lease renewal. That is
# provisioning, and this repo keeps provisioning out of the playbook that may
# run at any moment. The AdGuard half is safe and site.yml converges it too,
# through the adguard role; running it here as well costs one idempotent pass
# and means one command covers a new device end to end.
- name: Check the device list
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate devices before anything acts on it
      ansible.builtin.import_tasks: tasks/check_devices.yml

# connection: local because the gateway speaks HTTPS and not SSH. The host
# entry exists to carry its address and its credentials, nothing more. Same
# pattern, and the same warning about overriding inventory from play vars, as
# tailscale-key.yml.
- name: Client entries and address reservations on the gateway
  hosts: unifi
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_become: false
  roles:
    - unifi
  tags: [devices, unifi]

- name: Per-device policy in AdGuard
  hosts: adguard
  gather_facts: false
  tasks:
    - name: Apply the client policy
      ansible.builtin.import_role:
        name: adguard
        tasks_from: clients
  tags: [devices, dns]
