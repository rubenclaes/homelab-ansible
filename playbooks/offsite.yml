---
# Off-site back-up naar Cloudflare R2.
#
#   ansible-playbook playbooks/offsite.yml
#
# Twee kanten, in een run:
#   docker  elke nacht om 02:00 een file-level back-up van de app-data en de
#           foto's naar PBS (roles/pbs_client).
#   pbs     de R2-datastore, de sync job en r2-guard (roles/pbs, tag offsite).
#
# Het waarom staat op de docs-site: Proxmox → Back-ups, "Buiten het huis:
# Cloudflare R2".
#
# In site.yml: nee, maar pbs.yml eronder wel. Draai restore-drill.yml na elke
# wijziging hier: een herstelpad dat nooit gelopen heeft is een aanname.

- name: Nightly file-level backup of the docker app data
  hosts: docker
  become: true
  roles:
    - pbs_client
  tags: [offsite, backup]

- name: Off-site copy on PBS
  ansible.builtin.import_playbook: pbs.yml
