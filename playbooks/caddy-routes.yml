- name: Caddy routes
  hosts: caddy
  tasks:
    - name: Ensure route blocks in the Caddyfile
      ansible.builtin.blockinfile:
        path: /etc/caddy/Caddyfile
        marker: "# {mark} ANSIBLE ROUTE {{ item.name }}"
        block: |
          {{ item.name }}.neodata.be {
              import proxy_defaults
              reverse_proxy {{ item.upstream }}
          }
        backup: true
      loop: "{{ caddy_routes }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Reload caddy

  handlers:
    - name: Reload caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded