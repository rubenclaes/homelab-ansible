---
# Gezondheidsrapport over de hele estate, gepubliceerd op
# https://report.neodata.be.
#
#   ansible-playbook playbooks/report.yml
#
# Leest alleen. Per host: openstaande upgrades, of hij een herstart nodig
# heeft, schijfgebruik. Daarnaast de PBS-back-upgroepen, de vervaldatum van
# het wildcard-certificaat, en welke gepubliceerde Docker-poorten geen route
# hebben (`docker_ports_without_route` in host_vars/docker.yml dempt wat
# bewust geen route heeft).
#
# Niet in site.yml: traag, en hij hoort op een schema te staan in plaats van
# in elke converge.
#
# Draai hem zonder --limit, of neem localhost erin mee. De HTML wordt daar
# gerenderd; laat je localhost weg, dan is er niets om te publiceren en zegt
# de laatste play dat ook.
- name: Collect report data
  hosts: linux
  tasks:
    - name: Count pending upgrades # noqa: command-instead-of-module
      ansible.builtin.shell: set -o pipefail; apt-get -s dist-upgrade | grep -c '^Inst' || true
      args:
        executable: /bin/bash
      register: report_pending
      changed_when: false
      check_mode: false

    - name: Check whether a reboot is needed
      ansible.builtin.include_role:
        name: baseline
        tasks_from: reboot_check

    - name: Measure root disk usage
      ansible.builtin.shell: set -o pipefail; df --output=pcent / | tail -n1 | tr -dc '0-9'
      args:
        executable: /bin/bash
      register: report_disk
      changed_when: false
      check_mode: false

    - name: Build this host's report line
      ansible.builtin.set_fact:
        report_row:
          host: "{{ inventory_hostname }}"
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          kernel: "{{ ansible_facts['kernel'] }}"
          uptime_days: "{{ (ansible_facts['uptime_seconds'] / 86400) | round(1) }}"
          disk_used_pct: "{{ report_disk.stdout | int }}"
          pending: "{{ report_pending.stdout | int }}"
          reboot: "{{ baseline_reboot_needed | bool }}"

    - name: Show it
      ansible.builtin.debug:
        var: report_row

- name: Collect macOS report data
  hosts: macs
  tasks:
    # `mbp` is ansible_connection: local, which means "whatever machine is
    # running Ansible". Run from the MacBook that is a Mac; run from Semaphore
    # (LXC 104) it is a Debian container. Gating on the gathered facts keeps
    # both cases honest rather than reporting a Debian LXC as a Mac.
    - name: Report on this host only when it really is a Mac
      when: ansible_facts['system'] == 'Darwin'
      block:
        # One call, parsed twice below. This is the slow part of the play
        # (~45s per Mac) and softwareupdate has no fast path, so it must not
        # be run once per field. Progress goes to stderr, hence the redirect.
        - name: List pending macOS updates
          ansible.builtin.shell: softwareupdate --list 2>&1
          register: report_swu
          changed_when: false
          check_mode: false
          failed_when: false

        # Counts formulae and casks. `2>/dev/null` drops the "Downloading
        # Homebrew API data" progress line. A Mac without Homebrew yields an
        # empty list and therefore a count of zero, which reads as healthy;
        # that is acceptable here because roles/macos installs it anyway.
        - name: Count outdated Homebrew packages
          ansible.builtin.shell: "{{ macos_brew_path }}/brew outdated --quiet 2>/dev/null"
          register: report_brew
          changed_when: false
          check_mode: false
          failed_when: false

        # BSD df has no --output=pcent, so the Linux play's approach does not
        # port. NR==2 is the data line, $5 the capacity column.
        - name: Measure root disk usage
          ansible.builtin.shell: set -o pipefail; df -P / | awk 'NR==2 {print $5}' | tr -dc '0-9'
          args:
            executable: /bin/bash
          register: report_disk
          changed_when: false
          check_mode: false

        # Deliberately the same keys as the Linux play's report_row, so the
        # overview table in report.html.j2 needs no per-OS branching. Only the
        # sources differ: softwareupdate for apt, `Action: restart` for the
        # baseline role's reboot check.
        - name: Build this Mac's report line
          ansible.builtin.set_fact:
            report_row:
              host: "{{ inventory_hostname }}"
              os: "macOS {{ ansible_facts['distribution_version'] }}"
              kernel: "{{ ansible_facts['kernel'] }}"
              uptime_days: "{{ (ansible_facts['uptime_seconds'] / 86400) | round(1) }}"
              disk_used_pct: "{{ report_disk.stdout | int }}"
              pending: '{{ report_swu.stdout_lines | select("search", "^\s*\* Label:") | list | length }}'
              reboot: "{{ report_swu.stdout is search('Action: restart') }}"
            report_mac:
              brew_outdated: "{{ report_brew.stdout_lines | length }}"
              brew_packages: "{{ report_brew.stdout_lines }}"

        - name: Show it
          ansible.builtin.debug:
            var: report_row

- name: Collect Docker status
  hosts: docker
  gather_facts: false
  tasks:
    - name: Read all containers
      community.docker.docker_host_info:
        containers: true
        containers_all: true
        verbose_output: true
      register: report_docker

    - name: Simplify to project / name / state / status
      ansible.builtin.set_fact:
        report_containers: >-
          {{ report_containers | default([]) + [{
               'project': item.Labels['com.docker.compose.project'] | default('(none)'),
               'name': item.Names[0] | regex_replace('^/', ''),
               'state': item.State,
               'status': item.Status
             }] }}
      loop: "{{ report_docker.containers }}"
      loop_control:
        label: "{{ item.Names[0] }}"

    # Published ports, for the route-drift table in the report. A container
    # that publishes a port nobody proxies is reachable only as host:port,
    # and a route pointing at a port nothing publishes is a dead name - the
    # smoke test cannot see the first case at all, because it only tests
    # routes that already exist.
    - name: Collect published ports per container
      ansible.builtin.set_fact:
        report_published: >-
          {{ report_published | default([]) + (
               item.Ports | default([]) | selectattr('PublicPort', 'defined')
               | map(attribute='PublicPort') | unique | sort
               | map('community.general.dict_kv', 'port') | list
               | map('combine', {
                   'project': item.Labels['com.docker.compose.project'] | default('(none)'),
                   'name': item.Names[0] | regex_replace('^/', '')
                 }) | list
             ) }}
      loop: "{{ report_docker.containers }}"
      loop_control:
        label: "{{ item.Names[0] }}"
      when: item.Ports | default([]) | selectattr('PublicPort', 'defined') | list | length > 0

- name: Collect storage health
  hosts: pve01
  gather_facts: false
  tasks:
    - name: ZFS pools
      ansible.builtin.command: zpool list -H -o name,size,alloc,free,cap,health
      register: report_zpool
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Turn each pool line into a dictionary
      ansible.builtin.set_fact:
        report_pools: "{{ report_pools | default([]) + [dict(['name', 'size', 'alloc', 'free', 'cap', 'health'] | zip(item.split('\t')))] }}"
      loop: "{{ report_zpool.stdout_lines }}"

    - name: Is smartctl installed?
      ansible.builtin.stat:
        path: /usr/sbin/smartctl
      register: report_smartctl

    - name: Find disks
      ansible.builtin.command: smartctl --scan -j
      register: report_scan
      changed_when: false
      check_mode: false
      when: report_smartctl.stat.exists

    - name: Read health per disk
      ansible.builtin.command: smartctl -H -i -A -j {{ item.name }}
      loop: "{{ (report_scan.stdout | from_json).devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: report_smart
      changed_when: false
      check_mode: false
      failed_when: false
      when: report_smartctl.stat.exists

    - name: Simplify per disk
      ansible.builtin.set_fact:
        report_disks: >-
          {{ report_disks | default([]) + [{
               'device': item.item.name,
               'model': j.model_name | default('?'),
               'passed': j.smart_status.passed | default(false),
               'temp': j.temperature.current | default('?')
             }] }}
      vars:
        j: "{{ item.stdout | from_json }}"
      loop: "{{ report_smart.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

- name: Render the report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: All guests from Proxmox VE
      community.proxmox.proxmox_vm_info:
        api_host: "{{ hostvars['pve01'].pve_api_host }}"
        api_user: "{{ hostvars['pve01'].pve_api_user }}"
        api_token_id: "{{ hostvars['pve01'].pve_api_token_id }}"
        api_token_secret: "{{ hostvars['pve01'].pve_api_token_secret }}"
        node: pve01
        validate_certs: false
      register: report_guests

    - name: Backup groups from PBS
      ansible.builtin.uri:
        url: >-
          https://{{ hostvars['pbs'].ansible_host }}:8007/api2/json/admin/datastore/{{ report_pbs_datastore }}/groups
        headers:
          Authorization: "PBSAPIToken={{ report_pbs_token_id }}:{{ hostvars['pbs'].vault_pbs_report_token }}"
        validate_certs: false
        return_content: true
      register: report_backups
      no_log: true
      # Read-only, and the template needs the result: without this the task
      # skips under --check and rendering dies on an undefined variable.
      check_mode: false

    - name: Read the wildcard certificate
      community.crypto.get_certificate:
        host: "{{ report_cert_host }}"
        port: 443
      register: report_cert
      check_mode: false

    # The report lists internal hostnames, IPs and backup ages. Render it to a
    # private temp file rather than a predictable world-readable /tmp path,
    # because the control node may be shared (Semaphore runs as its own user).
    - name: Create a private temp file for the rendered report
      ansible.builtin.tempfile:
        state: file
        suffix: .html
      register: report_tmp
      changed_when: false
      check_mode: false

    - name: Render HTML
      ansible.builtin.template:
        src: report.html.j2
        dest: "{{ report_tmp.path }}"
        mode: "0600"
      # Renders to the control node's temp file even under --check, so the
      # upload task below can show a real diff of what would be published.
      # Removed again by the last play either way.
      check_mode: false

- name: Publish the report
  hosts: caddy
  gather_facts: false
  # The HTML is rendered by the localhost play above. A --limit that leaves
  # localhost out skips that play, so there is nothing to publish - and
  # reading report_tmp regardless fails during argument finalisation with an
  # opaque "object of type 'HostVarsVars' has no attribute 'report_tmp'".
  # Skipping deliberately turns that into a readable message.
  vars:
    report_rendered: "{{ 'localhost' in hostvars and hostvars['localhost'].report_tmp is defined }}"
  tasks:
    - name: Explain why nothing is published
      ansible.builtin.debug:
        msg: >-
          Nothing to publish: the render play did not run, so no report was
          produced. Include localhost in --limit, or drop --limit entirely.
      when: not report_rendered | bool

    - name: Ensure the report directory exists
      ansible.builtin.file:
        path: "{{ report_publish_dir }}"
        state: directory
        mode: "0755"
      when: report_rendered | bool

    - name: Upload the report
      ansible.builtin.copy:
        src: "{{ hostvars['localhost'].report_tmp.path }}"
        dest: "{{ report_publish_dir }}/index.html"
        mode: "0644"
      when: report_rendered | bool

- name: Clean up the control node
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove the rendered temp file
      ansible.builtin.file:
        path: "{{ report_tmp.path }}"
        state: absent
      changed_when: false
      check_mode: false
