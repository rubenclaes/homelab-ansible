---
# Gezondheidsrapport over de hele estate, gepubliceerd op
# https://report.neodata.be.
#
#   ansible-playbook playbooks/report.yml
#
# Leest alleen. Per host: openstaande upgrades, of hij een herstart nodig
# heeft, en schijfgebruik. Daarnaast de PBS-back-upgroepen, de vervaldatum van
# het wildcard-certificaat, en welke gepubliceerde Docker-poorten geen route
# hebben (`docker_ports_without_route` in host_vars/docker/main.yml dempt wat
# bewust geen route heeft).
#
# Draai hem zonder --limit, of neem localhost erin mee. De HTML wordt daar
# gerenderd; laat je localhost weg, dan is er niets om te publiceren en zegt
# de laatste play dat ook.
#
# In site.yml: nee, hij is traag en hoort op een schema in plaats van in elke
# converge.

- name: Collect report data
  hosts: linux
  vars:
    # Een `Inst`-regel uit `apt-get -s dist-upgrade` bevat alles wat het
    # tabblad Updates nodig heeft:
    #
    #   Inst libc6 [2.36-9+deb12u7] (2.36-9+deb12u10 Debian-Security:12/... [amd64])
    #        \1     \2               \3              \4
    #
    # De versie tussen blokhaken ontbreekt bij een pakket dat apt voor het
    # eerst binnenhaalt, dus groep 2 is optioneel en komt daar als null terug.
    report_apt_inst_re: '^Inst (\S+) (?:\[([^]]*)\] )?\((\S+) ([^)]*)\)'
  tasks:
    # Eén simulatie, twee keer gelezen: het aantal voor de overzichtstabel en
    # een regel per pakket voor het tabblad Updates. Apt een tweede keer om de
    # details vragen zou het traagste deel van deze play verdubbelen, voor
    # niets.
    - name: Simulate a dist-upgrade # noqa: command-instead-of-module
      ansible.builtin.command: apt-get -s dist-upgrade
      register: report_upgrade
      changed_when: false
      check_mode: false

    - name: Turn each Inst line into a package row
      ansible.builtin.set_fact:
        report_packages: >-
          {{ report_packages | default([]) + [{
               'name': f[0],
               'current': f[1] | default('', true),
               'candidate': f[2],
               'origin': f[3] | regex_replace(' \[[^]]*\]$', '')
             }] }}
      vars:
        f: "{{ item | regex_search(report_apt_inst_re, '\\1', '\\2', '\\3', '\\4') }}"
      loop: "{{ report_upgrade.stdout_lines | select('match', '^Inst ') | list }}"
      loop_control:
        label: "{{ item.split(' ')[1] }}"

    - name: Check whether a reboot is needed
      ansible.builtin.include_role:
        name: baseline
        tasks_from: reboot_check

    - name: Measure root disk usage
      ansible.builtin.shell: set -o pipefail; df --output=pcent / | tail -n1 | tr -dc '0-9'
      args:
        executable: /bin/bash
      register: report_disk
      changed_when: false
      check_mode: false

    - name: Build this host's report line
      ansible.builtin.set_fact:
        report_row:
          host: "{{ inventory_hostname }}"
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          kernel: "{{ ansible_facts['kernel'] }}"
          uptime_days: "{{ (ansible_facts['uptime_seconds'] / 86400) | round(1) }}"
          disk_used_pct: "{{ report_disk.stdout | int }}"
          pending: "{{ report_packages | default([]) | length }}"
          reboot: "{{ baseline_reboot_needed | bool }}"

    - name: Show it
      ansible.builtin.debug:
        var: report_row

- name: Collect macOS report data
  hosts: macs
  vars:
    # Elke aangeboden update drukt twee regels af; dit leest de tweede:
    #
    #   \tTitle: Safari, Version: 18.6, Size: 132316KiB, Recommended: YES,
    #             \1              \2
    #
    # De `* Label:`-regel erboven is de precieze aanduiding, maar de titel is
    # wat een mens herkent. Deze regels tellen in plaats van de labels houdt
    # het tabblad Updates en de overzichtskolom op één bron: twee tellingen
    # die uit elkaar kunnen lopen gaan elkaar ooit tegenspreken, en dan kan
    # het rapport niet zeggen welke van de twee klopt.
    report_swu_re: 'Title: (.+?), Version: ([^,]+),'
  tasks:
    # `mbp` is ansible_connection: local, en dat betekent "de machine die
    # Ansible draait". Vanaf de MacBook is dat een Mac; vanuit Semaphore
    # (LXC 104) is het een Debian-container. Afgaan op de verzamelde facts
    # houdt beide gevallen eerlijk, in plaats van een Debian-LXC als Mac te
    # rapporteren.
    - name: Report on this host only when it really is a Mac
      when: ansible_facts['system'] == 'Darwin'
      block:
        # Eén aanroep, hieronder twee keer gelezen. Dit is het trage deel van
        # de play (~45s per Mac) en softwareupdate heeft geen snelle route,
        # dus hij mag niet één keer per veld draaien. Voortgang gaat naar
        # stderr, vandaar de redirect.
        - name: List pending macOS updates
          ansible.builtin.shell: softwareupdate --list 2>&1
          register: report_swu
          changed_when: false
          check_mode: false
          failed_when: false

        # `--json=v2` en geen `--quiet`: dezelfde ene aanroep levert nu ook de
        # geïnstalleerde en beschikbare versies die het tabblad Updates wil,
        # en JSON heeft geen last van de voortgangsregel "Downloading Homebrew
        # API data" die `2>/dev/null` vroeger wegwerkte, want de module houdt
        # stderr apart. Een Mac zonder Homebrew geeft helemaal geen stdout, en
        # de `or '{}'` hieronder maakt daar een lege lijst van in plaats van
        # een parsefout; dat leest als gezond, en roles/macos zet brew er toch
        # op.
        - name: Read outdated Homebrew packages
          ansible.builtin.command: "{{ macos_brew_path }}/brew outdated --json=v2"
          register: report_brew
          changed_when: false
          check_mode: false
          failed_when: false

        # Formulae en casks zijn twee lijsten in de JSON, maar voor een lezer
        # een pakketboom, dus ze worden er een. Een formula kan meerdere
        # versies naast elkaar geïnstalleerd hebben; ze samenvoegen houdt de
        # regel eerlijk, in plaats van er willekeurig één te kiezen.
        - name: Flatten outdated formulae and casks into rows
          ansible.builtin.set_fact:
            report_brew_rows: >-
              {{ report_brew_rows | default([]) + [{
                   'name': item.name,
                   'current': item.installed_versions | default([]) | join(', '),
                   'candidate': item.current_version | default('?')
                 }] }}
          vars:
            brew: "{{ (report_brew.stdout | trim or '{}') | from_json }}"
          loop: "{{ brew.formulae | default([]) + brew.casks | default([]) }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Turn each offered macOS update into a row
          ansible.builtin.set_fact:
            report_swu_rows: >-
              {{ report_swu_rows | default([]) + [{
                   'name': f[0] | trim,
                   'candidate': f[1] | trim
                 }] }}
          vars:
            f: "{{ item | regex_search(report_swu_re, '\\1', '\\2') }}"
          loop: "{{ report_swu.stdout_lines | select('search', report_swu_re) | list }}"
          loop_control:
            label: "{{ f[0] | trim }}"

        # BSD-df kent geen --output=pcent, dus de aanpak van de Linux-play
        # werkt hier niet. NR==2 is de dataregel, $5 de kolom met de vulling.
        - name: Measure root disk usage
          ansible.builtin.shell: set -o pipefail; df -P / | awk 'NR==2 {print $5}' | tr -dc '0-9'
          args:
            executable: /bin/bash
          register: report_disk
          changed_when: false
          check_mode: false

        # Met opzet dezelfde sleutels als report_row in de Linux-play, zodat de
        # overzichtstabel in report.html.j2 niet per besturingssysteem hoeft te
        # splitsen. Alleen de bronnen verschillen: softwareupdate in plaats van
        # apt, `Action: restart` in plaats van de herstartcheck van de
        # baseline-rol.
        #
        # `pending` telt Homebrew mee en niet alleen macOS, wat voor het
        # tabblad Updates bestond nog niet zo was. Dat moet ook: het tabblad
        # toont allebei, dus een Mac die 0 laat zien in het overzicht en een
        # brew-regel in het tabblad zou zichzelf op dezelfde pagina
        # tegenspreken. De Homebrew-kaart hieronder splitst het getal alsnog
        # uit per pakketboom.
        - name: Build this Mac's report line
          ansible.builtin.set_fact:
            report_row:
              host: "{{ inventory_hostname }}"
              os: "macOS {{ ansible_facts['distribution_version'] }}"
              kernel: "{{ ansible_facts['kernel'] }}"
              uptime_days: "{{ (ansible_facts['uptime_seconds'] / 86400) | round(1) }}"
              disk_used_pct: "{{ report_disk.stdout | int }}"
              pending: "{{ (report_swu_rows | default([]) | length) + (report_brew_rows | default([]) | length) }}"
              reboot: "{{ report_swu.stdout is search('Action: restart') }}"
            report_mac:
              brew_outdated: "{{ report_brew_rows | default([]) | length }}"
              brew_packages: "{{ report_brew_rows | default([]) | map(attribute='name') | list }}"

        - name: Show it
          ansible.builtin.debug:
            var: report_row

# Elke host die containers draait, niet alleen `docker`. Dat stond hier
# eerder wel zo, en daardoor keek de route-drift-tabel verderop naar één van
# de drie hosts. Tinyauth, bazarr, jellyfin en expenseowl stonden allemaal op
# de Mac mini, en zijn daarom nooit gemeld.
#
# Via de CLI en niet via community.docker.docker_host_info: die module heeft
# de Python-SDK op de doelhost nodig. Op Debian zet de docker_stacks-rol die
# neer, op macOS is er geen apt en ontbreekt zelfs `requests` in de
# systeem-Python. `docker ps --format json` werkt overal.
- name: Collect Docker status
  hosts: docker_hosts:macs
  gather_facts: false
  tasks:
    - name: Read all containers
      ansible.builtin.command: "{{ docker_stacks_docker_cli | default('docker') }} ps --all --format json"
      register: report_docker
      changed_when: false
      check_mode: false
      # Een Mac hoeft geen Docker te draaien. De MacBook hoort hier leeg te
      # blijven, en dat is geen fout.
      failed_when: false

    - name: Parse the container rows
      ansible.builtin.set_fact:
        report_rows: "{{ report_docker.stdout_lines | default([]) | map('from_json') | list }}"

    - name: Simplify to project / name / state / status
      ansible.builtin.set_fact:
        report_containers: >-
          {{ report_containers | default([]) + [{
               'project': (item.Labels | default('')
                           | regex_search('com\.docker\.compose\.project=([^,]+)', '\1')
                           | default(['(none)'], true) | first),
               'name': item.Names,
               'state': item.State,
               'status': item.Status
             }] }}
      loop: "{{ report_rows }}"
      loop_control:
        label: "{{ item.Names }}"

    # De gepubliceerde poorten, voor de route-drift-tabel in het rapport. Een
    # container die een poort publiceert waar niemand naartoe proxyt is alleen
    # als host:poort te bereiken, en een route die naar een poort wijst die
    # niets publiceert is een dode naam. Het eerste geval kan de smoketest
    # helemaal niet zien, want die test alleen routes die al bestaan.
    #
    # `Ports` is hier een string als "192.168.0.15:8081->8081/tcp, [::]:8081->8081/tcp",
    # dus de gepubliceerde poort is wat er vóór de pijl staat. Dubbel door
    # IPv4 en IPv6, vandaar unique.
    - name: Collect published ports per container
      ansible.builtin.set_fact:
        report_published: >-
          {{ report_published | default([]) + (
               item.Ports | default('') | regex_findall(':(\d+)->') | unique | map('int') | sort
               | map('community.general.dict_kv', 'port') | list
               | map('combine', {
                   'project': (item.Labels | default('')
                               | regex_search('com\.docker\.compose\.project=([^,]+)', '\1')
                               | default(['(none)'], true) | first),
                   'name': item.Names
                 }) | list
             ) }}
      loop: "{{ report_rows }}"
      loop_control:
        label: "{{ item.Names }}"
      when: item.Ports | default('') | length > 0

- name: Collect storage health
  hosts: pve01
  gather_facts: false
  tasks:
    - name: ZFS pools
      ansible.builtin.command: zpool list -H -o name,size,alloc,free,cap,health
      register: report_zpool
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Turn each pool line into a dictionary
      ansible.builtin.set_fact:
        report_pools: "{{ report_pools | default([]) + [dict(['name', 'size', 'alloc', 'free', 'cap', 'health'] | zip(item.split('\t')))] }}"
      loop: "{{ report_zpool.stdout_lines }}"

    - name: Is smartctl installed?
      ansible.builtin.stat:
        path: /usr/sbin/smartctl
      register: report_smartctl

    - name: Find disks
      ansible.builtin.command: smartctl --scan -j
      register: report_scan
      changed_when: false
      check_mode: false
      when: report_smartctl.stat.exists

    - name: Read health per disk
      ansible.builtin.command: smartctl -H -i -A -j {{ item.name }}
      loop: "{{ (report_scan.stdout | from_json).devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: report_smart
      changed_when: false
      check_mode: false
      failed_when: false
      when: report_smartctl.stat.exists

    - name: Simplify per disk
      ansible.builtin.set_fact:
        report_disks: >-
          {{ report_disks | default([]) + [{
               'device': item.item.name,
               'model': j.model_name | default('?'),
               'passed': j.smart_status.passed | default(false),
               'temp': j.temperature.current | default('?')
             }] }}
      vars:
        j: "{{ item.stdout | from_json }}"
      loop: "{{ report_smart.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

- name: Render the report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: All guests from Proxmox VE
      community.proxmox.proxmox_vm_info:
        api_host: "{{ hostvars['pve01'].pve_api_host }}"
        api_user: "{{ hostvars['pve01'].pve_api_user }}"
        api_token_id: "{{ hostvars['pve01'].pve_api_token_id }}"
        api_token_secret: "{{ hostvars['pve01'].pve_api_token_secret }}"
        node: pve01
        validate_certs: false
      register: report_guests

    - name: Read the last backup per group from PBS
      ansible.builtin.include_tasks: tasks/pbs_last_backups.yml

    # Het adres van de caddy-host, met de naam er alleen als SNI bij. Niet de
    # naam als `host`, en dat is op 23-09 met schade geleerd: deze play draait
    # op `localhost`, en dat is bij een Semaphore-run de Semaphore-container.
    # Proxmox zet in de /etc/hosts van elke guest een regel
    # `<ip> <hostnaam>.<searchdomain> <hostnaam>`, dus daar wijst
    # `semaphore.neodata.be` naar de container zelf. Die luistert op 3000 en
    # niet op 443, en de taak faalde met "Connection refused" - terwijl DNS het
    # goede antwoord gaf. /etc/hosts wint van DNS.
    #
    # Zo gevraagd maakt het niet meer uit waar deze play draait, en of de naam
    # toevallig botst met een hostnaam.
    - name: Read the wildcard certificate
      community.crypto.get_certificate:
        host: "{{ hostvars['caddy'].ansible_host }}"
        port: 443
        server_name: "{{ report_cert_host }}"
      register: report_cert
      check_mode: false

    # Het rapport noemt interne hostnamen, IP-adressen en hoe oud de back-ups
    # zijn. Renderen naar een privé tijdelijk bestand en niet naar een
    # voorspelbaar, voor iedereen leesbaar pad in /tmp, want de controller kan
    # gedeeld zijn (Semaphore draait als zijn eigen gebruiker).
    - name: Create a private temp file for the rendered report
      ansible.builtin.tempfile:
        state: file
        suffix: .html
      register: report_tmp
      changed_when: false
      check_mode: false

    - name: Render HTML
      ansible.builtin.template:
        src: report.html.j2
        dest: "{{ report_tmp.path }}"
        mode: "0600"
      # Rendert ook onder --check naar het tijdelijke bestand op de
      # controller, zodat de uploadtaak hieronder een echte diff kan tonen van
      # wat er gepubliceerd zou worden. De laatste play ruimt het hoe dan ook
      # weer op.
      check_mode: false

- name: Publish the report
  hosts: caddy
  gather_facts: false
  # De HTML wordt gerenderd door de localhost-play hierboven. Een --limit die
  # localhost weglaat slaat die play over, en dan is er niets te publiceren -
  # en report_tmp toch lezen loopt stuk tijdens het afmaken van de argumenten,
  # met het ondoorzichtige "object of type 'HostVarsVars' has no attribute
  # 'report_tmp'". Bewust overslaan maakt daar een leesbare melding van.
  vars:
    report_rendered: "{{ 'localhost' in hostvars and hostvars['localhost'].report_tmp is defined }}"
  tasks:
    - name: Explain why nothing is published
      ansible.builtin.debug:
        msg: >-
          Nothing to publish: the render play did not run, so no report was
          produced. Include localhost in --limit, or drop --limit entirely.
      when: not report_rendered | bool

    - name: Ensure the report directory exists
      ansible.builtin.file:
        path: "{{ report_publish_dir }}"
        state: directory
        mode: "0755"
      when: report_rendered | bool

    - name: Upload the report
      ansible.builtin.copy:
        src: "{{ hostvars['localhost'].report_tmp.path }}"
        dest: "{{ report_publish_dir }}/index.html"
        mode: "0644"
      when: report_rendered | bool

- name: Clean up the control node
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove the rendered temp file
      ansible.builtin.file:
        path: "{{ report_tmp.path }}"
        state: absent
      changed_when: false
      check_mode: false
