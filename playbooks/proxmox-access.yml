---
# Bewijst dat het API-token van Ansible (ansible@pve!automation) ziet wat de
# dynamische inventory nodig heeft.
#
#   ansible-playbook playbooks/proxmox-access.yml
#
# De rechten zelf staan in tofu/proxmox/access.tf; draai dit nadat je ze daar
# gewijzigd hebt.
#
# Hij bevraagt het guest-agent-endpoint via het TOKEN en niet met pvesh.
# Pvesh draait als root en zou slagen wat het token ook mag, en bewijst dus
# niets over wat de inventory-plugin echt te zien krijgt.
#
# In site.yml: ja. Leest alleen.

- name: Verify the token can reach the guest agent
  hosts: proxmox
  gather_facts: true
  tags: [proxmox, access]
  vars:
    proxmox_access_auth: >-
      PVEAPIToken={{ pve_api_user }}!{{ pve_api_token_id }}={{ pve_api_token_secret }}
  tasks:
    - name: List QEMU guests
      community.proxmox.proxmox_vm_info:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        node: "{{ ansible_facts['hostname'] }}"
        type: qemu
        validate_certs: false
      delegate_to: localhost
      become: false
      register: proxmox_access_qemu

    - name: Query the agent endpoint for each running QEMU guest
      ansible.builtin.uri:
        url: >-
          https://{{ pve_api_host }}:8006/api2/json/nodes/{{ ansible_facts['hostname'] }}/qemu/{{ item.vmid }}/agent/network-get-interfaces
        headers:
          Authorization: "{{ proxmox_access_auth }}"
        validate_certs: false
      loop: "{{ proxmox_access_qemu.proxmox_vms | selectattr('status', 'eq', 'running') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: proxmox_access_agent
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    # ansible.builtin.uri kent geen check-mode, dus de vraag hierboven wordt
    # overgeslagen onder --check en deze resultaten zijn leeg. Ze toch lezen
    # loopt stuk op item.status. In check-mode valt er niets te melden omdat
    # er niets gevraagd is: dat zeggen en doorlopen, want site.yml --check
    # moet groen blijven nu dit playbook in de converge zit.
    - name: Explain that reachability is not checked under --check
      ansible.builtin.debug:
        msg: "Bereikbaarheid van de guest agent is niet nagekeken onder --check: uri kan niet in check-mode"
      when: ansible_check_mode

    - name: Report reachability per guest
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }} (vmid {{ item.item.vmid }}):
          {{ 'agent bereikbaar' if item.status == 200
             else 'HTTP ' ~ item.status ~ (' - token mist VM.Monitor' if item.status == 403
             else ' - agent staat aan maar antwoordt niet in de guest') }}
      loop: "{{ proxmox_access_agent.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not ansible_check_mode

    - name: Fail if any guest is blocked by permissions
      ansible.builtin.assert:
        that: (proxmox_access_agent.results | selectattr('status', 'eq', 403) | list) | length == 0
        fail_msg: >-
          {{ proxmox_access_agent.results | selectattr('status', 'eq', 403)
             | map(attribute='item.name') | join(', ') }}
          gaf 403 - het token mist nog steeds VM.Monitor.
        success_msg: "Geen enkele guest wordt geblokkeerd door de rechten van het token"
      when: not ansible_check_mode
