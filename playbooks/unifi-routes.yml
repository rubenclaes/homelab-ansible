---
# Controleert of elke Caddy-route naar een adres wijst dat een toestel in
# UniFi nu echt heeft, met een Fixed IP. Vangt een upstream die verhuisd of
# weg is. En of elk netwerk de DNS uitdeelt uit unifi_expected_dns.
#
#   ansible-playbook playbooks/unifi-routes.yml
#
# Leest alleen. Verandert niets in UniFi of Caddy.
- name: Caddy routes and DNS against UniFi
  hosts: localhost
  gather_facts: false
  vars:
    # Routes die geen gewone client in UniFi zijn, met de reden erbij.
    unifi_route_check_skip:
      - unifi   # de UCG zelf: de gateway staat niet bij de clients
  tasks:
    - name: Read the clients from UniFi
      ansible.builtin.import_tasks: tasks/unifi_clients.yml

    - name: Collect every address UniFi knows
      ansible.builtin.set_fact:
        unifi_ips: >-
          {{ unifi_clients.json.data
             | selectattr('ipAddress', 'defined')
             | map(attribute='ipAddress') | list }}

    - name: Work out where every route points
      ansible.builtin.set_fact:
        unifi_route_ips: "{{ unifi_route_ips | default({}) | combine({item.name: route_ip}) }}"
      vars:
        route_ip: >-
          {{ (item.upstream | split(':') | first) if item.upstream is defined
             else hostvars[item.host].ansible_host }}
      when:
        - item.name not in unifi_route_check_skip
        - route_ip is ansible.utils.ipv4_address
        - route_ip is ansible.utils.in_network('192.168.0.0/24')
      loop: "{{ hostvars['caddy'].caddy_sites }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Every route must point at an address a device really has
      ansible.builtin.assert:
        that: missing | length == 0
        fail_msg: >-
          Geen toestel in UniFi heeft dit adres:
          {% for k in missing %}{{ k }} ({{ unifi_route_ips[k] }}){{ ', ' if not loop.last }}{% endfor %}
        quiet: true
      vars:
        missing: >-
          {{ unifi_route_ips | dict2items
             | rejectattr('value', 'in', unifi_ips)
             | map(attribute='key') | list }}

    # Zonder reservatie kan de UCG het adres van een upstream aan een ander
    # toestel geven zodra dat even offline is: dan breekt de route pas bij de
    # volgende herstart, en dit vangt het vooraf.
    - name: Read the reservations from UniFi
      ansible.builtin.import_tasks: tasks/unifi_reservations.yml

    # Caddy zelf erbij: geen route, maar zonder Caddy werkt er geen enkele.
    - name: Every route must point at a reserved address
      ansible.builtin.assert:
        that: unreserved | length == 0
        fail_msg: >-
          Zonder Fixed IP in UniFi:
          {% for ip in unreserved %}{{ ip }} ({{ checked | dict2items | selectattr('value', 'eq', ip)
          | map(attribute='key') | join(', ') }}){{ '; ' if not loop.last }}{% endfor %}.
          Zet ze vast in UniFi: Client Devices -> het toestel -> Settings -> Fixed IP.
        quiet: true
      vars:
        checked: "{{ unifi_route_ips | combine({'caddy': hostvars['caddy'].ansible_host}) }}"
        unreserved: >-
          {{ checked.values() | unique | reject('in', unifi_reserved_ips) | sort | list }}

    # Het oude API-pad, net als de reservaties: de nieuwe API toont geen
    # DHCP-instellingen.
    - name: Read the network settings from UniFi
      ansible.builtin.uri:
        url: "{{ unifi_api_url | regex_replace('/integration/v1$', '') }}/api/s/default/rest/networkconf"
        headers:
          X-API-KEY: "{{ unifi_api_key }}"
      register: unifi_networks

    - name: Every network must hand out the DNS servers in git
      ansible.builtin.assert:
        that: wrong | length == 0
        fail_msg: >-
          UniFi deelt andere DNS uit dan unifi_expected_dns: {{ wrong | join('; ') }}.
          Pas het aan in UniFi (Settings -> Networks, of VPN Server), niet hier.
        quiet: true
      vars:
        wrong: >-
          {%- set out = [] -%}
          {%- for name, want in unifi_expected_dns.items() -%}
          {%-   set net = unifi_networks.json.data | selectattr('name', 'eq', name) | first | default(none) -%}
          {%-   if net is none -%}
          {%-     set _ = out.append(name ~ ': bestaat niet in UniFi') -%}
          {%-   else -%}
          {%-     set have = [] -%}
          {%-     for i in range(1, 5) if net['dhcpd_dns_' ~ i] | default('') -%}
          {%-       set _ = have.append(net['dhcpd_dns_' ~ i]) -%}
          {%-     endfor -%}
          {%-     if have != want -%}
          {%-       set _ = out.append(name ~ ': ' ~ (have | join(', ') or 'automatisch') ~ ' in plaats van ' ~ want | join(', ')) -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}
