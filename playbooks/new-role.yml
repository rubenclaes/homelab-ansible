---
# Zet een nieuwe rol op voor een dienst die geen Docker-container is.
#
#   ansible-playbook playbooks/new-role.yml \
#     -e svc_name=vaultwarden \
#     -e svc_host=vaultwarden \
#     -e svc_tag=secrets \
#     -e '{"svc_desc": "Vaultwarden - wachtwoordkluis"}'
#
# Een waarde met spaties MOET als JSON binnenkomen. `-e key=value` wordt
# spatie-gescheiden gelezen, dus -e 'svc_desc=a b c' wordt stilletjes
# svc_desc=a met twee losse woorden. Aanhalingstekens in de shell helpen niet.
# Zelfde valkuil als in new-service.yml.
#
# Waarom dit bestaat: adguard, caddy, pbs, tailscale en semaphore zijn
# allemaal met de hand opgezet volgens hetzelfde patroon - installeren op
# versie, config schrijven met validate, dienst aan, handler bij wijziging -
# maar dat patroon stond nergens. Nu staat het in de gegenereerde bestanden,
# als commentaar dat je overschrijft terwijl je het leest.
#
# Voor een Docker-dienst is dit het verkeerde playbook: dat is
# new-service.yml, dat een compose-stack maakt in plaats van een rol.
#
# Wat dit NIET doet: de rol in site.yml zetten. De volgorde daar is
# afhankelijkheidsvolgorde en geen playbook weet waar jouw dienst hoort. De
# twee regels om te plakken staan aan het eind van de run.
- name: Scaffold een nieuwe rol
  hosts: localhost
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    role_dir: "{{ playbook_dir }}/../roles/{{ svc_name | default('') }}"
    role_playbook: "{{ playbook_dir }}/{{ svc_name | default('') }}.yml"
    svc_tag: "{{ svc_name | default('') }}"
    svc_desc: "TODO: beschrijf deze dienst"
    svc_host: "{{ svc_name | default('') }}"

  tasks:
    - name: Eis de argumenten die geen zinnige default hebben
      ansible.builtin.assert:
        that:
          - svc_name is defined and svc_name | length > 0
          - svc_name is match('^[a-z][a-z0-9_]*$')
        fail_msg: |
          Ontbrekende of ongeldige naam. Minimaal:
            ansible-playbook playbooks/new-role.yml -e svc_name=<naam>
          Kleine letters, cijfers en underscores; dat is wat Ansible als
          rolnaam accepteert en wat de bestaande rollen aanhouden.
          Optioneel: svc_host, svc_tag, svc_desc
        success_msg: "Rol {{ svc_name | default('?') }} aanmaken"

    # Overschrijven zou een bestaande rol stilletjes platgooien, en die staat
    # in git maar je niet-gecommitte wijziging niet.
    - name: Weiger een rol die al bestaat
      ansible.builtin.assert:
        that:
          - not (role_dir is exists)
          - not (role_playbook is exists)
        fail_msg: >-
          roles/{{ svc_name }} of playbooks/{{ svc_name }}.yml bestaat al.
          Kies een andere naam, of werk verder in wat er staat.
        success_msg: "roles/{{ svc_name }} is vrij"

    - name: Maak de mappen
      ansible.builtin.file:
        path: "{{ role_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [tasks, defaults, handlers, meta, templates]

    # variable_start_string op [[ ]], zodat de {{ }} in de gegenereerde rol
    # gewoon blijven staan in plaats van hier al ingevuld te worden. Zonder
    # die truc moet elke Ansible-variabele in een scaffold-template ontsnapt
    # worden en leest het sjabloon nergens meer naar.
    - name: Schrijf de rolbestanden
      ansible.builtin.template:
        src: "new-role/{{ item.src }}"
        dest: "{{ role_dir }}/{{ item.dest }}"
        mode: "0644"
        variable_start_string: "[["
        variable_end_string: "]]"
      loop:
        - { src: tasks.yml.j2, dest: tasks/main.yml }
        - { src: defaults.yml.j2, dest: defaults/main.yml }
        - { src: handlers.yml.j2, dest: handlers/main.yml }
        - { src: meta.yml.j2, dest: meta/main.yml }
      loop_control:
        label: "{{ item.dest }}"

    - name: Schrijf de wrapper-playbook
      ansible.builtin.template:
        src: new-role/playbook.yml.j2
        dest: "{{ role_playbook }}"
        mode: "0644"
        variable_start_string: "[["
        variable_end_string: "]]"

    - name: Wat er nu moet gebeuren
      ansible.builtin.debug:
        msg:
          - "roles/{{ svc_name }}/ en playbooks/{{ svc_name }}.yml staan er."
          - ""
          - "1. Vul roles/{{ svc_name }}/tasks/main.yml. De TODO's wijzen naar"
          - "   de rol die het dichtst bij jouw geval staat."
          - "2. Zet hem in playbooks/site.yml, op de plek waar hij hoort in de"
          - "   volgorde - na waar hij van afhangt, voor wat van hem afhangt:"
          - ""
          - "     - name: {{ svc_desc }}"
          - "       ansible.builtin.import_playbook: {{ svc_name }}.yml"
          - ""
          - "3. Zet de tags in de tabel in README.md, sectie 3:"
          - "     | {{ svc_desc }} | `{{ svc_name }}` `{{ svc_tag }}` |"
          - "4. Draait hij op een nieuwe LXC? Zet die eerst in pve_lxcs en"
          - "   bouw hem met new-guest.yml."
          - "5. ansible-playbook playbooks/{{ svc_name }}.yml --check --diff"
