---
# Semaphore UI: de webinterface die deze playbooks op een schema draait.
#
#   ansible-playbook playbooks/semaphore.yml
#
# De eerste play verzamelt alleen facts en raakt niets aan: de rol leest er
# de SSH-hostkey van elke host uit, zodat Semaphore ze vertrouwt. Zonder die
# facts faalt de rol met een uitleg.
#
# De templates en hun schema's staan apart, in
# playbooks/semaphore-templates.yml.
#
# In site.yml: ja, direct gevolgd door semaphore-templates.yml.

- name: Gather facts from all managed hosts
  hosts: linux:macs:!mbp
  gather_facts: true
  tasks: []

- name: Semaphore UI
  hosts: semaphore
  roles:
    - semaphore
  tags: [semaphore]
