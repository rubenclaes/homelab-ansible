---
# De reverse proxy: elke *.neodata.be-route, met het wildcard-certificaat.
#
#   ansible-playbook playbooks/caddy.yml
#
# oauth2-proxy gaat voorop: de Caddyfile verwijst ernaar (forward_auth), dus
# die moet al luisteren voordat Caddy herlaadt, anders geven de beschermde
# sites 502.
#
# In site.yml: ja. Draai daarna smoketest.yml, die vraagt elke route echt op.

- name: Caddy reverse proxy
  hosts: caddy
  roles:
    - role: oauth2_proxy
      when: caddy_forward_auth | default(false)
      tags: [oauth2_proxy]
    - caddy
  tags: [caddy, web]
