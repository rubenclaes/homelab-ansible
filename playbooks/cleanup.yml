---
# Schijfruimte terugwinnen. Standaard veilig: zonder flag rapporteert hij
# alleen wat hij zou vrijmaken en verandert hij niets.
#
#   ansible-playbook playbooks/cleanup.yml                        # alleen rapport
#   ansible-playbook playbooks/cleanup.yml -e cleanup_apply=true  # echt opruimen
#
# `cleanup_apply` wordt gelezen met `| default(false)` en staat niet als play
# var, zodat hij ook in group_vars, host_vars of op de commandoregel kan. Een
# `vars:` op play-niveau overschrijdt de inventory stilletjes - zelfde
# redenering als in update.yml.
#
# Blijft staan, bij elke instelling:
#   - Docker-volumes. Daar staat de data van de stacks in (immich-postgres en
#     consorten). Er één weggooien is een herstel, geen opruiming.
#   - Containers, draaiend of gestopt. Een gestopte container houdt ook zijn
#     image buiten de prune hieronder, en daarom overleeft een `down` stack dit.
#   - Vastgezette pakketten. Autoremove respecteert dpkg-holds, dus de eigen
#     Caddy-build in baseline_held_packages blijft.
#   - Geinstalleerde Homebrew-versies. `brew cleanup` haalt achterhaalde
#     versies en oude downloads weg; wat nu gelinkt is blijft.
#
# In site.yml: nee, deze verwijdert. De knoppen staan in
# inventory/group_vars/all/cleanup.yml.

- name: Reclaim disk space on Debian hosts
  hosts: linux
  tasks:
    - name: Measure root disk usage
      ansible.builtin.shell: set -o pipefail; df --output=pcent / | tail -n1 | tr -dc '0-9'
      args:
        executable: /bin/bash
      register: cleanup_disk_before
      changed_when: false
      check_mode: false

    # De namen, niet alleen een aantal: op pve01 komen hier de oude
    # proxmox-kernel-*-pakketten naar boven, en die lijst zien voor je
    # opruimt is precies waar de rapportrun voor is.
    - name: List the packages autoremove would take # noqa: command-instead-of-module
      ansible.builtin.shell: set -o pipefail; apt-get -s autoremove | awk '/^Remv /{print $2}'
      args:
        executable: /bin/bash
      register: cleanup_apt_removable
      changed_when: false
      check_mode: false

    # systemd schrijft --disk-usage op LOG_INFO, en dat komt op stderr
    # terecht. Beide stromen gaan daarom naar stdout, in plaats van te gokken
    # welke van de twee het is.
    - name: Measure the journal on disk
      ansible.builtin.shell: journalctl --disk-usage 2>&1
      register: cleanup_journal_before
      changed_when: false
      check_mode: false

    - name: Report what could be reclaimed here
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: root {{ cleanup_disk_before.stdout | int }}% used,
          journal {{ cleanup_journal_before.stdout | regex_search('take up ([^ ]+)', '\1')
                     | default([], true) | first | default('unknown') }},
          {{ cleanup_apt_removable.stdout_lines | length }} autoremovable package(s)
          {{ cleanup_apt_removable.stdout_lines | join(', ') if cleanup_apt_removable.stdout_lines else '' }}

    - name: Reclaim it
      when: cleanup_apply | default(false) | bool
      block:
        # autoclean kan niet alleen staan - de required_one_of van de module
        # noemt hem niet - dus de twee draaien als één taak. autoclean gooit
        # archieven weg die apt niet meer kan ophalen; autoremove gooit
        # afhankelijkheden weg waar niets meer naar wijst.
        - name: Autoremove orphaned packages and stale apt archives
          ansible.builtin.apt:
            autoremove: true
            autoclean: true

        - name: Vacuum the journal
          ansible.builtin.shell: journalctl --vacuum-time={{ cleanup_journal_keep }} 2>&1
          register: cleanup_vacuum
          # journalctl eindigt altijd op 0 en drukt een "freed <grootte>"-regel
          # af per journal-map. Changed dus alleen als er ergens echt iets
          # vrijkwam: een kale `'freed 0B' not in stdout` zou een run
          # onveranderd noemen zodra /run/log/journal toevallig leeg was.
          changed_when: >-
            cleanup_vacuum.stdout_lines
            | select('search', 'freed')
            | reject('search', 'freed 0B')
            | list | length > 0

        - name: Measure root disk usage again
          ansible.builtin.shell: set -o pipefail; df --output=pcent / | tail -n1 | tr -dc '0-9'
          args:
            executable: /bin/bash
          register: cleanup_disk_after
          changed_when: false

        - name: Report what was reclaimed here
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: root {{ cleanup_disk_before.stdout | int }}%
              -> {{ cleanup_disk_after.stdout | int }}% used.
              {{ cleanup_vacuum.stdout_lines | select('search', 'freed') | join(' ') }}

- name: Reclaim disk space on Docker hosts
  hosts: docker_hosts
  tasks:
    - name: Read reclaimable Docker space # noqa: command-instead-of-module
      ansible.builtin.command: docker system df
      register: cleanup_docker_df
      changed_when: false
      check_mode: false

    - name: Report what could be reclaimed here
      ansible.builtin.debug:
        msg: "{{ [inventory_hostname ~ ':'] + cleanup_docker_df.stdout_lines }}"

    - name: Reclaim it
      when: cleanup_apply | default(false) | bool
      block:
        # docker_prune praat rechtstreeks met de Docker-API en heeft daarvoor
        # requests nodig, niet de Docker SDK voor Python. docker_stacks zet
        # zijn eigen bibliotheken op `docker`, maar docker-grafana-stack zit
        # niet in die rol; hier zetten betekent dat deze play op beide engines
        # op eigen benen staat. Binnen het block en niet erboven: een
        # rapportrun installeert niets, en `docker system df` hierboven is een
        # gewoon commando dat geen bibliotheek nodig heeft.
        - name: Ensure Python libraries for the Docker modules
          ansible.builtin.apt:
            name: python3-requests
            state: present

        # Images krijgen een leeftijdsfilter, build cache niet, want fout zijn
        # kost bij die twee iets anders. Een image dat toch nodig blijkt moet
        # opnieuw over het netwerk binnenkomen; build cache hoeft alleen
        # opnieuw gebouwd te worden. `until` kijkt bovendien naar het moment
        # waarop het image gemaakt is en niet naar wanneer jij het ophaalde,
        # dus een upstream-image dat al lang stilstaat telt als oud ook al
        # kwam het gisteren binnen - nog een reden om een venster op images te
        # houden en niet op afgeleide cache.
        #
        # containers en volumes staan standaard al op false; ze staan er toch
        # uitgeschreven, want in een playbook dat verwijdert wint bedoeling
        # van defaults. De noqa staat op de taak en niet op de sleutel:
        # ansible-lint past jinja[spacing] per taak toe, dus een comment op
        # een geneste waarde wordt genegeerd.
        - name: Prune unused images, build cache and networks # noqa: jinja[spacing]
          community.docker.docker_prune:
            images: true
            images_filters:
              dangling: false
              # ansible-lint ziet de sleutelnaam `until` en past zijn regel voor
              # voorwaarden toe, die een kale variabele wil. Deze `until` is
              # een Docker-filterwaarde, waar een kale naam als letterlijke
              # tekst zou doorgaan. Vandaar de noqa op taakniveau.
              until: "{{ cleanup_docker_until }}"
            builder_cache: true
            builder_cache_all: true
            networks: true
            containers: false
            volumes: false
          register: cleanup_pruned

        - name: Report what was reclaimed here
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}:
              {{ cleanup_pruned.images | length }} image(s) and
              {{ cleanup_pruned.networks | length }} network(s) gone,
              {{ ((cleanup_pruned.images_space_reclaimed
                 + cleanup_pruned.builder_cache_space_reclaimed) / 1024 / 1024)
                 | round(1) }} MiB reclaimed.

# Homebrew bewaart elke download die hij ooit deed en elke versie die hij
# vervangen heeft. Op een Mac die uit source bouwt - de Mini, op macOS 14.6.1,
# waar Homebrew niet meer voor alles bottles levert - zijn dat tarballs bij de
# gigabyte.
#
# Dit staat hier en NIET als taak aan het eind van update.yml, waar het lijkt
# thuis te horen. Op de mbp draait `ansible` op de Python van Homebrew en is
# ansible_connection lokaal, dus een update-run kan net de interpreter hebben
# vervangen die de play uitvoert; `brew cleanup` zou dan de Cellar-map
# weggooien waar dat draaiende proces nog uit leest. update.yml zet
# HOMEBREW_NO_INSTALL_CLEANUP=1 om precies dat te voorkomen, en een
# opruimtaak achteraan zou dat ongedaan maken. Een aparte run upgradet niets,
# dus de gelinkte versie is de huidige en opruimen kan niets gevaarlijks
# meenemen.
- name: Reclaim disk space on the Macs
  hosts: macs
  gather_facts: false
  tasks:
    # `brew --cache` en geen vast ~/Library/Caches/Homebrew: de plek is aan
    # Homebrew om te bepalen, en hij antwoordt erop.
    - name: Measure the Homebrew cache
      ansible.builtin.shell: >-
        set -o pipefail;
        du -sk "$({{ macos_brew_path }}/brew --cache)" 2>/dev/null | cut -f1 || echo 0
      args:
        executable: /bin/bash
      register: cleanup_brew_before
      changed_when: false
      check_mode: false

    # De groottes, niet alleen een aantal. Homebrew is hier voorzichtig:
    # zolang een upgrade nog openstaat houdt hij de download van de versie
    # waar je naartoe gaat, dus het getal hier is kleiner dan de cache op
    # schijf en wordt groter zodra update.yml gedraaid heeft.
    - name: List what a cleanup would remove
      ansible.builtin.command: >-
        {{ macos_brew_path }}/brew cleanup --dry-run --prune={{ cleanup_brew_prune }}
      register: cleanup_brew_dry
      changed_when: false
      check_mode: false

    # Los van cleanup, want ze halen iets anders weg. `cleanup` gooit oude
    # versies en downloads weg; `autoremove` gooit formulae weg die alleen
    # ooit als andermans afhankelijkheid zijn binnengekomen en nu los hangen.
    # Minikube uit een host_vars-lijst halen laat er een stuk of tien achter,
    # en geen enkele `brew cleanup` raakt die aan.
    - name: List the dependencies autoremove would take
      ansible.builtin.command: "{{ macos_brew_path }}/brew autoremove --dry-run"
      register: cleanup_brew_orphans
      changed_when: false
      check_mode: false

    - name: Report what could be reclaimed here
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: Homebrew cache
          {{ (cleanup_brew_before.stdout | int / 1024) | round(1) }} MiB,
          {{ cleanup_brew_orphans.stdout_lines | reject('search', '^==>') | select | list | length }} orphaned dependency/-ies,
          {{ cleanup_brew_dry.stdout_lines | select('search', '^Would remove') | list | length }}
          item(s) removable, freeing
          {{ cleanup_brew_dry.stdout | regex_search('would free approximately ([^ ]+)', '\1')
             | default([], true) | first | default('nothing') }}

    - name: Reclaim it
      when: cleanup_apply | default(false) | bool
      block:
        - name: Remove superseded versions and stale downloads
          ansible.builtin.command: >-
            {{ macos_brew_path }}/brew cleanup --prune={{ cleanup_brew_prune }}
          register: cleanup_brew_run
          # brew eindigt op 0 of hij nu iets weghaalde of niet, en drukt een
          # `Removing: <pad>`-regel af per item. Geen zo'n regel betekent dat
          # er niets weg is.
          changed_when: cleanup_brew_run.stdout is search('Removing:')

        # Na de formulae en niet ervoor: minikube deïnstalleren is juist wat
        # zijn afhankelijkheden los maakt, en de macos-rol draait in een ander
        # playbook. Hier draaien betekent dat de volgende opruimbeurt meeneemt
        # wat de vorige converge heeft losgetrokken.
        - name: Remove dependencies nothing needs any more
          ansible.builtin.command: "{{ macos_brew_path }}/brew autoremove"
          register: cleanup_brew_autoremoved
          # brew drukt helemaal niets af als er niets te halen valt, en eindigt
          # hoe dan ook op 0. Leegte is hier dus het signaal, geen trefwoord.
          changed_when: cleanup_brew_autoremoved.stdout | trim | length > 0

        - name: Measure the Homebrew cache again
          ansible.builtin.shell: >-
            set -o pipefail;
            du -sk "$({{ macos_brew_path }}/brew --cache)" 2>/dev/null | cut -f1 || echo 0
          args:
            executable: /bin/bash
          register: cleanup_brew_after
          changed_when: false

        - name: Report what was reclaimed here
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: Homebrew cache
              {{ (cleanup_brew_before.stdout | int / 1024) | round(1) }} MiB
              -> {{ (cleanup_brew_after.stdout | int / 1024) | round(1) }} MiB.
              {{ cleanup_brew_run.stdout | regex_search('has freed approximately ([^ ]+)', '\1')
                 | default([], true) | first | default('nothing freed') }}
