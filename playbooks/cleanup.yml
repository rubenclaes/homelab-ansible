---
# Reclaim disk space. Safe by default: with no switch it only reports what it
# would free and changes nothing.
#
#   cleanup_apply   actually reclaim                            (default false)
#
# Read with `| default(false)` rather than declared as a play var, so it can be
# set in group_vars, host_vars, or on the command line. A play-level `vars:`
# silently overrides inventory -- see the same reasoning in update.yml.
#
#   ansible-playbook playbooks/cleanup.yml                        # report only
#   ansible-playbook playbooks/cleanup.yml -e cleanup_apply=true  # reclaim
#
# Never touched, at any setting:
#   - Docker volumes. They hold the stacks' data (immich-postgres and friends).
#     Deleting one is a restore, not a cleanup.
#   - Containers, running or stopped. A stopped container also keeps its image
#     out of the prune below, which is why a `down` stack survives this.
#   - Held packages. dpkg holds are honoured by autoremove, so the custom Caddy
#     build in baseline_held_packages stays put.
#   - Installed Homebrew versions. `brew cleanup` removes superseded versions
#     and stale downloads; whatever is currently linked stays.
#
# Deliberately not in site.yml: this one deletes. Tunables live in
# inventory/group_vars/all/cleanup.yml.

- name: Reclaim disk space on Debian hosts
  hosts: linux
  tasks:
    - name: Measure root disk usage
      ansible.builtin.shell: set -o pipefail; df --output=pcent / | tail -n1 | tr -dc '0-9'
      args:
        executable: /bin/bash
      register: cleanup_disk_before
      changed_when: false
      check_mode: false

    # The names, not just a count: on pve01 this is where old proxmox-kernel-*
    # packages show up, and seeing the list before applying is the whole point
    # of the report run.
    - name: List the packages autoremove would take # noqa: command-instead-of-module
      ansible.builtin.shell: set -o pipefail; apt-get -s autoremove | awk '/^Remv /{print $2}'
      args:
        executable: /bin/bash
      register: cleanup_apt_removable
      changed_when: false
      check_mode: false

    # systemd logs --disk-usage at LOG_INFO, which lands on stderr, so both
    # streams are folded into stdout rather than guessing which one it is.
    - name: Measure the journal on disk
      ansible.builtin.shell: journalctl --disk-usage 2>&1
      register: cleanup_journal_before
      changed_when: false
      check_mode: false

    - name: Report what could be reclaimed here
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: root {{ cleanup_disk_before.stdout | int }}% used,
          journal {{ cleanup_journal_before.stdout | regex_search('take up ([^ ]+)', '\1')
                     | default([], true) | first | default('unknown') }},
          {{ cleanup_apt_removable.stdout_lines | length }} autoremovable package(s)
          {{ cleanup_apt_removable.stdout_lines | join(', ') if cleanup_apt_removable.stdout_lines else '' }}

    - name: Reclaim it
      when: cleanup_apply | default(false) | bool
      block:
        # autoclean cannot stand alone -- the module's required_one_of does not
        # list it -- so the two run as one task. autoclean drops archives apt
        # can no longer download; autoremove drops orphaned dependencies.
        - name: Autoremove orphaned packages and stale apt archives
          ansible.builtin.apt:
            autoremove: true
            autoclean: true

        - name: Vacuum the journal
          ansible.builtin.shell: journalctl --vacuum-time={{ cleanup_journal_keep }} 2>&1
          register: cleanup_vacuum
          # journalctl always exits 0 and prints one "freed <size>" line per
          # journal directory. Changed only when at least one of them freed
          # something -- a plain `'freed 0B' not in stdout` would call a run
          # unchanged whenever /run/log/journal happened to be empty.
          changed_when: >-
            cleanup_vacuum.stdout_lines
            | select('search', 'freed')
            | reject('search', 'freed 0B')
            | list | length > 0

        - name: Measure root disk usage again
          ansible.builtin.shell: set -o pipefail; df --output=pcent / | tail -n1 | tr -dc '0-9'
          args:
            executable: /bin/bash
          register: cleanup_disk_after
          changed_when: false

        - name: Report what was reclaimed here
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: root {{ cleanup_disk_before.stdout | int }}%
              -> {{ cleanup_disk_after.stdout | int }}% used.
              {{ cleanup_vacuum.stdout_lines | select('search', 'freed') | join(' ') }}

- name: Reclaim disk space on Docker hosts
  hosts: docker_hosts
  tasks:
    - name: Read reclaimable Docker space # noqa: command-instead-of-module
      ansible.builtin.command: docker system df
      register: cleanup_docker_df
      changed_when: false
      check_mode: false

    - name: Report what could be reclaimed here
      ansible.builtin.debug:
        msg: "{{ [inventory_hostname ~ ':'] + cleanup_docker_df.stdout_lines }}"

    - name: Reclaim it
      when: cleanup_apply | default(false) | bool
      block:
        # docker_prune speaks to the Docker API directly, which needs requests
        # -- not the Docker SDK for Python. docker_stacks installs its own
        # libraries on `docker`, but docker-grafana-stack is not in that role,
        # so ensure it here and this play stands on its own for both engines.
        # Inside the block, not above it: a report run installs nothing, and
        # `docker system df` above is a plain command that needs no library.
        - name: Ensure Python libraries for the Docker modules
          ansible.builtin.apt:
            name: python3-requests
            state: present

        # Images are age-filtered, build cache is not, because the two cost
        # different things to get wrong. An image that turns out to be needed
        # has to be pulled again over the network; build cache only has to be
        # rebuilt. `until` also measures the image's own creation timestamp
        # rather than when it was pulled, so a long-stable upstream image
        # counts as old even if it arrived yesterday -- another reason to keep
        # a window on images and not on derived cache.
        #
        # containers and volumes are false by default; they are spelled out
        # because in a playbook that deletes, intent beats defaults.
        # noqa on the task, not the key: ansible-lint applies jinja[spacing]
        # per task, so an inline comment on a nested value is ignored.
        - name: Prune unused images, build cache and networks # noqa: jinja[spacing]
          community.docker.docker_prune:
            images: true
            images_filters:
              dangling: false
              # ansible-lint sees the key name `until` and applies its rule for
              # conditional expressions, which want a bare variable. This
              # `until` is a Docker filter value, where a bare name would be
              # passed through as the literal string. Hence the task-level noqa.
              until: "{{ cleanup_docker_until }}"
            builder_cache: true
            builder_cache_all: true
            networks: true
            containers: false
            volumes: false
          register: cleanup_pruned

        - name: Report what was reclaimed here
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}:
              {{ cleanup_pruned.images | length }} image(s) and
              {{ cleanup_pruned.networks | length }} network(s) gone,
              {{ ((cleanup_pruned.images_space_reclaimed
                 + cleanup_pruned.builder_cache_space_reclaimed) / 1024 / 1024)
                 | round(1) }} MiB reclaimed.

# Homebrew keeps every download it has ever made and every version it has
# superseded. On a Mac that builds from source - the Mini, on macOS 14.6.1,
# where Homebrew no longer ships bottles for everything - that is source
# tarballs by the gigabyte.
#
# This lives here and NOT as a task at the end of update.yml, which is where it
# looks like it belongs. On the mbp, `ansible` itself comes from Homebrew and
# ansible_connection is local, so an update run can have just replaced the
# interpreter that is executing the play; `brew cleanup` would then delete the
# Cellar directory that running process still reads from. update.yml sets
# HOMEBREW_NO_INSTALL_CLEANUP=1 to prevent exactly that, and a cleanup task
# bolted onto the end would undo it. A separate run upgrades nothing, so the
# linked version is the current one and cleanup has nothing dangerous to take.
- name: Reclaim disk space on the Macs
  hosts: macs
  gather_facts: false
  tasks:
    # `brew --cache` rather than a hardcoded ~/Library/Caches/Homebrew: the
    # location is Homebrew's to decide and it answers for it.
    - name: Measure the Homebrew cache
      ansible.builtin.shell: >-
        set -o pipefail;
        du -sk "$({{ macos_brew_path }}/brew --cache)" 2>/dev/null | cut -f1 || echo 0
      args:
        executable: /bin/bash
      register: cleanup_brew_before
      changed_when: false
      check_mode: false

    # The sizes, not just a count. Homebrew is conservative here: while an
    # upgrade is still pending it keeps the download for the version you are
    # about to move to, so the figure this reports is smaller than the cache on
    # disk and gets larger once update.yml has run.
    - name: List what a cleanup would remove
      ansible.builtin.command: >-
        {{ macos_brew_path }}/brew cleanup --dry-run --prune={{ cleanup_brew_prune }}
      register: cleanup_brew_dry
      changed_when: false
      check_mode: false

    - name: Report what could be reclaimed here
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: Homebrew cache
          {{ (cleanup_brew_before.stdout | int / 1024) | round(1) }} MiB,
          {{ cleanup_brew_dry.stdout_lines | select('search', '^Would remove') | list | length }}
          item(s) removable, freeing
          {{ cleanup_brew_dry.stdout | regex_search('would free approximately ([^ ]+)', '\1')
             | default([], true) | first | default('nothing') }}

    - name: Reclaim it
      when: cleanup_apply | default(false) | bool
      block:
        - name: Remove superseded versions and stale downloads
          ansible.builtin.command: >-
            {{ macos_brew_path }}/brew cleanup --prune={{ cleanup_brew_prune }}
          register: cleanup_brew_run
          # brew exits 0 whether or not it removed anything, and prints one
          # `Removing: <path>` line per item. No such line means nothing went.
          changed_when: cleanup_brew_run.stdout is search('Removing:')

        - name: Measure the Homebrew cache again
          ansible.builtin.shell: >-
            set -o pipefail;
            du -sk "$({{ macos_brew_path }}/brew --cache)" 2>/dev/null | cut -f1 || echo 0
          args:
            executable: /bin/bash
          register: cleanup_brew_after
          changed_when: false

        - name: Report what was reclaimed here
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: Homebrew cache
              {{ (cleanup_brew_before.stdout | int / 1024) | round(1) }} MiB
              -> {{ (cleanup_brew_after.stdout | int / 1024) | round(1) }} MiB.
              {{ cleanup_brew_run.stdout | regex_search('has freed approximately ([^ ]+)', '\1')
                 | default([], true) | first | default('nothing freed') }}
