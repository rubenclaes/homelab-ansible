---
# De bridges van pve01, op node-niveau.
#
#   ansible-playbook playbooks/proxmox-network.yml                  # alleen klaarzetten
#   ansible-playbook playbooks/proxmox-network.yml -e proxmox_network_apply=true
#
# Zonder de flag schrijft dit alleen /etc/network/interfaces.new en verandert
# er niets aan wat draait. Met de flag herlaadt de node zijn netwerk, terwijl
# jij er over datzelfde netwerk mee verbonden bent.
#
# Weet waar de machine fysiek staat voordat je die flag gebruikt. De
# dead-man switch zet de vorige configuratie terug als er iets misgaat, maar
# dat is een vangnet, geen garantie.
#
# Lees de live configuratie en vergelijk hem met
# inventory/group_vars/proxmox/network.yml voor de eerste echte apply. Die
# overname is een keer gemaakt en sindsdien niet opnieuw nagekeken; blind
# toepassen gaat ervan uit dat er ondertussen niets met de hand is gewijzigd.
#
# In site.yml: nee, en dat verandert niet.

- name: Proxmox node networking
  hosts: proxmox
  gather_facts: true
  roles:
    - proxmox_network
  tags: [proxmox, network]
