---
# Gecontroleerde systeemupdate: pakketten bijwerken, en herstarten alleen als
# je daar expliciet om vraagt.
#
#   ansible-playbook playbooks/update.yml                        # alleen pakketten
#   ansible-playbook playbooks/update.yml -e allow_reboot=true   # en herstarten
#
# De flags:
#   allow_reboot             herstart guests die dat nodig hebben  (standaard false)
#   allow_hypervisor_reboot  herstart ook pve01                    (standaard false)
#   allow_cask_upgrade       werk Homebrew-casks op de Macs bij    (standaard false)
#
# Per host, uit de inventory in plaats van de commandoregel:
#   macos_brew_upgrade       werk formulae op deze Mac bij         (standaard true)
#
# Alle vier worden gelezen met `| default(...)` en staan niet als play var,
# zodat ze ook in group_vars of host_vars kunnen. Een `vars:` op play-niveau
# zou de inventory stilletjes overschrijven.
#
# Eerst de guests helemaal af, dan pas de hypervisor. In een play zou pve01
# kunnen herstarten onder de guests die hij draait. De Macs staan daar los van
# en komen als laatste, om de reden die bij hun play staat.
#
# In site.yml: nee, dit werkt pakketten bij en kan herstarten. Draai daarna
# report.yml: de lijst openstaande updates hoort leeg te zijn.

- name: Update guests
  hosts: linux:!proxmox
  serial: 1
  tasks:
    - name: Patch this host
      ansible.builtin.import_tasks: tasks/update_host.yml

    - name: Reboot if needed and allowed
      ansible.builtin.reboot:
        reboot_timeout: 900
      when:
        - baseline_reboot_needed | bool
        - allow_reboot | default(false) | bool

- name: Update hypervisors
  hosts: proxmox
  serial: 1
  tasks:
    - name: Patch this host
      ansible.builtin.import_tasks: tasks/update_host.yml

    - name: Reboot if needed and doubly allowed
      ansible.builtin.reboot:
        reboot_timeout: 900
      when:
        - baseline_reboot_needed | bool
        - allow_reboot | default(false) | bool
        - allow_hypervisor_reboot | default(false) | bool

    - name: Warn when the hypervisor needs a reboot but is not allowed one
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} moet herstarten. Draai opnieuw met
          -e allow_reboot=true -e allow_hypervisor_reboot=true zodra de guests
          de downtime aankunnen.
      when:
        - baseline_reboot_needed | bool
        - not (allow_reboot | default(false) | bool and allow_hypervisor_reboot | default(false) | bool)

# De Macs zitten niet in `linux`, dus geen van de plays hierboven raakt ze
# aan; apt is hun pakketbeheerder niet. Ze komen met opzet als laatste:
# Homebrew op de mbp is eigenaar van de `ansible` die dit bestand uitvoert
# (ansible_connection is lokaal), en hem upgraden vervangt de interpreter
# midden in de run. Als laatste is dat venster zo klein mogelijk, en
# HOMEBREW_NO_INSTALL_CLEANUP houdt brew ervan af de Cellar-map te wissen
# waar dat draaiende proces nog uit leest.
#
# Geen `become` hier, met opzet: Homebrew weigert als root te draaien, en
# `macs` erft niets van de become-instellingen van de linux-groep.
- name: Update Macs
  hosts: macs
  serial: 1
  gather_facts: false
  environment:
    HOMEBREW_NO_INSTALL_CLEANUP: "1"
  tasks:
    # `upgrade_options: [formula]` wordt `brew upgrade --formula`, en dat is
    # geen detail. Een kale `brew upgrade` werkt formulae EN casks bij, en dat
    # zou dwars door de rem op de volgende taak heen lopen en Docker Desktop
    # herstarten op een run die alleen om pakketten vroeg. De module zet de
    # streepjes er zelf voor, dus de waarde staat er zonder.
    - name: Update Homebrew itself and upgrade every formula
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
        upgrade_options: [formula]
        path: "{{ macos_brew_path }}"
      when: macos_brew_upgrade | default(true) | bool

    # Niet stil. Een Mac die hier overgeslagen wordt krijgt geen
    # beveiligingsfixes meer voor alles wat via Homebrew binnenkwam, en dat is
    # een besluit dat iemand moet blijven zien in plaats van een jaar later
    # te ontdekken.
    - name: Say so when a Mac is deliberately left unpatched
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} overgeslagen: macos_brew_upgrade staat op
          false. Zijn formulae blijven staan op wat er nu geïnstalleerd is.
          Haal de flag uit zijn host_vars zodra de machine upgrades aankan.
      when: not (macos_brew_upgrade | default(true) | bool)

    # Standaard uit, want een cask-upgrade is geen pakket-upgrade: hij
    # vervangt applicaties. Op de Mini betekent dat docker-desktop, en Docker
    # daar herstarten trekt elke compose-stack op de machine mee omlaag. Vraag
    # erom wanneer je dat kan hebben, niet op een routinerun.
    #
    # `greedy` blijft op de default van de module (false), zodat casks die
    # zichzelf bijwerken - Spotify, Chromium - dat zelf mogen blijven doen in
    # plaats van onder een draaiende app te worden vervangen.
    - name: Upgrade casks
      community.general.homebrew_cask:
        upgrade_all: true
        path: "{{ macos_brew_path }}"
      when: allow_cask_upgrade | default(false) | bool
