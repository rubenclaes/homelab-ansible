---
# Bouwt de documentatiesite en zet hem op de caddy-host.
#
#   ansible-playbook playbooks/docs.yml
#
# De pagina's onder homelab/ worden uit de inventory gegenereerd - de
# machinepagina, en één pagina per route in caddy_sites (plus de diensten
# zonder route uit docker_services_without_route) - en kunnen dus
# niet uit de pas lopen. De runbooks zijn met de hand geschreven en worden
# alleen meegenomen. Een geschrapte route laat geen pagina achter: die wordt
# opgeruimd nadat de rest opnieuw gerenderd is.
#
# Draait `npm ci` en `npm run build` op de controller, niet op caddy, en
# stuurt alleen het resultaat door.
- name: Gather facts for the reference pages
  hosts: linux:macs
  gather_facts: true
  tasks: []

- name: Build the documentation site
  hosts: localhost
  gather_facts: false
  vars:
    docs_site: "{{ playbook_dir }}/../docs-site"
    # Eén pagina voor alle machines. Tot 23-09 waren dat er drie - hosts,
    # containers en stacks - die elk één laag toonden (Ansible, Proxmox,
    # Docker), zodat je ze moest combineren om te zien wat er op één machine
    # staat. Sinds dezelfde dag staan machines en diensten onder homelab/
    # (wat er is) en de runbooks onder runbooks/ (wat je doet); de oude
    # splitsing homelab/technisch zei niet waar je iets moest zoeken.
    docs_pages: [machines]
    docs_services: "{{ docs_site }}/content/homelab/diensten"
    # Read straight off the caddy host. Safe here because none of these values
    # contain a template themselves. A var whose VALUE is a hostvars template -
    # caddy_tinyauth_upstream was one, until it was removed - cannot be read
    # from a localhost play;
    # that is what broke docs.yml and report.yml before.
    caddy_domain: "{{ hostvars['caddy'].caddy_domain }}"
    caddy_sites: "{{ hostvars['caddy'].caddy_sites }}"
    pve_lxcs: "{{ hostvars['pve01'].pve_lxcs }}"
    pve_lxc_defaults: "{{ hostvars['pve01'].pve_lxc_defaults }}"
    # Elke host die stacks.yml beheert, niet alleen `docker`. Die regel is
    # daar `hosts: docker_hosts:macs` met een guard op een niet-lege
    # docker_stacks_list, en hier staat dezelfde: één hostvars-lookup liet
    # een tweede docker-host stil uit de pagina vallen, en een lijst die
    # incompleet is zonder dat te zeggen is erger dan geen lijst.
    docs_stack_hosts: >-
      {{ ((groups['docker_hosts'] | default([])) + (groups['macs'] | default([])))
         | unique | sort }}
    # Diensten zonder webroute (RustDesk) staan niet in caddy_sites maar in
    # docker_services_without_route van hun eigen host. Hier krijgt elk item
    # zijn host erbij, zodat de templates ze naast caddy_sites kunnen zetten.
    docs_unrouted: >-
      {%- set out = [] -%}
      {%- for h in docs_stack_hosts -%}
      {%- for s in hostvars[h].docker_services_without_route | default([]) -%}
      {%- set _ = out.append(s | combine({'host': h})) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
    docs_all_services: "{{ caddy_sites + docs_unrouted }}"
  pre_tasks:
    # De helft van deze pagina's komt uit hosts die homelab.proxmox.yml live
    # ophaalt. Laadt die bron niet - API plat, geen route, token verlopen -
    # dan bestaat `caddy` niet en klapt pas de eerste template die hem nodig
    # heeft eruit met `hostvars['caddy']` en verder niets, halverwege de run.
    # Hier staat de stop ervoor, met een zin die zegt waar je moet kijken:
    # het ligt aan de inventory, niet aan de site.
    - name: Check that the inventory loaded the hosts these pages come from
      ansible.builtin.assert:
        that:
          - "'caddy' in hostvars"
          - "'pve01' in hostvars"
          - docs_stack_hosts | length > 0
        fail_msg: >-
          De inventory is incompleet: caddy, pve01 of de docker-hosts
          ontbreken. Waarschijnlijk laadde homelab.proxmox.yml niet -
          controleer met `ansible-inventory --graph` of de Proxmox-API
          bereikbaar is. Er is niets geschreven.
        quiet: true

    # Beide lijsten schrijven naar services/<naam>.mdx. Heet een dienst zonder
    # route hetzelfde als een route, dan overschrijft de ene pagina de andere
    # zonder dat iets faalt.
    - name: Check that no unrouted service shares a name with a route
      ansible.builtin.assert:
        that: >-
          docs_all_services | map(attribute='name') | list | length
          == docs_all_services | map(attribute='name') | unique | list | length
        fail_msg: >-
          Een naam staat zowel in caddy_sites als in
          docker_services_without_route. Er is niets geschreven.
        quiet: true

  tasks:
    - name: Render the generated reference pages
      ansible.builtin.template:
        src: "docs/{{ item }}.md.j2"
        dest: "{{ docs_site }}/content/homelab/{{ item }}.mdx"
        mode: "0644"
      loop: "{{ docs_pages }}"

    # De pagina Toestellen komt uit UniFi, niet uit de inventory. Is UniFi
    # onbereikbaar (UCG herstart, sleutel ingetrokken), dan mag de rest van
    # de site gewoon gebouwd worden: de vorige versie van de pagina blijft
    # staan, en alleen als er nog geen is komt er een lege met die uitleg.
    - name: Devices page from UniFi
      block:
        - name: Read the clients from UniFi
          ansible.builtin.import_tasks: tasks/unifi_clients.yml

        - name: Read the reservations from UniFi
          ansible.builtin.import_tasks: tasks/unifi_reservations.yml

        # Sorteren op het laatste getal van het adres: als tekst komt .100
        # voor .6. Alles zit in één /24, dus dat getal volstaat.
        - name: Sort the clients by address
          ansible.builtin.set_fact:
            unifi_docs_clients: >-
              {%- set out = [] -%}
              {%- for c in unifi_clients.json.data -%}
              {%- set n = (c.ipAddress | default('0.0.0.999')).split('.') | last | int -%}
              {%- set _ = out.append(c | combine({'sortkey': '%03d' | format(n)})) -%}
              {%- endfor -%}
              {{ out }}
            unifi_docs_generated: "{{ now().strftime('%d-%m-%Y %H:%M') }}"

        - name: Render the devices page
          ansible.builtin.template:
            src: docs/toestellen.md.j2
            dest: "{{ docs_site }}/content/homelab/toestellen.mdx"
            mode: "0644"
      rescue:
        - name: Say that the devices page was not refreshed
          ansible.builtin.debug:
            msg: >-
              UniFi gaf geen antwoord ({{ ansible_failed_result.msg | default('onbekende fout') }}).
              De pagina Toestellen is niet bijgewerkt; de rest van de site wel.

        - name: Write a placeholder only if there is no devices page yet
          ansible.builtin.template:
            src: docs/toestellen.md.j2
            dest: "{{ docs_site }}/content/homelab/toestellen.mdx"
            mode: "0644"
            force: false
          vars:
            unifi_docs_clients: !!null

    - name: Ensure the per-service page directory exists
      ansible.builtin.file:
        path: "{{ docs_services }}"
        state: directory
        mode: "0755"

    - name: Render the services index
      ansible.builtin.template:
        src: docs/services.md.j2
        dest: "{{ docs_services }}/index.mdx"
        mode: "0644"

    - name: Render one page per service
      ansible.builtin.template:
        src: docs/service.md.j2
        dest: "{{ docs_services }}/{{ item.name }}.mdx"
        mode: "0644"
      loop: "{{ caddy_sites }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render one page per service without a web route
      ansible.builtin.template:
        src: docs/service-unrouted.md.j2
        dest: "{{ docs_services }}/{{ item.name }}.mdx"
        mode: "0644"
      loop: "{{ docs_unrouted }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render the per-service navigation
      ansible.builtin.template:
        src: docs/services-meta.js.j2
        dest: "{{ docs_services }}/_meta.js"
        mode: "0644"

    # Opruimen achteraf, niet de map wissen vooraf. Een geschrapte route mag
    # geen pagina achterlaten die er nog live uitziet - dat blijft waar - maar
    # eerst wissen betekent dat elke fout tussen het wissen en het renderen je
    # de hele set kost. Dat gebeurde op 22-09: de Proxmox-inventory laadde
    # niet, `hostvars['caddy']` klapte eruit, en wat er overbleef was een lege
    # map en 31 bestanden als verwijderd in de working tree.
    #
    # Deze volgorde heeft dat venster niet: de pagina's worden overschreven,
    # en pas als ze er allemaal staan gaat weg wat niet meer in caddy_sites
    # zit. Faalt er iets ervoor, dan staat de vorige set er nog gewoon.
    - name: Find the per-service pages on disk
      ansible.builtin.find:
        paths: "{{ docs_services }}"
        patterns: "*.mdx"
      register: docs_service_pages

    - name: Remove pages for services that are no longer routed
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ docs_service_pages.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: >-
        (item.path | basename | splitext | first)
        not in (['index'] + (docs_all_services | map(attribute='name') | list))

    # `npm ci` installs exactly what package-lock.json pins, and fails rather
    # than silently resolving something newer. Nextra is pinned to 4.5.0 on
    # purpose: see docs-site/package.json.
    #
    # Installed unconditionally, with no `creates:` guard on node_modules.
    # Semaphore re-clones the repo for every run, so the guard never fired
    # there; on a workstation it fired for the wrong reason, skipping the
    # install whenever node_modules existed - including after the lockfile
    # had moved on, which built the site against stale dependencies. npm's
    # cache (semaphore_npm_cache on the controller) keeps the unconditional
    # install cheap.
    - name: Install site dependencies
      ansible.builtin.command:
        cmd: npm ci --no-audit --no-fund
        chdir: "{{ docs_site }}"
      changed_when: true

    - name: Build the static site
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ docs_site }}"
      changed_when: true

    # Plain tar rather than community.general.archive: `-C out .` keeps the
    # paths relative to the site root, which archive cannot express as
    # cleanly. Same reason report.yml and the baseline role carry this noqa.
    - name: Pack the build for transfer # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: tar -czf out.tar.gz -C out .
        chdir: "{{ docs_site }}"
      changed_when: true

- name: Publish the documentation site
  hosts: caddy
  gather_facts: false
  vars:
    docs_root: /var/www/homelab-docs
  tasks:
    # Unpack into a fresh directory and swap it in, so a page deleted from the
    # site does not linger on disk, and a failed build cannot leave the live
    # site half-written.
    - name: Create a staging directory
      ansible.builtin.file:
        path: "{{ docs_root }}.new"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Unpack the site
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/../docs-site/out.tar.gz"
        dest: "{{ docs_root }}.new"
        mode: "0755"

    - name: Swap the new site in
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf {{ docs_root }}.old
        if [ -d {{ docs_root }} ]; then mv {{ docs_root }} {{ docs_root }}.old; fi
        mv {{ docs_root }}.new {{ docs_root }}
        rm -rf {{ docs_root }}.old
      args:
        executable: /bin/bash
      changed_when: true
