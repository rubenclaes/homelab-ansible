- name: Generate homelab documentation
  hosts: linux:macmini
  gather_facts: true
  tasks: []

- name: Render the docs page
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get the current commit hash
      ansible.builtin.command: git rev-parse --short HEAD
      register: docs_git
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Render HTML
      ansible.builtin.template:
        src: docs.html.j2
        dest: /tmp/homelab-docs.html
        mode: "0644"
      vars:
        docs_commit: "{{ docs_git.stdout | default('unknown') }}"

- name: Publish the docs page
  hosts: caddy
  gather_facts: false
  tasks:
    - name: Ensure the docs directory exists
      ansible.builtin.file:
        path: /var/www/homelab-docs
        state: directory
        mode: "0755"

    - name: Upload the docs page
      ansible.builtin.copy:
        src: /tmp/homelab-docs.html
        dest: /var/www/homelab-docs/index.html
        mode: "0644"
