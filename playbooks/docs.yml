- name: Gather facts for the reference pages
  hosts: linux:macs
  gather_facts: true
  tasks: []

- name: Build the documentation site
  hosts: localhost
  gather_facts: false
  vars:
    docs_site: "{{ playbook_dir }}/../docs-site"
    docs_pages: [hosts, containers, stacks]
    # Read straight off the caddy host. Safe here because none of these values
    # contain a template themselves. A var whose VALUE is a hostvars template -
    # caddy_tinyauth_upstream is the one - cannot be read from a localhost play;
    # that is what broke docs.yml and report.yml before.
    caddy_domain: "{{ hostvars['caddy'].caddy_domain }}"
    caddy_sites: "{{ hostvars['caddy'].caddy_sites }}"
    directory_categories: "{{ hostvars['caddy'].directory_categories }}"
    directory_services: "{{ hostvars['caddy'].directory_services }}"
    pve_lxcs: "{{ hostvars['pve01'].pve_lxcs }}"
    pve_lxc_defaults: "{{ hostvars['pve01'].pve_lxc_defaults }}"
    docker_stacks_list: "{{ hostvars['docker'].docker_stacks_list }}"
    docker_stacks_wait_for_mounts: "{{ hostvars['docker'].docker_stacks_wait_for_mounts }}"
  tasks:
    # A tile that points at a service which no longer exists is worse than no
    # tile: it looks live and 404s. Fail the run instead of rendering it.
    - name: Check the directory against the routes it claims
      ansible.builtin.assert:
        that:
          - directory_services.keys() | list | difference(caddy_sites | map(attribute='name') | list) | length == 0
          - directory_services.values() | list | map(attribute='category') | unique
            | difference(directory_categories.keys() | list) | length == 0
        fail_msg: >-
          directory.yml is out of step with caddy_sites.
          Unknown services: {{ directory_services.keys() | list
            | difference(caddy_sites | map(attribute='name') | list) | join(', ') | default('none', true) }}.
          Unknown categories: {{ directory_services.values() | list | map(attribute='category') | unique
            | difference(directory_categories.keys() | list) | join(', ') | default('none', true) }}.
        success_msg: "{{ directory_services | length }} tiles, all routed."

    # A reserved address that collides with a managed host is the failure worth
    # catching: put the printer on caddy's address and you find out when DNS
    # stops working, not before. The other three checks keep the list itself
    # honest - one spelling per MAC, no duplicates, no two devices on one IP.
    - name: Check the device list against the inventory
      ansible.builtin.assert:
        that:
          - devices.values() | list | selectattr('mac', 'match', mac_re) | list | length == devices | length
          - devices.values() | list | map(attribute='mac') | list | length
            == devices.values() | list | map(attribute='mac') | unique | list | length
          - device_ips | length == device_ips | unique | list | length
          - device_ips | intersect(inventory_ips) | length == 0
        fail_msg: >-
          devices.yml is wrong.
          Bad or uppercase MAC: {{ devices | dict2items
            | rejectattr('value.mac', 'match', mac_re) | map(attribute='key') | join(', ') | default('none', true) }}.
          Address also used by a managed host: {{ device_ips | intersect(inventory_ips) | join(', ') | default('none', true) }}.
        success_msg: "{{ devices | length }} devices, no address collisions."
      vars:
        mac_re: '^([0-9a-f]{2}:){5}[0-9a-f]{2}$'
        device_ips: "{{ devices.values() | list | selectattr('ip', 'defined') | map(attribute='ip') | list }}"
        inventory_ips: "{{ groups['all'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"

    - name: Render the generated reference pages
      ansible.builtin.template:
        src: "docs/{{ item }}.md.j2"
        dest: "{{ docs_site }}/content/technisch/{{ item }}.mdx"
        mode: "0644"
      loop: "{{ docs_pages }}"

    - name: Render the family-facing directory
      ansible.builtin.template:
        src: docs/diensten.md.j2
        dest: "{{ docs_site }}/content/diensten.mdx"
        mode: "0644"

    # Wiped and rebuilt rather than overwritten: a service deleted from
    # caddy_sites must not leave its page behind, and a stale page looks live.
    # Same absent -> directory swap this playbook already uses when publishing.
    - name: Clear the per-service pages
      ansible.builtin.file:
        path: "{{ docs_site }}/content/technisch/services"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Render the services index
      ansible.builtin.template:
        src: docs/services.md.j2
        dest: "{{ docs_site }}/content/technisch/services/index.mdx"
        mode: "0644"

    - name: Render one page per service
      ansible.builtin.template:
        src: docs/service.md.j2
        dest: "{{ docs_site }}/content/technisch/services/{{ item.name }}.mdx"
        mode: "0644"
      loop: "{{ caddy_sites }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render the per-service navigation
      ansible.builtin.template:
        src: docs/services-meta.js.j2
        dest: "{{ docs_site }}/content/technisch/services/_meta.js"
        mode: "0644"

    # `npm ci` installs exactly what package-lock.json pins, and fails rather
    # than silently resolving something newer. Nextra is pinned to 4.5.0 on
    # purpose: see docs-site/package.json.
    #
    # Installed unconditionally, with no `creates:` guard on node_modules.
    # Semaphore re-clones the repo for every run, so the guard never fired
    # there; on a workstation it fired for the wrong reason, skipping the
    # install whenever node_modules existed - including after the lockfile
    # had moved on, which built the site against stale dependencies. npm's
    # cache (semaphore_npm_cache on the controller) keeps the unconditional
    # install cheap.
    - name: Install site dependencies
      ansible.builtin.command:
        cmd: npm ci --no-audit --no-fund
        chdir: "{{ docs_site }}"
      changed_when: true

    - name: Build the static site
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ docs_site }}"
      changed_when: true

    # Plain tar rather than community.general.archive: `-C out .` keeps the
    # paths relative to the site root, which archive cannot express as
    # cleanly. Same reason report.yml and the baseline role carry this noqa.
    - name: Pack the build for transfer # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: tar -czf out.tar.gz -C out .
        chdir: "{{ docs_site }}"
      changed_when: true

- name: Publish the documentation site
  hosts: caddy
  gather_facts: false
  vars:
    docs_root: /var/www/homelab-docs
  tasks:
    # Unpack into a fresh directory and swap it in, so a page deleted from the
    # site does not linger on disk, and a failed build cannot leave the live
    # site half-written.
    - name: Create a staging directory
      ansible.builtin.file:
        path: "{{ docs_root }}.new"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Unpack the site
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/../docs-site/out.tar.gz"
        dest: "{{ docs_root }}.new"
        mode: "0755"

    - name: Swap the new site in
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf {{ docs_root }}.old
        if [ -d {{ docs_root }} ]; then mv {{ docs_root }} {{ docs_root }}.old; fi
        mv {{ docs_root }}.new {{ docs_root }}
        rm -rf {{ docs_root }}.old
      args:
        executable: /bin/bash
      changed_when: true
