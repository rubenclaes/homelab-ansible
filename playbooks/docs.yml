---
# Bouwt de documentatiesite en zet hem op de caddy-host.
#
#   ansible-playbook playbooks/docs.yml
#
# De pagina's onder homelab/ komen uit de inventory - de machinepagina, en één
# pagina per route in caddy_sites, plus de diensten zonder route uit
# docker_services_without_route - en kunnen dus niet uit de pas lopen. De rest
# van de site (Proxmox, Docker, Netwerk, ...) is met de hand geschreven en
# wordt alleen meegenomen.
#
# Op een dienstpagina staan die twee náást elkaar: de feiten uit de inventory
# in een blok tussen markers, dat elke run opnieuw geschreven wordt, en eronder
# de uitleg met de hand. Zo heeft een dienst één pagina in plaats van twee.
#
# `npm ci` en `npm run build` draaien op de controller, niet op caddy; alleen
# het resultaat gaat erheen.
#
# In site.yml: nee. Draai hem na elke wijziging in de inventory.

- name: Gather facts for the reference pages
  hosts: linux:macs
  gather_facts: true
  tasks: []

- name: Build the documentation site
  hosts: localhost
  gather_facts: false
  vars:
    docs_site: "{{ playbook_dir }}/../docs-site"
    # Eén pagina voor alle machines. Tot 23-09 waren dat er drie - hosts,
    # containers en stacks - die elk één laag toonden (Ansible, Proxmox,
    # Docker), zodat je ze moest combineren om te zien wat er op één machine
    # staat. Onder homelab/ staat alleen wat deze play maakt; de handgeschreven
    # pagina's staan per onderwerp (proxmox/, docker/, netwerk/, ...). Tot 25-09
    # stonden die in runbooks/, gesorteerd op soort taak (stuk, toevoegen,
    # onderhoud), zodat één onderwerp over vier mappen verspreid lag.
    docs_pages: [machines]
    docs_services: "{{ docs_site }}/content/homelab/diensten"
    # Rechtstreeks van de caddy-host gelezen. Dat kan hier, omdat geen van
    # deze waarden zelf een template bevat. Een var wiens WAARDE een
    # hostvars-template is - caddy_tinyauth_upstream was er zo een, tot hij
    # verdween - kan je niet uit een localhost-play lezen; daar gingen
    # docs.yml en report.yml eerder op stuk.
    caddy_domain: "{{ hostvars['caddy'].caddy_domain }}"
    caddy_sites: "{{ hostvars['caddy'].caddy_sites }}"
    # Elke host die stacks.yml beheert, niet alleen `docker`: één
    # hostvars-lookup liet een tweede docker-host stil uit de pagina vallen.
    docs_stack_hosts: "{{ groups['docker_hosts'] | default([]) | sort }}"
    # Diensten zonder webroute (RustDesk) staan niet in caddy_sites maar in
    # docker_services_without_route van hun eigen host. Hier krijgt elk item
    # zijn host erbij, zodat de templates ze naast caddy_sites kunnen zetten.
    docs_unrouted: >-
      {%- set out = [] -%}
      {%- for h in docs_stack_hosts -%}
      {%- for s in hostvars[h].docker_services_without_route | default([]) -%}
      {%- set _ = out.append(s | combine({'host': h})) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
    docs_all_services: "{{ caddy_sites + docs_unrouted }}"
    # De feiten van een dienst - adres, host, poort, stack - staan op zijn
    # pagina in een blok tussen deze merktekens. De pagina zelf wordt één keer
    # aangemaakt en daarna nooit meer overschreven, zodat de uitleg eronder van
    # jou is. Tot 30-09 stond die uitleg apart onder docker/ (Vaultwarden,
    # Outline, Immich, ...), naast de gegenereerde pagina van dezelfde dienst
    # onder zijn routenaam (vault, wiki, photos): twee pagina's voor één ding,
    # en de handgeschreven helft stond onder "hoe je iets doet" in plaats van
    # bij de dienst.
    #
    # Het is een MDX-commentaar, dus het staat niet op de site. Wijzig deze
    # tekst niet: blockinfile vindt de bestaande blokken dan niet meer en zet
    # een tweede onderaan elke pagina.
    docs_block_marker: '{/* {mark} feiten uit de inventory — geschreven door docs.yml */}'
  pre_tasks:
    # De helft van deze pagina's komt uit hosts die homelab.proxmox.yml live
    # ophaalt. Laadt die bron niet - API plat, geen route, token verlopen -
    # dan bestaat `caddy` niet en klapt pas de eerste template die hem nodig
    # heeft eruit met `hostvars['caddy']` en verder niets, halverwege de run.
    # Hier staat de stop ervoor, met een zin die zegt waar je moet kijken:
    # het ligt aan de inventory, niet aan de site.
    - name: Check that the inventory loaded the hosts these pages come from
      ansible.builtin.assert:
        that:
          - "'caddy' in hostvars"
          - "'pve01' in hostvars"
          - docs_stack_hosts | length > 0
        fail_msg: >-
          De inventory is incompleet: caddy, pve01 of de docker-hosts
          ontbreken. Waarschijnlijk laadde homelab.proxmox.yml niet -
          controleer met `ansible-inventory --graph` of de Proxmox-API
          bereikbaar is. Er is niets geschreven.
        quiet: true

    # Beide lijsten schrijven naar services/<naam>.mdx. Heet een dienst zonder
    # route hetzelfde als een route, dan overschrijft de ene pagina de andere
    # zonder dat iets faalt.
    - name: Check that no unrouted service shares a name with a route
      ansible.builtin.assert:
        that: >-
          docs_all_services | map(attribute='name') | list | length
          == docs_all_services | map(attribute='name') | unique | list | length
        fail_msg: >-
          Een naam staat zowel in caddy_sites als in
          docker_services_without_route. Er is niets geschreven.
        quiet: true

  tasks:
    - name: Render the generated reference pages
      ansible.builtin.template:
        src: "docs/{{ item }}.md.j2"
        dest: "{{ docs_site }}/content/homelab/{{ item }}.mdx"
        mode: "0644"
      loop: "{{ docs_pages }}"

    # De pagina Toestellen komt uit UniFi, niet uit de inventory. Is UniFi
    # onbereikbaar (UCG herstart, sleutel ingetrokken), dan mag de rest van
    # de site gewoon gebouwd worden: de vorige versie van de pagina blijft
    # staan, en alleen als er nog geen is komt er een lege met die uitleg.
    - name: Devices page from UniFi
      block:
        - name: Read the clients from UniFi
          ansible.builtin.import_tasks: tasks/unifi_clients.yml

        - name: Read the reservations from UniFi
          ansible.builtin.import_tasks: tasks/unifi_reservations.yml

        # Sorteren op het laatste getal van het adres: als tekst komt .100
        # voor .6. Alles zit in één /24, dus dat getal volstaat.
        - name: Sort the clients by address
          ansible.builtin.set_fact:
            unifi_docs_clients: >-
              {%- set out = [] -%}
              {%- for c in unifi_clients.json.data -%}
              {%- set n = (c.ipAddress | default('0.0.0.999')).split('.') | last | int -%}
              {%- set _ = out.append(c | combine({'sortkey': '%03d' | format(n)})) -%}
              {%- endfor -%}
              {{ out }}
            unifi_docs_generated: "{{ now().strftime('%d-%m-%Y %H:%M') }}"

        - name: Render the devices page
          ansible.builtin.template:
            src: docs/toestellen.md.j2
            dest: "{{ docs_site }}/content/homelab/toestellen.mdx"
            mode: "0644"
      rescue:
        - name: Say that the devices page was not refreshed
          ansible.builtin.debug:
            msg: >-
              UniFi gaf geen antwoord ({{ ansible_failed_result.msg | default('onbekende fout') }}).
              De pagina Toestellen is niet bijgewerkt; de rest van de site wel.

        - name: Write a placeholder only if there is no devices page yet
          ansible.builtin.template:
            src: docs/toestellen.md.j2
            dest: "{{ docs_site }}/content/homelab/toestellen.mdx"
            mode: "0644"
            force: false
          vars:
            unifi_docs_clients: !!null

    - name: Ensure the per-service page directory exists
      ansible.builtin.file:
        path: "{{ docs_services }}"
        state: directory
        mode: "0755"

    - name: Render the services index
      ansible.builtin.template:
        src: docs/services.md.j2
        dest: "{{ docs_services }}/index.mdx"
        mode: "0644"

    # De pagina zelf maken we één keer, en daarna nooit meer: `force: false`.
    # Wat erop staat buiten het feitenblok - een runbook, een naslagtabel met
    # paden die niet in de inventory staan - is handwerk dat een nieuwe render
    # niet mag wissen. Tot 30-09 stond dat handwerk apart onder docker/
    # (Vaultwarden, Outline, Immich, ...), naast de gegenereerde pagina van
    # dezelfde dienst onder zijn routenaam (vault, wiki, photos): twee
    # pagina's voor één ding, en geen van de twee compleet.
    - name: Create a page for each service that has none yet
      ansible.builtin.template:
        src: docs/dienst.md.j2
        dest: "{{ docs_services }}/{{ item.name }}.mdx"
        mode: "0644"
        force: false
      loop: "{{ docs_all_services }}"
      loop_control:
        label: "{{ item.name }}"

    # `| trim` houdt de laatste regel tegen de eindmarker aan; zonder dat
    # groeit er elke run een lege regel bij.
    - name: Write the facts block on each service page
      ansible.builtin.blockinfile:
        path: "{{ docs_services }}/{{ item.name }}.mdx"
        marker: "{{ docs_block_marker }}"
        block: "{{ lookup('template', 'docs/dienst-feiten.md.j2') | trim }}"
        mode: "0644"
      loop: "{{ caddy_sites }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Write the facts block on each page of a service without a web route
      ansible.builtin.blockinfile:
        path: "{{ docs_services }}/{{ item.name }}.mdx"
        marker: "{{ docs_block_marker }}"
        block: "{{ lookup('template', 'docs/dienst-feiten-unrouted.md.j2') | trim }}"
        mode: "0644"
      loop: "{{ docs_unrouted }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render the per-service navigation
      ansible.builtin.template:
        src: docs/services-meta.js.j2
        dest: "{{ docs_services }}/_meta.js"
        mode: "0644"

    # Opruimen achteraf, niet de map wissen vooraf. Een geschrapte route mag
    # geen pagina achterlaten die er nog live uitziet - dat blijft waar - maar
    # eerst wissen betekent dat elke fout tussen het wissen en het renderen je
    # de hele set kost. Dat gebeurde op 22-09: de Proxmox-inventory laadde
    # niet, `hostvars['caddy']` klapte eruit, en wat er overbleef was een lege
    # map en 31 bestanden als verwijderd in de working tree.
    #
    # Deze volgorde heeft dat venster niet: de pagina's worden overschreven,
    # en pas als ze er allemaal staan gaat weg wat niet meer in caddy_sites
    # zit. Faalt er iets ervoor, dan staat de vorige set er nog gewoon.
    #
    # Blind wissen mag niet meer, sinds de uitleg op dezelfde pagina staat:
    # een pagina met tekst ná de eindmarker is handwerk, en dat weggooien
    # omdat een route verhuisde of even anders heet is niet terug te draaien.
    # Die blijft staan, met een melding. Een pagina die niets anders bevat dan
    # het feitenblok gaat wel weg.
    - name: Find the per-service pages on disk
      ansible.builtin.find:
        paths: "{{ docs_services }}"
        patterns: "*.mdx"
      register: docs_service_pages

    - name: Read the pages of services that are no longer in the inventory
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: docs_orphan_pages
      loop: "{{ docs_service_pages.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: >-
        (item.path | basename | splitext | first)
        not in (['index'] + (docs_all_services | map(attribute='name') | list))

    - name: Remove the pages that hold nothing but the facts block
      ansible.builtin.file:
        path: "{{ item.source }}"
        state: absent
      loop: "{{ docs_orphan_pages.results | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.source | basename }}"
      when: >-
        ((item.content | b64decode).split(docs_block_marker | replace('{mark}', 'END'))
         | last | trim) == ''

    - name: Say which pages stay behind because someone wrote on them
      ansible.builtin.debug:
        msg: >-
          {{ item.source | basename }} hoort bij een dienst die niet meer in de
          inventory staat, maar er staat uitleg op. De pagina blijft staan -
          haal hem met de hand weg, of zet de tekst ergens anders neer.
      loop: "{{ docs_orphan_pages.results | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.source | basename }}"
      when: >-
        ((item.content | b64decode).split(docs_block_marker | replace('{mark}', 'END'))
         | last | trim) != ''

    # `npm ci` installeert exact wat package-lock.json vastlegt, en faalt
    # liever dan stilletjes iets nieuwers te pakken. Nextra staat met opzet
    # vast op 4.5.0: met 4.6.1 faalt de build op het prerenderen van bijna elke
    # pagina (getest op 10-10-2026). Eerst dat oplossen, dan pas bijwerken.
    #
    # Altijd, zonder `creates:`-guard op node_modules. Semaphore klont de repo
    # opnieuw voor elke run, dus daar sloeg die guard nooit aan; op een
    # werkplek sloeg hij om de verkeerde reden aan en sloeg de installatie
    # over zodra node_modules bestond - ook als de lockfile intussen verder
    # was, waarmee de site tegen verouderde dependencies gebouwd werd. De
    # cache van npm (semaphore_npm_cache op de controller) houdt de
    # onvoorwaardelijke installatie goedkoop.
    - name: Install site dependencies
      ansible.builtin.command:
        cmd: npm ci --no-audit --no-fund
        chdir: "{{ docs_site }}"
      changed_when: true

    - name: Build the static site
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ docs_site }}"
      changed_when: true

    # Gewone tar en geen community.general.archive: `-C out .` houdt de paden
    # relatief aan de site-root, en dat kan archive niet zo netjes zeggen.
    # Om dezelfde reden dragen report.yml en de baseline-rol deze noqa.
    - name: Pack the build for transfer # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: tar -czf out.tar.gz -C out .
        chdir: "{{ docs_site }}"
      changed_when: true

- name: Publish the documentation site
  hosts: caddy
  gather_facts: false
  vars:
    docs_root: "{{ docs_publish_dir }}"
  tasks:
    # Uitpakken in een verse map en die omwisselen, zodat een pagina die van
    # de site verdwenen is niet op schijf blijft hangen, en een mislukte build
    # de live site niet half beschreven achterlaat.
    - name: Create a staging directory
      ansible.builtin.file:
        path: "{{ docs_root }}.new"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Unpack the site
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/../docs-site/out.tar.gz"
        dest: "{{ docs_root }}.new"
        # Mappen doorzoekbaar, bestanden niet uitvoerbaar: 0755 op alles
        # maakte elke HTML-pagina een programma.
        mode: "u=rwX,go=rX"

    - name: Swap the new site in
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf {{ docs_root }}.old
        if [ -d {{ docs_root }} ]; then mv {{ docs_root }} {{ docs_root }}.old; fi
        mv {{ docs_root }}.new {{ docs_root }}
        rm -rf {{ docs_root }}.old
      args:
        executable: /bin/bash
      changed_when: true
