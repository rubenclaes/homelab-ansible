---
# Mints one single-use, pre-authorised Tailscale key and prints it once.
#
#   ansible-playbook playbooks/tailscale-key.yml -e label=pc-ouders
#
# For things with a command line - a Windows PC, a NAS, a Raspberry Pi - where
# `tailscale up --auth-key=...` is how you join. NOT for phones: the iOS and
# Android apps sign in through a browser and have nowhere to paste a key.
#
# `label` is free text. It becomes the key's description in the admin console
# and is the only trace the key leaves, so make it something you recognise.
# Not called `name`, because that is a task keyword and Ansible would read it
# in places where a variable was meant.
#
# Run it from the workstation, not from Semaphore: the key is printed, and a
# Semaphore task log would keep it.
#
# hosts: tailscale is only there for that host's variables - the OAuth client
# in its vault. Nothing connects to it: the play vars below make every task
# run locally, and override the linux group's ansible_become, which would
# otherwise sudo on the workstation. A play-level var overriding inventory is
# exactly the trap README warns about; here it is the point.
- name: Tailscale key
  hosts: tailscale
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_become: false
  tasks:
    # `is match` rather than `| regex_search`: the filter returns None when it
    # does not match, and a conditional has to be a boolean.
    - name: Require a label for the key
      ansible.builtin.assert:
        that:
          - label is defined
          - label is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: >-
          Pass -e label=<naam>, lowercase letters, digits and hyphens. It
          becomes the key's description in the Tailscale admin console, so
          make it something you will recognise later.
        quiet: true

    # public: the role's defaults (tag, expiry) stay visible for the message
    # below; without it they vanish when the include ends.
    - name: Mint the key
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: mint_key
        public: true
      vars:
        tailscale_key_description: "device-{{ label }}"
        tailscale_key_tags: "{{ tailscale_tags }}"

    # Shown once, on purpose. The API cannot show it again; if it is lost,
    # run this again and the unused key expires on its own.
    - name: Show the key
      ansible.builtin.debug:
        msg:
          - "Single-use key for {{ label }}, id {{ tailscale_minted_key_id }}, valid {{ tailscale_key_expiry_seconds }}s:"
          - "{{ tailscale_minted_key }}"
          - "On the device: tailscale up --auth-key={{ tailscale_minted_key }}"
          - "It joins pre-authorised, tagged {{ tailscale_tags | join(', ') }}, and the key is spent."
