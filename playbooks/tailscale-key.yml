---
# Maakt een Tailscale-sleutel aan: eenmalig, voorgeautoriseerd, en een keer
# getoond.
#
#   ansible-playbook playbooks/tailscale-key.yml -e label=pc-ouders
#
# Voor dingen met een commandoregel - een Windows-pc, een NAS, een Raspberry
# Pi - waar `tailscale up --auth-key=...` de manier is om erbij te komen.
# NIET voor telefoons: de iOS- en Android-app melden zich aan via een browser
# en hebben nergens om een sleutel te plakken.
#
# `label` is vrije tekst. Het wordt de omschrijving van de sleutel in de
# admin console en is het enige spoor dat de sleutel achterlaat, dus maak er
# iets van dat je herkent. Hij heet niet `name`, want dat is een
# task-keyword en Ansible zou het lezen waar een variabele bedoeld was.
#
# Draai dit vanaf de werkplek en niet vanuit Semaphore: de sleutel wordt
# afgedrukt, en een Semaphore-tasklog bewaart dat.
#
# `hosts: tailscale` is er alleen voor de OAuth-client, die sinds 23-09 in
# group_vars/tailnet/ staat en deze host via de groep in zijn vault bereikt.
# Er wordt niets verbonden: de play vars hieronder laten elke taak lokaal
# draaien, en overschrijven de ansible_become van de linux-groep, die anders
# zou sudo'en op de werkplek. Een play var die de inventory overschrijft is
# precies de val waar update.yml voor waarschuwt; hier is het de bedoeling.
#
# In site.yml: nee, dit maakt een geheim aan en drukt het af.

- name: Tailscale key
  hosts: tailscale
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_become: false
  tasks:
    # `is match` en geen `| regex_search`: dat filter geeft None terug als er
    # geen match is, en een voorwaarde moet een boolean zijn.
    - name: Require a label for the key
      ansible.builtin.assert:
        that:
          - label is defined
          - label is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: >-
          Geef -e label=<naam> mee: kleine letters, cijfers en streepjes. Het
          wordt de omschrijving van de sleutel in de Tailscale admin console,
          dus maak er iets van dat je later herkent.
        quiet: true

    # public: de defaults van de rol (tag, geldigheid) blijven zichtbaar voor
    # het bericht hieronder; zonder dat zijn ze weg zodra de include eindigt.
    - name: Mint the key
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: mint_key
        public: true
      vars:
        tailscale_key_description: "device-{{ label }}"
        tailscale_key_tags: "{{ tailscale_tags }}"

    # Eén keer getoond, met opzet. De API kan hem niet nog eens laten zien;
    # ben je hem kwijt, draai dit dan opnieuw - de ongebruikte sleutel
    # verloopt vanzelf.
    - name: Show the key
      ansible.builtin.debug:
        msg:
          - "Eenmalige sleutel voor {{ label }}, id {{ tailscale_minted_key_id }}, geldig {{ tailscale_key_expiry_seconds }}s:"
          - "{{ tailscale_minted_key }}"
          - "Op het toestel: tailscale up --auth-key={{ tailscale_minted_key }}"
          - "Hij komt voorgeautoriseerd binnen met tag {{ tailscale_tags | join(', ') }}, en de sleutel is op."
