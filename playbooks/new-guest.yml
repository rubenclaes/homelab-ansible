---
# Een nieuwe LXC-container klaarzetten, nadat OpenTofu hem gemaakt heeft.
#
#   1. Een regel in tofu/proxmox/containers.tf, dan: bin/tofu proxmox apply
#   2. ansible-playbook playbooks/new-guest.yml -e guest=<hostname>
#
# Wat dit doet: wachten tot hij luistert, zijn SSH-hostkey vertrouwen, het
# `ansible`-serviceaccount aanmaken en de baseline toepassen. Daarna is het
# een gewone host en mag site.yml erop.
#
# Wat dit NIET doet: de container maken (OpenTofu), of de dienst installeren
# (een eigen rol, of playbooks/new-service.yml).
- name: Make the new container reachable
  hosts: pve01
  gather_facts: true
  tasks:
    - name: Require a container that Proxmox knows
      ansible.builtin.assert:
        that:
          - guest is defined
          - guest in (groups['proxmox_all_lxc'] | default([]))
          - guest not in (groups['appliances'] | default([]))
        fail_msg: >-
          Pass -e guest=<hostname> of a container that exists. Proxmox knows:
          {{ groups['proxmox_all_lxc'] | default([]) | difference(groups['appliances'] | default([])) | sort | join(', ') }}.
          A new one: add it to tofu/proxmox/containers.tf and run
          `bin/tofu proxmox apply` first.
        success_msg: "Preparing {{ guest | default('?') }}"

    - name: Remember what Proxmox says about it
      ansible.builtin.set_fact:
        new_guest_ip: "{{ hostvars[guest].ansible_host }}"
        new_guest_vmid: "{{ hostvars[guest].proxmox_vmid }}"

    - name: Wait for SSH on {{ guest }}
      ansible.builtin.wait_for:
        host: "{{ new_guest_ip }}"
        port: 22
        timeout: 180
      delegate_to: localhost
      become: false

    # A container this new presents a host key nobody has seen, and Ansible
    # cannot accept an unknown key non-interactively. `pct exec` reads it
    # through the hypervisor rather than over the network, so this trusts a
    # key taken from the machine's own disk instead of whatever answers on
    # that address.
    - name: Read its SSH host key through the hypervisor
      ansible.builtin.command: pct exec {{ new_guest_vmid }} -- cat /etc/ssh/ssh_host_ed25519_key.pub
      register: new_guest_host_key
      changed_when: false

    - name: Trust that key on the controller
      ansible.builtin.known_hosts:
        name: "{{ new_guest_ip }}"
        key: >-
          {{ new_guest_ip }}
          {{ new_guest_host_key.stdout.split()[0] }}
          {{ new_guest_host_key.stdout.split()[1] }}
        state: present
      delegate_to: localhost
      become: false

    # The dynamic inventory was read before this container existed, so it is
    # not in it yet. This makes the plays below able to reach it now; the next
    # run picks it up from Proxmox like any other guest.
    - name: Add it to this run's inventory
      ansible.builtin.add_host:
        name: "{{ guest }}"
        ansible_host: "{{ new_guest_ip }}"
        groups: new_guest

# Root with a key, because OpenTofu puts the ansible@neodata key in root at
# creation (tofu/proxmox/containers.tf, user_account).
# A container that did NOT get that key needs `-u root -k` and a password; see
# playbooks/bootstrap.yml.
- name: Create the ansible service account
  hosts: new_guest
  gather_facts: true
  remote_user: root
  vars:
    svc_user: ansible
    svc_pubkey: "{{ lookup('file', '~/.ssh/ansible_ed25519.pub') }}"
  tasks:
    - name: Provision the service account
      ansible.builtin.import_tasks: tasks/bootstrap_host.yml

- name: Apply the baseline
  hosts: new_guest
  gather_facts: true
  vars:
    ansible_user: ansible
    ansible_become: true
  roles:
    - baseline

- name: What happens next
  hosts: new_guest
  gather_facts: false
  vars:
    ansible_user: ansible
    ansible_become: true
  tasks:
    - name: Say it
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} draait en is gebaselined."
          - ""
          - "1. Installeer de dienst. Een eigen rol, of voor een Docker-dienst:"
          - "   ansible-playbook playbooks/new-service.yml -e svc_name=... -e svc_port=... -e svc_image=..."
          - "2. Wil je hem op een naam bereiken, zet hem in caddy_sites"
          - "   (inventory/host_vars/caddy/main.yml) en draai playbooks/caddy.yml."
          - "3. Commit tofu/proxmox/containers.tf en de rest, anders bestaat deze machine alleen bij jou."
          - "4. ansible-playbook playbooks/site.yml --check --diff, om te zien dat alles klopt."
