---
# De Docker-engine op elke host die er een van ons draait, en daarna de stacks
# op elke host die er zelf een lijst voor heeft.
#
#   ansible-playbook playbooks/stacks.yml
#
# De inventory beslist wie meedoet: zet `docker_stacks_list` in de host_vars
# van een host en hij wordt beheerd, laat hem leeg en de rol raakt hem niet
# aan. Vroeger stond hier `hosts: docker`, de ene host waarvan de stacks
# beschreven waren, en kon een tweede docker-host er niet bij zonder dit
# bestand te wijzigen. De guard staat op de lijst en niet op de hostnaam,
# want anders maakt de rol alsnog een deploy-key en kloont hij de
# containers-repo op een host waar niets te doen valt.
#
# In site.yml: ja. Een nieuwe stack komt uit playbooks/new-service.yml; draai
# daarna caddy.yml voor de route en docs.yml voor de pagina.

- name: Docker engine
  hosts: docker_hosts
  roles:
    - docker_engine
  tags: [docker]

# Ook de Macs, die niet in docker_hosts zitten: daar komt de engine van de
# Docker Desktop-cask die de macos-rol installeert, niet uit een apt-repo.
# Wat erboven draait is verder identiek, en roles/docker_stacks/tasks/linux.yml
# houdt de Debian-only stukken bij elkaar.
- name: Docker stacks
  hosts: docker_hosts:macs
  roles:
    - role: docker_stacks
      when: docker_stacks_list | default([]) | length > 0
  tags: [docker]

# Na de stacks, want de homepage-stack maakt de map aan waar dit in schrijft.
# Ook hier beslist de inventory: de host die de homepage-stack draait.
- name: Homepage dashboard
  hosts: docker_hosts
  roles:
    - role: homepage
      when: "'homepage' in docker_stacks_list | default([]) | map(attribute='name')"
  tags: [docker, homepage]

# Na de stacks, want de container moet draaien. Audiobookshelf heeft geen
# configbestand: de login via Pocket ID gaat over zijn API.
- name: Audiobookshelf login via Pocket ID
  hosts: docker_hosts
  roles:
    - role: audiobookshelf
      when: "'media' in docker_stacks_list | default([]) | map(attribute='name')"
  tags: [docker, audiobookshelf]

# Na de stacks, want de containers moeten bestaan. Sonarr, Radarr en Prowlarr
# laten de login aan Caddy over; zie roles/arr_auth voor waarom.
- name: Arr apps leave the login to Caddy
  hosts: docker_hosts
  roles:
    - role: arr_auth
      when: "'media' in docker_stacks_list | default([]) | map(attribute='name')"
  tags: [docker, arr_auth]

# Na de stacks, want RomM leest config.yml bij het opstarten en wordt zo nodig
# herstart. Alleen netplay staat hier; de rest van dat bestand schrijft RomM.
- name: RomM settings
  hosts: docker_hosts
  roles:
    - role: romm
      when: "'romm' in docker_stacks_list | default([]) | map(attribute='name')"
  tags: [docker, romm]
