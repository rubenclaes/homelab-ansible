---
# De Docker-engine op elke host die er een van ons draait, en daarna de stacks
# op elke host die er zelf een lijst voor heeft.
#
#   ansible-playbook playbooks/stacks.yml
#
# De inventory beslist wie meedoet: zet `docker_stacks_list` in de host_vars
# van een host en hij wordt beheerd, laat hem leeg en de rol raakt hem niet
# aan. Vroeger stond hier `hosts: docker`, de ene host waarvan de stacks
# beschreven waren, en kon een tweede docker-host er niet bij zonder dit
# bestand te wijzigen. De guard staat op de lijst en niet op de hostnaam,
# want anders maakt de rol alsnog een deploy-key en kloont hij de
# containers-repo op een host waar niets te doen valt.
#
# In site.yml: ja. Een nieuwe stack komt uit playbooks/new-service.yml; draai
# daarna caddy.yml voor de route en docs.yml voor de pagina.

# Eén play, zodat de facts maar één keer per host verzameld worden. De
# volgorde binnen de play is de volgorde van uitvoeren:
#   docker_engine   de engine, op elke host in docker_hosts
#   docker_stacks   de stacks, op elke host met een docker_stacks_list
#   de rest         instellingen ín een stack, dus na de stacks: de container
#                   moet bestaan (Audiobookshelf, de arr-apps), of de stack maakt
#                   de map aan waar de rol in schrijft (Homepage), of de app
#                   leest zijn config bij het opstarten (RomM)
- name: Docker
  hosts: docker_hosts
  vars:
    stacks_here: "{{ docker_stacks_list | default([]) | map(attribute='name') | list }}"
  roles:
    - role: docker_engine
    - role: docker_stacks
      when: stacks_here | length > 0
    - role: homepage
      when: "'homepage' in stacks_here"
      tags: [homepage]
    # Geen configbestand: de login via Pocket ID gaat over zijn API.
    - role: audiobookshelf
      when: "'media' in stacks_here"
      tags: [audiobookshelf]
    # Sonarr, Radarr en Prowlarr laten de login aan Caddy over; zie de rol.
    - role: arr_auth
      when: "'media' in stacks_here"
      tags: [arr_auth]
    # Alleen netplay staat hier; de rest van config.yml schrijft RomM zelf.
    - role: romm
      when: "'romm' in stacks_here"
      tags: [romm]
  tags: [docker]
