---
# Het hoofdplaybook: brengt elke beheerde host naar de staat die de repo
# beschrijft.
#
#   ansible-playbook playbooks/site.yml
#
# Zo vaak draaien als je wil. Alles hierin is idempotent en verandert niets
# onomkeerbaars.
#
# Met opzet NIET hierin - draai die met de hand, ze maken machines aan of
# herstarten er een:
#   proxmox-oci.yml        maakt OCI-containers, en kan ze herbouwen
#   proxmox-network.yml    kan de hypervisor onbereikbaar maken
#   proxmox-autostart.yml  zet onboot aan op elke guest
#   restore-drill.yml      zet een back-up terug op een wegwerp-guest
#   bootstrap.yml          eerste contact, logt in als root, zie de runbooks
#   update.yml             pakketten bijwerken en herstarten
#   cleanup.yml            verwijdert: caches, oude images, losse pakketten
#   nfs.yml                sudo op de Mini vraagt een wachtwoord, dus -K
#   wsl.yml                de werklaptop: vaak uit, en sudo vraagt -K
#   report.yml             leest alleen, maar is traag; staat apart op schema
#   smoketest.yml          controleert, convergeert niet
#   drift.yml              controleert, convergeert niet

- name: Linux baseline
  hosts: linux
  roles: [baseline]
  tags: [baseline, linux]

- name: MacOS baseline
  hosts: macs
  roles: [macos]
  tags: [macos, workstation]

- name: Reverse proxy
  ansible.builtin.import_playbook: caddy.yml

# Na caddy.yml, want die rol zet de logbestanden op 0640 en pas daarna heeft
# het groepslidmaatschap dat de alloy-rol regelt effect.
- name: Log shipping
  ansible.builtin.import_playbook: alloy.yml

- name: DNS
  ansible.builtin.import_playbook: adguard.yml

- name: Tailnet client
  ansible.builtin.import_playbook: tailscale.yml

- name: Backup server
  ansible.builtin.import_playbook: pbs.yml

- name: Proxmox datacenter configuration
  ansible.builtin.import_playbook: proxmox-datacenter.yml

- name: Proxmox API token check
  ansible.builtin.import_playbook: proxmox-access.yml

- name: Docker stacks
  ansible.builtin.import_playbook: stacks.yml

- name: Semaphore UI
  ansible.builtin.import_playbook: semaphore.yml

# Direct na semaphore.yml, want die zet de dienst waar dit tegen praat. Merk op
# dat de geplande converge deze play juist NIET draait: "Site converge" gebruikt
# `--limit all:!mbp:!semaphore`, en dit playbook richt zich op `semaphore`. Dat
# is geen omissie - een schema dat zijn eigen schema's herschrijft terwijl het
# draait is precies wat je niet wil. Hij loopt mee als je site.yml met de hand
# en zonder limit draait.
- name: Semaphore templates
  ansible.builtin.import_playbook: semaphore-templates.yml

- name: Workstation dotfiles
  ansible.builtin.import_playbook: dotfiles.yml
