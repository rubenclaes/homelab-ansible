---
# Zet een nieuwe Docker-dienst in de steigers: compose-bestand, .env, vault,
# docker_stacks_list en caddy_sites. Alles wat vroeger vijf handmatige
# stappen was.
#
#   ansible-playbook playbooks/new-service.yml \
#     -e svc_name=memos \
#     -e svc_port=5230 \
#     -e svc_image=ghcr.io/usememos/memos:0.24.4 \
#     -e svc_volume=/var/opt/memos \
#     -e '{"svc_desc": "Memos - snelle notities"}'
#
# Een waarde met spaties MOET als JSON binnenkomen. Ansible leest -e key=value
# als een lijst paren gescheiden door spaties, dus -e 'svc_desc=a b c' wordt
# stilletjes svc_desc=a plus twee losse woorden. Quoten in de shell helpt niet.
#
# Erna: push de containers-repo, draai dan stacks.yml en caddy.yml. Het
# playbook drukt die stappen op het einde ook af.
#
# In site.yml: nee, dit schrijft in de repo en niet op een host.

- name: Scaffold a new Docker service
  hosts: localhost
  gather_facts: false

  vars:
    containers_repo: "{{ lookup('env', 'HOME') }}/Development/containers"
    svc_host: docker
    svc_subdomain: "{{ svc_name | default('') }}"
    svc_container_port: "{{ svc_port | default('') }}"
    svc_volume: /data
    svc_env: []
    svc_desc: "TODO: beschrijf deze service"
    svc_container_prefix: neodata-
    svc_tz: Europe/Brussels
    svc_restart: unless-stopped
    svc_network: neodata

    stack_dir: "{{ containers_repo }}/stacks/{{ svc_name | default('') }}"
    env_file: "{{ playbook_dir }}/../files/env/{{ svc_name | default('') }}.env"
    # Elke host heeft een map: host_vars/<host>/main.yml, naast zijn vault.yml.
    docker_vars: "{{ playbook_dir }}/../inventory/host_vars/{{ svc_host }}/main.yml"
    caddy_vars: "{{ playbook_dir }}/../inventory/host_vars/caddy/main.yml"

  tasks:
    - name: Require the arguments that have no sensible default
      ansible.builtin.assert:
        that:
          - svc_name is defined and svc_name | length > 0
          - svc_port is defined
          - svc_image is defined and svc_image | length > 0
        fail_msg: |
          Ontbrekende argumenten. Minimaal:
            ansible-playbook playbooks/new-service.yml \
              -e svc_name=<naam> -e svc_port=<poort> -e svc_image=<image:tag>
          Optioneel: svc_volume, svc_desc, svc_subdomain, svc_host, svc_env

    - name: Read the current stack list
      ansible.builtin.slurp:
        src: "{{ docker_vars }}"
      register: docker_vars_raw

    - name: Read the current site list
      ansible.builtin.slurp:
        src: "{{ caddy_vars }}"
      register: caddy_vars_raw

    # Een botsing hier vangen is veel goedkoper dan na een deploy: een
    # dubbele poort bindt stilletjes niet, een dubbele naam overschrijft.
    - name: Refuse to overwrite an existing service
      ansible.builtin.assert:
        that:
          - not stack_exists
          - "'name: ' ~ svc_name ~ ',' not in docker_vars_text"
          - "'name: ' ~ svc_subdomain ~ ',' not in caddy_vars_text"
          - "'port: ' ~ svc_port ~ ',' not in caddy_vars_text"
        fail_msg: >-
          '{{ svc_name }}' of poort {{ svc_port }} is al bezet - kijk naar
          stacks/{{ svc_name }}, docker_stacks_list en caddy_sites.
      vars:
        stack_exists: "{{ (stack_dir ~ '/docker-compose.yml') is exists }}"
        docker_vars_text: "{{ docker_vars_raw.content | b64decode }}"
        caddy_vars_text: "{{ caddy_vars_raw.content | b64decode }}"

    - name: Create the stack folder
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        mode: "0755"

    - name: Write the compose file
      ansible.builtin.template:
        src: new-service/docker-compose.yml.j2
        dest: "{{ stack_dir }}/docker-compose.yml"
        mode: "0644"

    # Gitignored in de containers-repo; de kopie hieronder is degene die
    # blijft.
    - name: Write the .env next to it
      ansible.builtin.template:
        src: new-service/env.j2
        dest: "{{ stack_dir }}/.env"
        mode: "0600"

    - name: Copy the .env into this repo
      ansible.builtin.copy:
        src: "{{ stack_dir }}/.env"
        dest: "{{ env_file }}"
        mode: "0600"

    # chdir is hier van belang: ansible.cfg wijst vault_identity_list naar het
    # relatieve pad bin/vault-pass-client, en dat klopt alleen vanaf de
    # repo-root.
    - name: Encrypt it under the stacks vault identity
      ansible.builtin.command:
        cmd: ansible-vault encrypt --encrypt-vault-id stacks {{ env_file }}
        chdir: "{{ playbook_dir }}/.."
      changed_when: true

    - name: Fail loudly if that did not actually encrypt
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        line: "$ANSIBLE_VAULT;1.2;AES256;stacks"
        state: present
      check_mode: true
      register: vault_header
      failed_when: vault_header is changed

    # Een enkele accolade is geen Jinja-delimiter, dus deze regels hoeven niet
    # ge-escaped te worden en staan er zoals ze in het bestand komen.
    #
    # Beide regels gaan direct onder hun lijstkop staan en niet onderaan: de
    # volgorde maakt Ansible niets uit, en vastmaken aan een kop is de enige
    # plek die niet in een commentaarblok of een andere variabele kan
    # belanden.
    - name: Register the stack
      ansible.builtin.lineinfile:
        path: "{{ docker_vars }}"
        insertafter: '^docker_stacks_list:'
        line: '  - { name: {{ svc_name }}, path: {{ svc_name }} }'

    - name: Register the route
      ansible.builtin.lineinfile:
        path: "{{ caddy_vars }}"
        insertafter: '^caddy_sites:'
        line: '  - { name: {{ svc_subdomain }}, host: {{ svc_host }}, port: {{ svc_port }}, stack: {{ svc_name }}, desc: "{{ svc_desc }}" }'

    - name: What happens next
      ansible.builtin.debug:
        msg:
          - "stacks/{{ svc_name }}/ aangemaakt in de containers-repo."
          - "files/env/{{ svc_name }}.env in de vault gezet."
          - "De stack en de route staan in de inventory."
          - ""
          - "1. cd {{ containers_repo }} && git add stacks/{{ svc_name }} && git commit -m 'Add {{ svc_name }} stack' && git push"
          - "2. ansible-playbook playbooks/stacks.yml && ansible-playbook playbooks/caddy.yml"
          - "3. open https://{{ svc_subdomain }}.{{ hostvars['caddy'].caddy_domain }}"
