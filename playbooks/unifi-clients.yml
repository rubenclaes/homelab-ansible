---
# Toont de toestellen in UniFi, als regels die je zo in unifi_known_macs
# (group_vars/all/unifi.yml) plakt.
#
#   ansible-playbook playbooks/unifi-clients.yml
#
# Leest alleen. Verandert niets in UniFi.
- name: UniFi clients
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the clients from UniFi
      ansible.builtin.import_tasks: tasks/unifi_clients.yml

    - name: Show them as unifi_known_macs lines
      ansible.builtin.debug:
        msg: "{{ lines | trim | split('\n') }}"
      vars:
        lines: |
          {% for c in unifi_clients.json.data | sort(attribute='name') %}
          - "{{ c.macAddress | lower }}"  # {{ c.name | default('zonder naam') }}, {{ c.ipAddress | default('geen IP') }}
          {% endfor %}
