---
# Datacenter-instellingen van pve01: de storages en de back-upjobs. En het
# besturingssysteem van pve01 zelf (roles/proxmox_host): de CPU-stroom. En
# de toestellen die guests van pve01 krijgen: /dev/net/tun (proxmox_tun) en
# USB (proxmox_usb), omdat OpenTofu dat als niet-root niet mag.
#
#   ansible-playbook playbooks/proxmox-datacenter.yml
#
# Zo vaak draaien als je wil: elke taak voegt toe, en niets hier verwijdert
# een storage, een job, of de data erachter.
#
# Netwerk op node-niveau staat hier met opzet NIET in: dat kan de node
# onbereikbaar maken en zit in playbooks/proxmox-network.yml achter een flag.
#
# In site.yml: ja.

- name: Proxmox datacenter configuration
  hosts: proxmox
  gather_facts: false
  roles:
    - proxmox_datacenter
    - proxmox_tun
    - proxmox_usb
    - proxmox_host
  tags: [proxmox, datacenter]
