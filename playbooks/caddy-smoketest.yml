---
# Vraagt elke site uit caddy_sites op en faalt als er een stuk is.
#
#   ansible-playbook playbooks/caddy-smoketest.yml
#
# Een 5xx of een verbinding die niet tot stand komt telt als stuk; een 401 of
# een redirect niet, want dat is een dienst die zelf om inloggen vraagt.
#
# Draai dit na caddy.yml en na caddy-upgrade.yml. Niet in site.yml: het
# controleert, het convergeert niet.
- name: Smoke test all Caddy sites
  hosts: caddy
  gather_facts: false
  tasks:
    - name: Request every site
      ansible.builtin.uri:
        url: "https://{{ item.name }}.{{ caddy_domain }}"
        follow_redirects: none
        timeout: 10
      loop: "{{ caddy_sites }}"
      loop_control:
        label: "{{ item.name }}"
      register: smoke
      failed_when: false
      # Requesting a URL changes nothing, and the assert below needs the
      # result. Without this the whole playbook is unusable under --check:
      # the task skips, leaving results with no `status` to read.
      check_mode: false
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Summarise
      ansible.builtin.assert:
        that: broken_sites | length == 0
        fail_msg: "Broken sites: {{ broken_sites | join(', ') }}"
        success_msg: "All {{ caddy_sites | length }} sites respond"
      vars:
        broken_sites: >-
          {{ (smoke.results | selectattr('status', 'ge', 500) | map(attribute='item.name') | list)
             + (smoke.results | selectattr('status', 'lt', 0) | map(attribute='item.name') | list) }}
