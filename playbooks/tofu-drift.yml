---
# Zou `bin/tofu <systeem> apply` nu iets veranderen? Eén plan per map in tofu/.
#
#   ansible-playbook playbooks/tofu-drift.yml
#   ansible-playbook playbooks/tofu-drift.yml -e tofu_drift_fail=true   # faalt bij drift
#
# Wat drift.yml is voor Ansible, is dit voor OpenTofu: iemand die in de
# Proxmox-UI of de Tailscale-console iets verandert, zie je de volgende
# ochtend, niet pas bij de volgende apply die het stil terugdraait.
#
# Verandert niets: init met -lockfile=readonly, plan met -lock=false (een
# afgebroken job laat dan geen slot in R2 achter).
#
# In site.yml: nee, het controleert en het convergeert niet.

- name: Drift in OpenTofu
  hosts: localhost
  gather_facts: false
  vars:
    tofu_drift_root: "{{ playbook_dir }}/.."
    tofu_drift_systems: [tailscale, proxmox, pocketid]
    tofu_drift_fail: false
  tasks:
    # chdir naar de repo-root: bin/tofu opent tofu/secrets.env met
    # ansible-vault, en ansible.cfg vindt de vault-wachtwoorden alleen vanaf daar.
    #
    # init en plan in één stap per systeem, met -detailed-exitcode: 0 is gelijk,
    # 2 is drift, al de rest is een fout (ook een init die faalt). Een fout
    # stopt de play niet: faalt één systeem (registry, R2 of de provider
    # onbereikbaar), dan wil je de drift in de andere nog zien. Pas de
    # laatste taak maakt de run rood.
    - name: Plan
      ansible.builtin.shell: >-
        bin/tofu {{ item | quote }} init -input=false -lockfile=readonly -no-color >/dev/null &&
        bin/tofu {{ item | quote }} plan -input=false -lock=false -detailed-exitcode -no-color
      args:
        chdir: "{{ tofu_drift_root }}"
      loop: "{{ tofu_drift_systems }}"
      register: tofu_drift_plans
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Samenvatting
      ansible.builtin.debug:
        msg: >-
          {%- if item.rc == 0 -%}
          {{ [item.item ~ ': gelijk aan git'] }}
          {%- elif item.rc == 2 -%}
          {{ [item.item ~ ': zou wijzigen']
             + (item.stdout_lines | select('search', '^\s+# \S+ (will|must) be|^Plan: ') | list) }}
          {%- else -%}
          {{ [item.item ~ ': faalde (rc ' ~ item.rc ~ ')'] + item.stderr_lines[-5:] }}
          {%- endif -%}
      loop: "{{ tofu_drift_plans.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Fouten altijd, drift alleen met tofu_drift_fail. Beide in één melding.
    - name: Faal bij een fout of drift
      vars:
        tofu_drift_broken: "{{ tofu_drift_plans.results | rejectattr('rc', 'in', [0, 2]) | map(attribute='item') | list }}"
        tofu_drift_drifted: "{{ tofu_drift_plans.results | selectattr('rc', 'eq', 2) | map(attribute='item') | list }}"
      ansible.builtin.assert:
        that:
          - tofu_drift_broken | length == 0
          - not tofu_drift_fail | bool or tofu_drift_drifted | length == 0
        fail_msg: >-
          {{ ('Faalde: ' ~ tofu_drift_broken | join(', ') ~ '. ') if tofu_drift_broken else '' }}
          {{- ('Drift in ' ~ tofu_drift_drifted | join(', ') ~ '. ') if tofu_drift_drifted and tofu_drift_fail | bool else '' }}
          Zie de samenvatting hierboven, of kijk met `bin/tofu <systeem> plan`:
          zet git gelijk, of draai apply.
        quiet: true
