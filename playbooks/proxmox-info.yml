---
# Toont elke guest op pve01 met zijn vmid, type en status.
#
#   ansible-playbook playbooks/proxmox-info.yml
#
# Leest via het API-token, net als de dynamische inventory, dus dit is ook de
# snelste manier om te zien of dat token nog werkt.
#
# LET OP: de eerste taak verwijdert `python3-proxmoxer` van de hypervisor. De
# modules hieronder draaien gedelegeerd op localhost en hebben dat pakket op
# de node niet nodig; het staat er als opruiming van iets wat ooit door een
# andere weg geïnstalleerd werd. Een leesplaybook dat iets weghaalt is een
# verrassing - zie TODO.
- name: Proxmox guests via the API
  hosts: pve01
  tasks:
    - name: Remove the distro proxmoxer again (keep the hypervisor clean)
      ansible.builtin.apt:
        name: python3-proxmoxer
        state: absent

    - name: List all guests
      community.proxmox.proxmox_vm_info:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        node: "{{ ansible_facts['hostname'] }}"
        validate_certs: false
      delegate_to: localhost
      become: false
      register: guests

    - name: Show guests
      ansible.builtin.debug:
        msg: "{{ item.vmid }} {{ item.type }} {{ item.name }} {{ item.status }}"
      loop: "{{ guests.proxmox_vms }}"
      loop_control:
        label: "{{ item.name }}"
