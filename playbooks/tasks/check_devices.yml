---
# Validates `devices` before anything acts on it. Imported by docs.yml, which
# renders it, and by devices.yml, which pushes it to the gateway and to
# AdGuard. The second one is why this is shared: docs.yml only ever made a
# wrong page, devices.yml makes a wrong reservation.
#
# A reserved address that collides with a managed host is the failure worth
# catching: put the printer on caddy's address and you find out when DNS stops
# working, not before. The other checks keep the list itself honest - one
# spelling per MAC, no duplicates, no two devices on one address, and a key
# that works as a DNS label, a file name and an AdGuard client ID, which is
# what it becomes.
- name: Check the device list against the inventory
  ansible.builtin.assert:
    that:
      - devices.keys() | reject('match', key_re) | list | length == 0
      - devices.values() | list | selectattr('mac', 'match', mac_re) | list | length == devices | length
      - devices.values() | list | map(attribute='mac') | list | length
        == devices.values() | list | map(attribute='mac') | unique | list | length
      - device_ips | length == device_ips | unique | list | length
      - device_ips | intersect(inventory_ips) | length == 0
    fail_msg: >-
      devices.yml is wrong.
      Bad name (lowercase letters, digits, hyphens): {{ devices.keys() | reject('match', key_re) | join(', ') | default('none', true) }}.
      Bad or uppercase MAC: {{ devices | dict2items
        | rejectattr('value.mac', 'match', mac_re) | map(attribute='key') | join(', ') | default('none', true) }}.
      Address also used by a managed host: {{ device_ips | intersect(inventory_ips) | join(', ') | default('none', true) }}.
    success_msg: "{{ devices | length }} devices, no address collisions."
  vars:
    key_re: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    mac_re: '^([0-9a-f]{2}:){5}[0-9a-f]{2}$'
    device_ips: "{{ devices.values() | list | selectattr('ip', 'defined') | map(attribute='ip') | list }}"
    inventory_ips: "{{ groups['all'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"

# A schedule that AdGuard would silently accept but that means the opposite of
# what it reads like. `to` before `from` is an empty allowance, so the service
# is blocked all day, which is not what someone typing 21:00 to 07:00 meant.
- name: Check every allowance window
  ansible.builtin.assert:
    that: bad_windows | length == 0
    fail_msg: >-
      An allowance window ends before it starts: {{ bad_windows | join(', ') }}.
      A window does not wrap past midnight; split it over two days, or widen it.
    success_msg: "{{ windows | length }} allowance windows, all valid."
  vars:
    windows: >-
      {%- set out = [] -%}
      {%- for name, d in devices | dictsort -%}
      {%-   for day, w in (d.dns | default({})).get('allowed', {}).items() -%}
      {%-     set _ = out.append({'label': name ~ '/' ~ day,
                'ok': (w['from'] | replace(':', '') | int) < (w['to'] | replace(':', '') | int)}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}
    bad_windows: "{{ windows | rejectattr('ok') | map(attribute='label') | list }}"
