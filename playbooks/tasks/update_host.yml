---
# Gedeeld door beide plays in update.yml, zodat guests en hypervisors op
# dezelfde manier bijgewerkt worden.
- name: Refresh cache and full-upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  # Pakketten in baseline_held_packages blijven vastzitten: dist-upgrade
  # respecteert dpkg-holds, dus een eigen Caddy-build wordt hier nooit
  # vervangen.

- name: Check whether a reboot is needed
  ansible.builtin.include_role:
    name: baseline
    tasks_from: reboot_check
