---
baseline_held_packages:
  - caddy

caddy_email: ruben.claes@neodata.be
caddy_domain: neodata.be

# Upstreams are named by inventory host, not by IP. Re-addressing a host means
# editing its ansible_host in inventory/hosts.yml and nothing else.
#
#   host:  an inventory hostname; its ansible_host becomes the upstream IP
#   port:  the upstream port
#   upstream: escape hatch for a target that is not in the inventory;
#             overrides host/port when present
#
# Flags: https (upstream speaks TLS with a self-signed cert), host_header
# (pass the original Host through), forwarded (add X-Real-IP / X-Forwarded-*),
# auth (require tinyauth).
caddy_tinyauth_upstream: "{{ hostvars['macmini']['ansible_host'] }}:3000"

caddy_sites:
  # --- Infra ---
  - { name: portainer, host: docker01, port: 9443, https: true }
  - { name: semaphore, host: semaphore, port: 3000 }
  - { name: monitoring, host: monitoring01, port: 3001, host_header: true }
  - { name: prometheus, host: monitoring01, port: 9090 }

  # --- docker01 ---
  - { name: home, host: docker01, port: 8085 }
  - { name: pairdrop, host: docker01, port: 3000 }
  - { name: code, host: docker01, port: 8443 }
  - { name: tools, host: docker01, port: 8082 }
  - { name: metube, host: docker01, port: 8081 }
  - { name: pdf, host: docker01, port: 8084 }
  - { name: termix, host: docker01, port: 8086 }
  - { name: torrent, host: docker01, port: 8089 }
  - { name: neogate, host: docker01, port: 4000 }
  - { name: photos, host: docker01, port: 2283 }
  - { name: id, host: docker01, port: 1411 }
  - { name: evcc, host: docker01, port: 7070, forwarded: true }
  - { name: trek, host: docker01, port: 8083, forwarded: true }

  # --- Mac mini ---
  - { name: tinyauth, host: macmini, port: 3000 }
  - { name: plex, host: macmini, port: 32400 }
  - { name: sonarr, host: macmini, port: 8989 }
  - { name: radarr, host: macmini, port: 7878 }
  - { name: prowlarr, host: macmini, port: 9696 }
  - { name: bazarr, host: macmini, port: 6767 }
  - { name: overseerr, host: macmini, port: 5055 }
  - { name: tautulli, host: macmini, port: 8181 }
  - { name: jackett, host: macmini, port: 9117 }
  - { name: dozzle, host: macmini, port: 8080 }
  - { name: duplicati, host: macmini, port: 8200 }
  - { name: auth, host: macmini, port: 1411 } # TODO: old Pocket ID instance
  - { name: wizarr, host: macmini, port: 5690, auth: true }
  - { name: books, host: macmini, port: 6061 }
  - { name: audiobooks, host: macmini, port: 13378 }
  - { name: jellyfin, host: macmini, port: 8096 }
