---
# The sequence that has to survive the controller losing its connection
# halfway through - copy, arm, apply, verify, disarm - is split across two
# actors on purpose, not run entirely on the node:
#   - copy / reset-failed / arm / the eventual disarm run ON THE NODE. These
#     are the steps that must still complete, or already be safely queued,
#     even if the connection drops right after them.
#   - the API apply and the reachability probe are delegate_to: localhost,
#     run from the controller. An API call is inherently made from outside
#     the node, and a reachability probe run ON the node it is testing would
#     prove nothing - it would succeed by definition as long as the node's
#     own userspace is alive, which is not the question being asked.
# Everything below assumes the running configuration is one that worked. If a
# previous apply is still counting down, that assumption is false: this run
# would copy a config that may already be broken, and the earlier timer would
# then faithfully restore the breakage. Refuse, and say what to do instead.
#
# ansible.builtin.command, not systemd_service: the module's own argument spec
# (required_one_of: state, enabled, masked, daemon_reload, daemon_reexec)
# makes a bare query impossible to express with it - passing state would turn
# a read into an enforcement, which is not what this task is. failed_when
# below covers the module gap: `systemctl is-active` exits non-zero for every
# state other than "active", and that is not a failure here, it is the
# expected answer most of the time.
- name: Check whether a previous revert is still armed # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active ansible-network-revert.timer
  register: proxmox_network_revert_armed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse to apply while a previous revert is pending
  ansible.builtin.assert:
    that: proxmox_network_revert_armed.stdout | trim != 'active'
    fail_msg: >-
      ansible-network-revert.timer is still armed from an earlier apply, which
      means the running configuration may be the one that earlier run broke.
      Copying it as this run's rollback target would leave you with no way
      back. Wait for the timer to fire and restore the previous config, or - if
      you are certain the running config is good - stop it deliberately with
      `systemctl stop ansible-network-revert.timer` and run this again.
    success_msg: "No previous revert pending"

# BOTH units, not just the timer. `systemd-run --unit=X --on-active=N` creates
# X.timer AND X.service: the timer counts down, the service runs the restore.
# The timer goes inactive once it has fired, whatever the outcome - so it is
# the SERVICE that lingers in `failed` when the restore itself errors, and the
# service that then blocks the next systemd-run under the same name. Resetting
# only the timer leaves exactly the collision this task is meant to prevent.
#
# Safe here because the assert above has already established that nothing is
# counting down. `reset-failed` is one of the systemctl subcommands
# ansible-lint's command-instead-of-module rule already treats as having no
# module equivalent, so no noqa is needed here.
- name: Clear any lingering revert units
  ansible.builtin.command: >-
    systemctl reset-failed ansible-network-revert.timer ansible-network-revert.service
  changed_when: false
  failed_when: false

- name: Keep a copy of the running configuration
  ansible.builtin.copy:
    src: /etc/network/interfaces
    dest: /etc/network/interfaces.before-ansible
    remote_src: true
    mode: "0644"

# systemd-run, not `at`: it is already installed, it survives the SSH session
# dying, and `systemctl stop` on a named unit is an unambiguous cancel. If the
# playbook dies at any point after this, the node returns to a configuration
# that demonstrably worked.
#
# --collect sets CollectMode=inactive-or-failed, so the transient units are
# garbage-collected even when the restore fails, instead of lingering under a
# name the next run needs. The reset-failed above is the belt to this braces:
# it cleans up after a run from before this flag existed, or one that lingered
# anyway. Losing the unit costs nothing - `journalctl -u
# ansible-network-revert.service` still shows what happened.
- name: Arm the dead-man switch
  ansible.builtin.command:
    argv:
      - systemd-run
      - --unit=ansible-network-revert
      - --collect
      - "--on-active={{ proxmox_network_revert_after }}"
      - /bin/bash
      - -c
      - cp /etc/network/interfaces.before-ansible /etc/network/interfaces && ifreload -a
  changed_when: true

# NOT `ifreload -a`. Proxmox stages into /etc/network/interfaces.new, and
# ifreload reads /etc/network/interfaces - so running it here would reload the
# unchanged running config, leave the staged file untouched, and report
# success. The module's `apply` state calls PUT /nodes/{node}/network, which is
# what actually moves the staged file into place and reloads.
- name: Apply the staged interface configuration
  community.proxmox.proxmox_node_network:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs: false
    node: "{{ ansible_facts['hostname'] }}"
    state: apply
  delegate_to: localhost
  become: false

# Derived from pve_node_interfaces rather than hand-copied, so this safety
# check always probes exactly the addresses the role just staged - a bridge
# renumbered, added or removed in inventory changes what gets probed here
# with no second place to remember to update. This is the one file read cold
# under pressure; a hardcoded, silently-stale copy of inventory inside its
# own safety check is the wrong thing for that reader to find.
- name: Check that every declared address still answers
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 22
    timeout: 20
  loop: "{{ pve_node_interfaces | map(attribute='cidr') | map('split', '/') | map('first') | list }}"
  delegate_to: localhost
  become: false

# ansible.builtin.command here would be command-instead-of-module under the
# production lint profile; systemd_service stops the same transient timer
# unit that Arm the dead-man switch created.
- name: Disarm the dead-man switch
  ansible.builtin.systemd_service:
    name: ansible-network-revert.timer
    state: stopped
