---
# This role configures Caddy; it deliberately does NOT install the binary.
# The running Caddy is a custom build that includes the Cloudflare DNS module
# (needed for the DNS-01 wildcard cert in Caddyfile.j2). The stock Debian
# package has no plugins, so installing it here would break TLS issuance.
# That is why `caddy` is listed in baseline_held_packages for this host.
#
# To build/upgrade the binary, see "Upgrading Caddy" in the README.
- name: Caddyfile from template
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy adapt --config %s --adapter caddyfile
  notify: Reload caddy

- name: Cloudflare token from Vault
  ansible.builtin.copy:
    dest: /etc/caddy/cloudflare.env
    content: "CF_API_TOKEN={{ vault_cloudflare_api_token }}\n"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart caddy

- name: Ensure the Caddy systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Systemd override without --environ
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/override.conf
    content: |
      [Service]
      EnvironmentFile=/etc/caddy/cloudflare.env
      ExecStart=
      ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
    mode: "0644"
  notify: Restart caddy

- name: Caddy enabled and running
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
