---
# Installs Caddy (install.yml) and then configures it.
#
# The running Caddy is the packaged binary with the Cloudflare DNS module
# added in place - needed for the DNS-01 wildcard cert in Caddyfile.j2. The
# stock binary refuses to start against that Caddyfile, so a plain apt upgrade
# would take every *.neodata.be name down. That is why `caddy` is listed in
# baseline_held_packages for this host, and why install.yml only swaps the
# binary when the module is genuinely absent.
#
# To move to a new upstream version: playbooks/caddy-upgrade.yml.
- name: Install Caddy and its DNS module
  ansible.builtin.import_tasks: install.yml

- name: Caddyfile from template
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy adapt --config %s --adapter caddyfile
  notify: Reload caddy

- name: Cloudflare token from Vault
  ansible.builtin.copy:
    dest: /etc/caddy/cloudflare.env
    content: "CF_API_TOKEN={{ vault_cloudflare_api_token }}\n"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart caddy

- name: Ensure the Caddy systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Systemd override without --environ
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/override.conf
    content: |
      [Service]
      EnvironmentFile=/etc/caddy/cloudflare.env
      ExecStart=
      ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
    mode: "0644"
  notify: Restart caddy

- name: Caddy enabled and running
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
