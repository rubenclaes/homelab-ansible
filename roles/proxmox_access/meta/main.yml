---
galaxy_info:
  role_name: proxmox_access
  author: rubenclaes
  description: >-
    Manages the privileges of the Proxmox role behind the ansible@pve API
    token, plus the users and ACLs declared in pve_users and pve_acls.
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
  galaxy_tags:
    - cloud
    - security

# These roles are composed by playbooks, not by role dependencies,
# so the run order stays visible in playbooks/site.yml.
dependencies: []
