---
# Manages the privileges of the Proxmox role behind the ansible@pve API token.
#
# Read-modify-write on the FULL list, deliberately. `pveum role modify <id>`
# with no --privs sets the privilege list to empty, which revokes API access
# for every playbook in this repo. Passing the complete list every time makes
# that failure mode unreachable.
- name: Read current Proxmox roles
  ansible.builtin.command: pveum role list --output-format json
  register: proxmox_access_roles
  changed_when: false
  check_mode: false

- name: Extract the current privileges of the managed role
  ansible.builtin.set_fact:
    proxmox_access_current: >-
      {{ (proxmox_access_roles.stdout | from_json
          | selectattr('roleid', 'eq', proxmox_access_role)
          | map(attribute='privs') | first | default(''))
         | split(',') | select() | sort | list }}

- name: Show the difference this run would apply
  ansible.builtin.debug:
    msg: >-
      {{ proxmox_access_role }}:
      adding {{ proxmox_access_privileges | sort | difference(proxmox_access_current) }},
      removing {{ proxmox_access_current | difference(proxmox_access_privileges | sort) }}

- name: Refuse to run if the desired list would revoke privileges
  ansible.builtin.assert:
    that: (proxmox_access_current | difference(proxmox_access_privileges | sort)) | length == 0
    fail_msg: >-
      Applying this list would REVOKE
      {{ proxmox_access_current | difference(proxmox_access_privileges | sort) | join(', ') }}
      from {{ proxmox_access_role }}, breaking API access for every playbook
      here. Add them to proxmox_access_privileges, or remove them deliberately
      with -e proxmox_access_allow_revoke=true.
    success_msg: "No privileges would be revoked"
  when: not (proxmox_access_allow_revoke | default(false) | bool)

- name: Set the role's privileges
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - modify
      - "{{ proxmox_access_role }}"
      - --privs
      - "{{ proxmox_access_privileges | sort | join(',') }}"
  when: proxmox_access_current != (proxmox_access_privileges | sort | list)
  changed_when: true

- name: Users and ACLs
  ansible.builtin.import_tasks: users.yml

- name: Report and verify
  ansible.builtin.import_tasks: verify.yml
