---
# pveum rather than community.proxmox.proxmox_user, to match the rest of this
# role. tasks/main.yml already drives pveum directly because it needs a guard
# the module does not offer, and mixing a module with a CLI inside one role
# means two failure modes and two idempotency stories for one object.
#
# proxmox_access_missing collects what would be created. Unlike
# proxmox_datacenter, a missing user or ACL is not an error here: creating
# one is exactly what this role is for. Reporting and asserting on this list
# happens in verify.yml, imported last from main.yml, not here.
#
# LIMITATION, stated plainly: matching below is presence-only. A user is
# looked up by userid, an ACL by (path, roleid, ugid), and once found, none
# of its other fields are ever compared again. Change email, firstname or
# comment on an existing pve_users entry and re-run this role, and nothing
# happens - the existing user is left as it is, and verify.yml reports
# success, because from this role's point of view nothing is missing. This
# role creates what is missing; it does not reconcile the attributes of what
# already exists.
- name: Start with an empty access-missing list
  ansible.builtin.set_fact:
    proxmox_access_missing: []

- name: Read the current Proxmox users
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_access_users
  changed_when: false
  check_mode: false

# Recorded before creating, same as proxmox_datacenter's storage_entry.yml:
# the record has to reflect what's about to happen even under --check, where
# the command task right below never runs.
- name: Record the users that would be created
  ansible.builtin.set_fact:
    proxmox_access_missing: "{{ proxmox_access_missing + ['user ' ~ item.userid] }}"
  loop: "{{ pve_users | default([]) }}"
  loop_control:
    label: "{{ item.userid }}"
  when: item.userid not in (proxmox_access_users.stdout | from_json | map(attribute='userid') | list)

- name: Create users that do not exist yet
  ansible.builtin.command:
    argv: >-
      {{ ['pveum', 'user', 'add', item.userid]
         + (['--comment', item.comment] if item.comment is defined else [])
         + (['--firstname', item.firstname] if item.firstname is defined else [])
         + (['--lastname', item.lastname] if item.lastname is defined else [])
         + (['--email', item.email] if item.email is defined else []) }}
  loop: "{{ pve_users | default([]) }}"
  loop_control:
    label: "{{ item.userid }}"
  when: item.userid not in (proxmox_access_users.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

- name: Read the current ACLs
  ansible.builtin.command: pveum acl list --output-format json
  register: proxmox_access_acls
  changed_when: false
  check_mode: false

- name: Record the ACLs that would be created
  ansible.builtin.set_fact:
    proxmox_access_missing: "{{ proxmox_access_missing + ['acl ' ~ item.path ~ ' -> ' ~ item.ugid] }}"
  loop: "{{ pve_acls | default([]) }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.ugid }} ({{ item.roleid }})"
  when: >-
    (proxmox_access_acls.stdout | from_json
     | selectattr('path', 'eq', item.path)
     | selectattr('roleid', 'eq', item.roleid)
     | selectattr('ugid', 'eq', item.ugid) | list | length) == 0

# proxmox_access_acl declares check_mode: support: none, so this stays on
# pveum as well - and the comparison below is what makes --check meaningful
# for ACLs anyway, since it is a read plus a conditional.
- name: Grant ACLs that are not in place yet
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - "{{ item.path }}"
      - "--roles"
      - "{{ item.roleid }}"
      - "--{{ item.type }}s"
      - "{{ item.ugid }}"
  loop: "{{ pve_acls | default([]) }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.ugid }} ({{ item.roleid }})"
  when: >-
    (proxmox_access_acls.stdout | from_json
     | selectattr('path', 'eq', item.path)
     | selectattr('roleid', 'eq', item.roleid)
     | selectattr('ugid', 'eq', item.ugid) | list | length) == 0
  changed_when: true
