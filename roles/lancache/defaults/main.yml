---
# on or off. No default: playbooks/lancache.yml requires -e lancache=...
# lancache:

lancache_pve_api: "https://{{ pve_api_host }}:8006/api2/json"
lancache_pve_headers:
  Authorization: "PVEAPIToken={{ pve_api_user }}!{{ pve_api_token_id }}={{ pve_api_token_secret }}"
lancache_pve_node: pve01
# From its entry in pve_oci_lxcs; only used in plays against pve01, where that
# list is a plain group var.
lancache_vmid: "{{ (pve_oci_lxcs | selectattr('hostname', 'eq', 'lancache') | first).vmid }}"

# What lancache answers on when nginx is up (monolithic's generic config).
lancache_heartbeat_url: "http://{{ lancache_ip }}/lancache-heartbeat"

# The download domains that are pointed at lancache. From uklans/cache-domains
# commit 1a3cbc75256f34a4cb1d98848db7c2715e17c6f3, games only: steam,
# epicgames, blizzard, riot, origin, uplay, xboxlive, sony, nintendo. Copied
# rather than fetched, so a run never depends on GitHub and a change shows up
# in a diff. To update: take the same files at a newer commit.
