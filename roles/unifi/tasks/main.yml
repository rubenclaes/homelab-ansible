---
# Talks to the gateway's API over the network; nothing connects to it with
# SSH. The play that includes this role runs locally - see
# playbooks/devices.yml.
#
# Additive and reconciling, never deleting. A client entry on the gateway can
# also hold things a person set in the UI, and there is no marker saying
# "Ansible made this", so a device removed from the list keeps its entry.
# Forget it in the UI when you mean to forget it.
- name: Require UniFi credentials
  ansible.builtin.assert:
    that:
      - unifi_user is defined
      - unifi_password is defined
    fail_msg: >-
      unifi_user / unifi_password are not set. They come from
      vault_unifi_user and vault_unifi_password in
      inventory/host_vars/unifi/vault.yml; create it with
      `ansible-vault create --encrypt-vault-id infra inventory/host_vars/unifi/vault.yml`.
      Use a local UniFi account, not the Ubiquiti cloud login: the cloud
      login needs two factors and cannot be automated.
    quiet: true

# UniFi OS answers on /api/auth/login and hands back a session cookie plus a
# CSRF token. Every write below needs both; a read needs only the cookie.
- name: Log in to the gateway
  ansible.builtin.uri:
    url: "{{ unifi_url }}/api/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ unifi_user }}"
      password: "{{ unifi_password }}"
    validate_certs: "{{ unifi_validate_certs }}"
  register: unifi_login
  check_mode: false
  no_log: true

- name: Read the known clients
  ansible.builtin.uri:
    url: "{{ unifi_url }}/proxy/network/api/s/{{ unifi_site }}/list/user"
    headers:
      Cookie: "{{ unifi_login.cookies_string }}"
    validate_certs: "{{ unifi_validate_certs }}"
    return_content: true
  register: unifi_users
  check_mode: false
  no_log: true

- name: Read the bandwidth groups
  ansible.builtin.uri:
    url: "{{ unifi_url }}/proxy/network/api/s/{{ unifi_site }}/list/usergroup"
    headers:
      Cookie: "{{ unifi_login.cookies_string }}"
    validate_certs: "{{ unifi_validate_certs }}"
    return_content: true
  register: unifi_groups
  check_mode: false
  no_log: true

- name: Map every group name to its id
  ansible.builtin.set_fact:
    unifi_group_ids: >-
      {{ dict(unifi_groups.json.data | map(attribute='name')
              | zip(unifi_groups.json.data | map(attribute='_id'))) }}

# Named rather than guessed: a device asking for a group that does not exist
# would otherwise land in the default one and quietly keep the full line.
- name: Require every named bandwidth group to exist
  ansible.builtin.assert:
    that: unifi_groups_missing | length == 0
    fail_msg: >-
      No bandwidth group on the gateway is called:
      {{ unifi_groups_missing | join(', ') }}.
      Known groups: {{ unifi_group_ids.keys() | list | join(', ') }}.
      Create it in the UI under Settings, or correct `group:` in devices.yml.
    success_msg: "{{ unifi_group_ids | length }} bandwidth groups, all names resolve."
  vars:
    unifi_groups_missing: >-
      {{ (devices.values() | selectattr('group', 'defined') | map(attribute='group') | list
          + [unifi_default_group]) | unique | reject('in', unifi_group_ids.keys() | list) | list }}

- name: Work out the client each device should have
  ansible.builtin.set_fact:
    unifi_clients_wanted: >-
      {%- set out = [] -%}
      {%- for name, d in devices | dictsort -%}
      {%-   set _ = out.append({
              'name': name,
              'mac': d.mac | lower,
              'usergroup_id': unifi_group_ids[d.group | default(unifi_default_group)],
              'fixed_ip': d.ip | default(''),
              'use_fixedip': d.ip is defined}) -%}
      {%- endfor -%}
      {{ out }}

- name: Work out which clients are missing
  ansible.builtin.set_fact:
    unifi_clients_add: >-
      {{ unifi_clients_wanted | rejectattr('mac', 'in', unifi_macs_live) | list }}
  vars:
    unifi_macs_live: "{{ unifi_users.json.data | map(attribute='mac') | map('lower') | list }}"

- name: Report the clients that will be created
  ansible.builtin.debug:
    msg: "{{ unifi_clients_add | map(attribute='name') | list }}"
  changed_when: unifi_clients_add | length > 0

# One call per client rather than one call with every object: the API answers
# with a single status for the whole batch, so a batch that half-fails reports
# success for the half that did not happen.
- name: Create the clients that do not exist yet
  ansible.builtin.uri:
    url: "{{ unifi_url }}/proxy/network/api/s/{{ unifi_site }}/group/user"
    method: POST
    body_format: json
    body:
      objects:
        - data:
            mac: "{{ item.mac }}"
            name: "{{ item.name }}"
            usergroup_id: "{{ item.usergroup_id }}"
    headers:
      Cookie: "{{ unifi_login.cookies_string }}"
      X-CSRF-Token: "{{ unifi_login.x_csrf_token }}"
    validate_certs: "{{ unifi_validate_certs }}"
  loop: "{{ unifi_clients_add }}"
  loop_control:
    label: "{{ item.name }} ({{ item.mac }})"
  changed_when: true
  no_log: true

# Re-read rather than assume: a client has to exist before it has an _id, and
# the reservation below is addressed by that id.
- name: Read the clients again, now that the missing ones exist
  ansible.builtin.uri:
    url: "{{ unifi_url }}/proxy/network/api/s/{{ unifi_site }}/list/user"
    headers:
      Cookie: "{{ unifi_login.cookies_string }}"
    validate_certs: "{{ unifi_validate_certs }}"
    return_content: true
  register: unifi_users_after
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Work out which reservations and names differ
  ansible.builtin.set_fact:
    unifi_clients_update: >-
      {%- set out = [] -%}
      {%- set live = unifi_users_after.json.data | default(unifi_users.json.data) -%}
      {%- for want in unifi_clients_wanted -%}
      {%-   set have = live | selectattr('mac', 'eq', want.mac) | list | first | default(none) -%}
      {%-   if have is not none -%}
      {%-     set diff = [] -%}
      {%-     if have.name | default('') != want.name -%}{%- set _ = diff.append('name') -%}{%- endif -%}
      {%-     if have.usergroup_id | default('') != want.usergroup_id -%}{%- set _ = diff.append('usergroup_id') -%}{%- endif -%}
      {%-     if have.use_fixedip | default(false) != want.use_fixedip -%}{%- set _ = diff.append('use_fixedip') -%}{%- endif -%}
      {%-     if want.use_fixedip and have.fixed_ip | default('') != want.fixed_ip -%}{%- set _ = diff.append('fixed_ip') -%}{%- endif -%}
      {%-     if diff | length > 0 -%}
      {%-       set _ = out.append({'id': have._id, 'name': want.name, 'fields': diff | sort, 'want': want}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Report the reservations that will change
  ansible.builtin.debug:
    msg: "{{ unifi_clients_update | map(attribute='name') | zip(unifi_clients_update | map(attribute='fields')) | list }}"
  changed_when: unifi_clients_update | length > 0

# The gateway hands out the new address at the next lease renewal, not now. A
# device that is connected keeps the address it has until then, which is why
# this is safe to run while everyone is home.
- name: Apply the declared name and reservation
  ansible.builtin.uri:
    url: "{{ unifi_url }}/proxy/network/api/s/{{ unifi_site }}/rest/user/{{ item.id }}"
    method: PUT
    body_format: json
    body: >-
      {{ {'_id': item.id, 'name': item.name, 'usergroup_id': item.want.usergroup_id,
          'use_fixedip': item.want.use_fixedip}
         | combine({'fixed_ip': item.want.fixed_ip} if item.want.use_fixedip else {}) }}
    headers:
      Cookie: "{{ unifi_login.cookies_string }}"
      X-CSRF-Token: "{{ unifi_login.x_csrf_token }}"
    validate_certs: "{{ unifi_validate_certs }}"
  loop: "{{ unifi_clients_update }}"
  loop_control:
    label: "{{ item.name }} ({{ item.fields | join(', ') }})"
  changed_when: true
  no_log: true
