---
# Provisions client entries on the UniFi gateway from `devices`.
#
# The gateway is the only thing in this estate that can configure a device
# that has no SSH, and it can do so before that device has ever connected: a
# client created on its MAC carries its name and its address reservation from
# the moment it first joins the Wi-Fi.
unifi_url: "https://{{ hostvars['unifi'].ansible_host }}"

# The UniFi site. "default" is the internal id of the first site, whatever it
# is called in the UI.
unifi_site: default

# The gateway serves its own certificate, signed by UniFi's own CA, for an
# address rather than a name. Nothing in this repo distributes that CA, so
# verification is off and the connection is trusted because it never leaves
# the LAN. Turn this on the day the gateway carries a real certificate.
unifi_validate_certs: false

# Bandwidth groups, by name as the UI shows them. A device names one under
# `group:`; anything else lands in the site's default group. The role does not
# create groups - a limit is a decision with a number in it, and inventing one
# silently is worse than failing.
unifi_default_group: Default

# unifi_user and unifi_password have no default on purpose. They are a local
# UniFi account, and come from inventory/host_vars/unifi/vault.yml.
