---
# Imported last from main.yml, after every storage and every backup job has
# been reconciled: reporting and asserting live here, and only here, so one
# fatal assert can never cut the loop above short and hide what came after.
- name: Report which storages differ from what is declared
  ansible.builtin.debug:
    msg: >-
      {{ 'Every declared storage matches the node'
         if proxmox_datacenter_drift | length == 0
         else 'Differs from inventory: ' ~ proxmox_datacenter_drift | join(', ') }}

- name: Report which backup jobs differ from what is declared
  ansible.builtin.debug:
    msg: >-
      {{ 'Every declared backup job matches the node'
         if proxmox_datacenter_job_drift | length == 0
         else 'Differs from inventory: ' ~ proxmox_datacenter_job_drift | join(', ') }}

# Unconditional, unlike the drift assert below: a declared storage or backup
# job that does not exist on the node is a real error regardless of
# proxmox_datacenter_require_clean, not something a plain converge run should
# pass over quietly.
- name: Require every declared storage and backup job to exist
  ansible.builtin.assert:
    that:
      - proxmox_datacenter_missing | length == 0
      - proxmox_datacenter_job_missing | length == 0
    fail_msg: >-
      Not found on the node - storage(s): [{{ proxmox_datacenter_missing | join(', ') }}],
      backup job(s): [{{ proxmox_datacenter_job_missing | join(', ') }}]. This role updates
      declared objects, it does not create them: a storage points Proxmox at a disk, a pool
      or a remote server, which is a decision with data behind it and not one a converge run
      should take on its own; a backup job's ID is generated by Proxmox, so inventing one here
      would produce a second, competing job. Create it once by hand, then transcribe it into
      pve_storages or pve_backup_jobs.
    success_msg: "Every declared storage and backup job exists"

# The real test for this role: ansible.builtin.command is skipped entirely
# under --check, so `changed` stays 0 whether the declared values match or
# not. set_fact and assert DO run in check mode, so the drift lists built
# above are accurate there and this assertion is meaningful.
- name: Require the declared storages and backup jobs to match the node
  ansible.builtin.assert:
    that:
      - proxmox_datacenter_drift | length == 0
      - proxmox_datacenter_job_drift | length == 0
    fail_msg: >-
      These differ from what inventory declares - storage(s): [{{ proxmox_datacenter_drift | join(', ') }}],
      backup job(s): [{{ proxmox_datacenter_job_drift | join(', ') }}].
    success_msg: >-
      All {{ pve_storages | default([]) | length }} declared storages and
      {{ pve_backup_jobs | default([]) | length }} declared backup jobs match
  when: proxmox_datacenter_require_clean | default(false) | bool
