---
- name: Storage definitions
  ansible.builtin.import_tasks: storage.yml

- name: Backup jobs
  ansible.builtin.import_tasks: backup_jobs.yml

- name: Notification targets and matchers
  ansible.builtin.import_tasks: notifications.yml

# Imported last, deliberately. assert is fatal: asserting at the end of
# either reconciliation above would halt the play before the other ran,
# and a verification run is meant to report the whole role in one pass.
- name: Report and verify
  ansible.builtin.import_tasks: verify.yml
