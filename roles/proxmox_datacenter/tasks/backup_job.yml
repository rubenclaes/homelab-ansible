---
- name: Find the live definition of {{ job.id }}
  ansible.builtin.set_fact:
    proxmox_datacenter_job_live: >-
      {{ proxmox_datacenter_jobs_raw.stdout | from_json
         | selectattr('id', 'eq', job.id) | list | first | default({}) }}

# Recorded whether or not it is about to be created, so a --check run with
# proxmox_datacenter_create set still reports what WOULD be made. The creating
# task below is an ansible.builtin.command, which check mode skips silently.
- name: Record a missing backup job - {{ job.id }}
  ansible.builtin.set_fact:
    proxmox_datacenter_job_missing: "{{ proxmox_datacenter_job_missing + [job.id] }}"
  when: proxmox_datacenter_job_live | length == 0

# Off by default. An earlier version of this role refused to create a backup
# job at all, on the belief that Proxmox generates the ID and a created job
# would therefore compete with the declared one. That was wrong, and measured:
# `pvesh usage /cluster/backup -c create --verbose` lists `--id <string>`, so
# the job can be created under exactly the ID inventory names. Creating it is
# still flagged rather than automatic - a job that backs the wrong guests up
# to the wrong storage is worse than no job - but it is no longer impossible.
- name: Create the missing backup job - {{ job.id }}
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'create', '/cluster/backup', '--id', job.id]
         + (job.params | dict2items
            | map(attribute='key') | map('regex_replace', '^', '--') | list
            | zip(job.params | dict2items | map(attribute='value') | map('string') | list)
            | flatten | list) }}
  when:
    - proxmox_datacenter_job_live | length == 0
    - proxmox_datacenter_create | default(false) | bool
  changed_when: true

- name: Reconcile against the live node - {{ job.id }}
  when: proxmox_datacenter_job_live | length > 0
  block:
    # An explicit field-by-field diff, rather than combine-then-compare-to-
    # the-original. combine()-equality only ever proved *that* something
    # differed, never *what*: a declared value present under an existing key
    # but with the wrong value produced no visible field name, only "the
    # merge changed something".
    - name: Work out which fields differ for {{ job.id }}
      ansible.builtin.set_fact:
        proxmox_datacenter_job_diff: >-
          {%- set diff = [] -%}
          {%- for k, v in job.params.items() -%}
          {%-   if proxmox_datacenter_job_live.get(k) != v -%}
          {%-     set _ = diff.append(k) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ diff }}

    - name: Decide whether to update {{ job.id }}
      ansible.builtin.set_fact:
        proxmox_datacenter_job_matches: "{{ proxmox_datacenter_job_diff | length == 0 }}"

    - name: Record drift for {{ job.id }}
      ansible.builtin.set_fact:
        proxmox_datacenter_job_drift: >-
          {{ proxmox_datacenter_job_drift
             + [job.id ~ ' (' ~ (proxmox_datacenter_job_diff | join(', ')) ~ ')'] }}
      when: not proxmox_datacenter_job_matches

    - name: Apply the declared fields to {{ job.id }}
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'set', '/cluster/backup/' ~ job.id]
             + (job.params | dict2items
                | map(attribute='key') | map('regex_replace', '^', '--') | list
                | zip(job.params | dict2items | map(attribute='value') | map('string') | list)
                | flatten | list) }}
      when: not proxmox_datacenter_job_matches
      changed_when: true
