---
- name: Install prerequisites
  ansible.builtin.apt:
    name: "{{ semaphore_apt_packages }}"
    state: present

- name: Create the semaphore system user
  ansible.builtin.user:
    name: "{{ semaphore_user }}"
    system: true
    home: "{{ semaphore_home }}"
    create_home: true
    shell: /usr/sbin/nologin

- name: Create an Ansible virtualenv for Semaphore
  ansible.builtin.pip:
    name: "{{ semaphore_pip_packages }}"
    virtualenv: "{{ semaphore_venv }}"
    virtualenv_command: python3 -m venv

- name: Install Semaphore
  ansible.builtin.apt:
    deb: "https://github.com/semaphoreui/semaphore/releases/download/v{{ semaphore_version }}/semaphore_{{ semaphore_version }}_linux_amd64.deb"

- name: Create config and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ semaphore_user }}"
    group: "{{ semaphore_user }}"
    mode: "0750"
  loop:
    - "{{ semaphore_config_dir }}"
    - "{{ semaphore_home }}/tmp"
    - "{{ semaphore_npm_cache }}"

- name: Deploy Semaphore config from Vault
  ansible.builtin.copy:
    src: config.json
    dest: "{{ semaphore_config_dir }}/config.json"
    owner: "{{ semaphore_user }}"
    group: "{{ semaphore_user }}"
    mode: "0600"
  diff: false
  notify: Restart semaphore

- name: Install systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/semaphore.service
    content: |
      [Unit]
      Description=Semaphore UI
      After=network-online.target
      Wants=network-online.target

      [Service]
      User={{ semaphore_user }}
      Group={{ semaphore_user }}
      Environment=HOME={{ semaphore_home }}
      Environment=PATH={{ semaphore_venv }}/bin:/usr/local/bin:/usr/bin:/bin
      Environment=npm_config_cache={{ semaphore_npm_cache }}
      Environment=SEMAPHORE_SCHEDULE_TIMEZONE={{ semaphore_schedule_timezone }}
      ExecStart=/usr/bin/semaphore server --config {{ semaphore_config_dir }}/config.json
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart semaphore

- name: Enable and start Semaphore
  ansible.builtin.systemd_service:
    name: semaphore
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure .ssh directory for the semaphore user
  ansible.builtin.file:
    path: "{{ semaphore_home }}/.ssh"
    state: directory
    owner: "{{ semaphore_user }}"
    group: "{{ semaphore_user }}"
    mode: "0700"

# The known_hosts tasks below read ssh_host_key_ed25519_public out of every
# managed host's gathered facts. Those facts only exist because the first play
# in playbooks/semaphore.yml gathers them. Running this role on its own, or
# with `--limit semaphore`, limits that play out and leaves the facts undefined.
# Fail with an explanation rather than a bare "undefined variable".
- name: Find managed hosts whose SSH host key was not gathered
  ansible.builtin.set_fact:
    semaphore_known_hosts_missing: "{{ semaphore_known_hosts_missing | default([]) + [item] }}"
  loop: "{{ semaphore_known_hosts_targets }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].ansible_facts['ssh_host_key_ed25519_public'] is not defined

- name: Require gathered facts for every host Semaphore must trust
  ansible.builtin.assert:
    that: semaphore_known_hosts_missing | default([]) | length == 0
    fail_msg: >-
      No gathered SSH host key for: {{ semaphore_known_hosts_missing | default([]) | join(', ') }}.
      Run the full playbook so facts are collected first:
      `ansible-playbook playbooks/semaphore.yml`.
      Do not use `--limit semaphore`; to restrict the run use
      `--limit 'linux:macmini'` instead, which keeps the fact-gathering play in scope.
    success_msg: "Facts present for all {{ semaphore_known_hosts_targets | length }} managed hosts"

- name: Trust managed hosts' SSH keys
  ansible.builtin.known_hosts:
    path: "{{ semaphore_home }}/.ssh/known_hosts"
    name: "{{ hostvars[item].ansible_host }}"
    key: "{{ hostvars[item].ansible_host }} ssh-ed25519 {{ hostvars[item].ansible_facts['ssh_host_key_ed25519_public'] }}"
  loop: "{{ semaphore_known_hosts_targets }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_user: "{{ semaphore_user }}"

- name: Trust GitHub's SSH key
  ansible.builtin.known_hosts:
    path: "{{ semaphore_home }}/.ssh/known_hosts"
    name: github.com
    key: "{{ semaphore_github_host_key }}"
  become: true
  become_user: "{{ semaphore_user }}"
