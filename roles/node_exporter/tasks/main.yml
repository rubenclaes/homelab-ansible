---
- name: Install node_exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false
  register: node_exporter_pkg

# Zonder install_recommends: anders komen ook de collectors mee, en die zetten
# op elke host timers neer voor dingen die hier niet bestaan (ipmitool,
# mellanox).
- name: Install the SMART collectors
  when: node_exporter_smart | bool
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter-collectors
      - smartmontools
      - nvme-cli
      # sponge, waarmee de timers hun .prom-bestand in één keer wegschrijven.
      - moreutils
    state: present
    install_recommends: false
  register: node_exporter_collectors_pkg

# In check mode is een pakket dat nog moet komen er niet, en zijn units dus
# ook niet: dan valt er nog niets aan te zetten.
- name: Enable the SMART timers
  when:
    - node_exporter_smart | bool
    - not (ansible_check_mode and node_exporter_collectors_pkg is changed)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - prometheus-node-exporter-smartmon.timer
    - prometheus-node-exporter-nvme.timer

- name: Enable and start node_exporter
  when: not (ansible_check_mode and node_exporter_pkg is changed)
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

# Of een herstart nodig is, voor het alarm RebootNeeded. Het script is dat
# van roles/baseline (update.yml en het weekrapport), zodat er maar één regel
# is; hier krijgt het een timer en schrijft het een .prom-bestand.
- name: Install the reboot check script
  ansible.builtin.copy:
    src: "{{ role_path }}/../baseline/files/homelab-reboot-check"
    dest: /usr/local/sbin/homelab-reboot-check
    owner: root
    group: root
    mode: "0755"

- name: Install the reboot check units
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dest: /etc/systemd/system/homelab-reboot-check.service
      content: |
        [Unit]
        Description=Write whether a reboot is needed, for node_exporter
        ConditionPathIsDirectory=/var/lib/prometheus/node-exporter

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/homelab-reboot-check /var/lib/prometheus/node-exporter/reboot.prom
    - dest: /etc/systemd/system/homelab-reboot-check.timer
      content: |
        [Unit]
        Description=Check hourly whether a reboot is needed

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1h

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.dest }}"
  register: node_exporter_reboot_units

- name: Enable the reboot check
  when: not (ansible_check_mode and node_exporter_reboot_units is changed)
  ansible.builtin.systemd_service:
    name: homelab-reboot-check.timer
    enabled: true
    state: started
    daemon_reload: "{{ node_exporter_reboot_units is changed }}"
