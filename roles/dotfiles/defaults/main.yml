---
dotfiles_git_config: {}
dotfiles_zsh_block: ""

# zshrc.j2 assumes macOS (Homebrew in /opt/homebrew, zplug); a Linux host
# points this at its own template.
dotfiles_zshrc_template: zshrc.j2

# Where the repo lives on the workstation; `ap` runs playbooks from here.
dotfiles_homelab_repo: "~/Development/homelab-ansible"

# iTerm tab color per host: {color: [host, ...]}. Inventory data, so it lives
# in inventory/group_vars/all/dotfiles.yml. A host that is not listed keeps the
# normal tab color (it still gets a badge).
dotfiles_host_colors: {}
dotfiles_color_rgb:
  red: "200 40 40"
  orange: "230 130 20"
  purple: "140 80 200"
  blue: "40 110 220"
  green: "40 160 80"

# iTerm2: a dynamic profile that inherits from the profile named here, with
# dotfiles_iterm_profile on top, and becomes the default. Edits to it in the
# iTerm UI do not stick: change the parent or these vars. Empty = leave iTerm
# alone (WSL).
dotfiles_iterm_parent: ""
dotfiles_iterm_profile: {}
