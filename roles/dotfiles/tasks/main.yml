---
- name: Ensure ~/.ssh/config.d exists
  ansible.builtin.file:
    path: ~/.ssh/config.d
    state: directory
    mode: "0700"

# Het template loopt over groups['linux'], en op pve01 na komt die groep
# volledig uit homelab.proxmox.yml. Laadt de Proxmox-API niet - en die is hier
# wisselvallig bereikbaar - dan levert dat geen foutmelding maar een lege
# groep, en schrijft het template een SSH-config met nog een enkele host erin.
# Je merkt dat pas als je de volgende dag geen enkele host meer kunt bereiken.
#
# Niet hard falen: de rest van deze rol (git, zshrc) heeft de inventory niet
# nodig en moet gewoon doorlopen. Alleen dit ene bestand blijft dan staan
# zoals het was. Zelfde afweging als de assert in playbooks/docs.yml, andere
# uitkomst, omdat daar het hele doel van de playbook eraan hangt en hier niet.
- name: Check whether the dynamic inventory contributed its guests
  ansible.builtin.set_fact:
    dotfiles_inventory_complete: >-
      {{ groups['linux'] | difference(groups['proxmox']) | length > 0 }}

- name: Generate homelab SSH config from the inventory
  ansible.builtin.template:
    src: ssh_homelab.j2
    dest: ~/.ssh/config.d/homelab
    mode: "0600"
    validate: ssh -G -F %s localhost
  when: dotfiles_inventory_complete | bool

- name: Leave the SSH config alone when the inventory is incomplete
  ansible.builtin.debug:
    msg: >-
      ~/.ssh/config.d/homelab niet aangeraakt: de inventory leverde geen
      Proxmox-guests, dus het template zou hem bijna leeg schrijven. Controleer
      met `ansible-inventory --graph` of de Proxmox-API bereikbaar is en draai
      dit opnieuw. Het bestaande bestand is ongewijzigd.
  when: not (dotfiles_inventory_complete | bool)

- name: Include config.d at the top of ~/.ssh/config
  ansible.builtin.lineinfile:
    path: ~/.ssh/config
    line: Include ~/.ssh/config.d/*
    insertbefore: BOF
    create: true
    mode: "0600"

- name: Global Git settings
  community.general.git_config:
    scope: global
    name: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ dotfiles_git_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure ~/.config/homelab exists
  ansible.builtin.file:
    path: ~/.config/homelab
    state: directory
    mode: "0755"

# ap (playbook menu) and the iTerm colors per host. A file of its own so
# ~/.zshrc stays readable; zshrc.j2 sources it.
# Same guard as the SSH config: the host and Docker lists come from the
# inventory, and an incomplete one would write menus with half the hosts.
- name: Deploy the homelab shell helpers
  ansible.builtin.template:
    src: homelab.zsh.j2
    dest: ~/.config/homelab/homelab.zsh
    mode: "0644"
  when: dotfiles_inventory_complete | bool

- name: Deploy ~/.zshrc
  ansible.builtin.template:
    src: "{{ dotfiles_zshrc_template }}"
    dest: ~/.zshrc
    mode: "0644"
    backup: true

- name: Configure the iTerm2 profile
  when: dotfiles_iterm_parent | length > 0
  block:
    - name: Ensure the iTerm2 DynamicProfiles folder exists
      ansible.builtin.file:
        path: ~/Library/Application Support/iTerm2/DynamicProfiles
        state: directory
        mode: "0755"

    # iTerm picks up a change to this file while it runs.
    - name: Deploy the iTerm2 profile
      ansible.builtin.copy:
        dest: ~/Library/Application Support/iTerm2/DynamicProfiles/homelab-ansible.json
        content: >-
          {{ {'Profiles': [{'Name': dotfiles_iterm_parent ~ ' (Ansible)',
                            'Guid': 'homelab-ansible',
                            'Dynamic Profile Parent Name': dotfiles_iterm_parent}
                           | combine(dotfiles_iterm_profile)]} | to_nice_json }}
        mode: "0644"

    - name: Make it the default iTerm2 profile
      community.general.osx_defaults:
        domain: com.googlecode.iterm2
        key: Default Bookmark Guid
        type: string
        value: homelab-ansible
