- name: Ensure ~/.ssh/config.d exists
  ansible.builtin.file:
    path: ~/.ssh/config.d
    state: directory
    mode: "0700"

- name: Generate homelab SSH config from the inventory
  ansible.builtin.template:
    src: ssh_homelab.j2
    dest: ~/.ssh/config.d/homelab
    mode: "0600"
    validate: ssh -G -F %s localhost

- name: Include config.d at the top of ~/.ssh/config
  ansible.builtin.lineinfile:
    path: ~/.ssh/config
    line: Include ~/.ssh/config.d/*
    insertbefore: BOF

- name: Global Git settings
  community.general.git_config:
    scope: global
    name: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ dotfiles_git_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Deploy ~/.zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: ~/.zshrc
    mode: "0644"
    backup: true