---
# Installs the AdGuard Home binary and its unit, then syncs the DNS rewrite
# list over the REST API (rewrites.yml).
#
# It does NOT manage AdGuardHome.yaml or data/. That file holds the admin
# password hash, the DNS settings and every filter rule, it is edited
# through the web UI, and it is genuine runtime state. Templating it would
# mean this role fights the UI for ownership. The rewrites, blocklists and the
# few DNS settings in adguard_dns go through the API for the same reason: the
# UI keeps the file, the inventory keeps the values that matter.
- name: Read the installed AdGuard Home version
  ansible.builtin.command: "{{ adguard_dir }}/AdGuardHome --version"
  register: adguard_installed
  changed_when: false
  check_mode: false
  failed_when: false

# Only when the pinned version is not what is running. This host resolves DNS
# for the whole network, so an unnecessary binary swap is an outage.
- name: Install AdGuard Home
  when: adguard_version | regex_replace('^v', '') not in (adguard_installed.stdout | default(''))
  block:
    - name: Ensure the install directory exists
      ansible.builtin.file:
        path: "{{ adguard_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # In twee stappen, en niet met één unarchive vanaf de URL: `unarchive`
    # kent geen `checksum`-parameter. Dat stond er wel, en Ansible faalt
    # daarop - alleen kwam dat nooit uit, omdat het hele blok werd
    # overgeslagen zolang de geinstalleerde versie klopte. `get_url` doet de
    # controle wel, en dat is de enige plek waar de pin iets waard is.
    - name: Download the release
      ansible.builtin.get_url:
        url: "{{ adguard_url }}"
        dest: "/tmp/AdGuardHome_{{ adguard_version }}.tar.gz"
        checksum: "{{ adguard_checksum }}"
        mode: "0600"
      register: adguard_tarball

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: "{{ adguard_tarball.dest }}"
        dest: "{{ adguard_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]
        owner: root
        group: root
      notify: Restart AdGuardHome

- name: Install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/AdGuardHome.service
    content: |
      [Unit]
      Description=AdGuard Home: Network-level blocker
      ConditionFileIsExecutable={{ adguard_dir }}/AdGuardHome
      After=syslog.target network-online.target

      [Service]
      StartLimitInterval=5
      StartLimitBurst=10
      ExecStart={{ adguard_dir }}/AdGuardHome "-s" "run"
      WorkingDirectory={{ adguard_dir }}
      StandardOutput=file:/var/log/AdGuardHome.out
      StandardError=file:/var/log/AdGuardHome.err
      Restart=always
      RestartSec=10
      EnvironmentFile=-/etc/sysconfig/AdGuardHome

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for AdGuardHome

- name: Ensure AdGuard Home is enabled and running
  ansible.builtin.systemd_service:
    name: AdGuardHome
    enabled: true
    state: started

- name: Sync the DNS rewrites
  ansible.builtin.import_tasks: rewrites.yml

- name: Sync the blocklists
  ansible.builtin.import_tasks: filters.yml
  when: adguard_filters | length > 0

- name: Sync the DNS settings
  ansible.builtin.import_tasks: dns.yml
  when: adguard_dns | length > 0
