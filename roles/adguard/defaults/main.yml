---
# AdGuard Home ships as a tarball, not a package, so the version is pinned
# here and the checksum comes from the release's own checksums.txt. Bumping
# the version means bumping the checksum with it, deliberately - this host is
# the network's DNS, and replacing the binary interrupts resolution for
# everything.
# Bijgewerkt op 23-09 van v0.107.71 naar wat er draait. AdGuard werkt zichzelf
# niet bij - er is geen timer, geen cron en geen auto_update in zijn config -
# maar de knop "Update now" in de web-UI doet het wel, en die is op 22-09
# gebruikt. De rol wilde daarna de oude binary terugzetten, wat een
# DNS-onderbreking voor het hele huis was geweest.
#
# Werk je hem bij via de UI, werk dan deze twee regels mee bij. De checksum
# staat in checksums.txt bij de release:
#
#   curl -sL https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.XX/checksums.txt | grep linux_amd64
adguard_version: v0.107.79
adguard_checksum: sha256:c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f

adguard_dir: /opt/AdGuardHome
adguard_url: >-
  https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz

# --- DNS rewrites ---------------------------------------------------------
# The one part of AdGuard's configuration this role does own: the rewrite
# list, and within it only the names under adguard_rewrite_domain plus the
# domains in adguard_rewrites_extra. They are set through the REST API, so
# AdGuardHome.yaml is never written and the web UI keeps every other
# setting. Any other rewrite - one made by hand in the UI - is never touched.
#
# home.arpa is the zone RFC 8375 reserves for exactly this. It never resolves
# on the public internet, so a query that leaks is harmless, and it cannot
# collide with the *.neodata.be names Caddy serves: `semaphore` is both a
# host and a route, and only one of them may own semaphore.neodata.be.
#
# Also set, as a plain value, in inventory/host_vars/adguard/main.yml, so
# docs.yml can read it through hostvars.
adguard_rewrite_domain: home.arpa

# Rewrites that are not a host, as {domain, answer}. The role owns each
# domain listed here: a different answer for it is replaced. The real list
# is in inventory/host_vars/adguard/main.yml.
adguard_rewrites_extra: []

# adguard_api_user and adguard_api_password have no default on purpose. They
# are the web UI login, and come from inventory/host_vars/adguard/vault.yml.
# The role fails without them rather than skipping the sync silently: a
# rewrite list that quietly stops being applied is worse than a red run.

# Where the web API listens. The port is read from AdGuardHome.yaml
# (http.address) at run time, so the role follows whatever the setup wizard
# chose; override this only if the API is not on the host itself.
adguard_api_url: "http://127.0.0.1:{{ adguard_http_port }}"

# Blocklists. Leeg betekent "niet beheren", niet "alles weghalen": een lege
# lijst met een rol die de lijst bezit zou bij de eerste run elke blocklist
# verwijderen, en dat is een dure manier om erachter te komen. De echte lijst
# staat in inventory/host_vars/adguard/main.yml.
adguard_filters: []

# DNS settings synced over the API by tasks/dns.yml. Only the keys listed are
# managed; the rest stays whatever the web UI made it. Empty: nothing synced.
adguard_dns: {}
