---
# No Ansible module covers PBS, so this is proxmox-backup-manager wrapped for
# idempotency: list current state as JSON, compare against what is declared,
# and act only on a difference. changed_when comes from that comparison, never
# from the command's exit code - `datastore create` on an existing store fails
# rather than no-ops, so a bare command would report changed on every run and
# fail on the second.
#
# pbs_missing collects what would be created. An absent
# datastore or job is not an error here: creating it is exactly what this
# role is for. Reporting and asserting on this list happens in verify.yml,
# imported last from main.yml, not here.
#
# Objects that already exist are compared field by field at the end of this
# file (gc_schedule, schedule, keep_last, outdated_after, ignore_verified) and
# put back when they differ. Jobs PBS has that the inventory does not declare
# (offsite-prune, from offsite.yml) are left alone.
- name: Start with an empty missing-objects list
  ansible.builtin.set_fact:
    pbs_missing: []

- name: Read the current PBS datastores
  ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
  register: pbs_datastores_current
  changed_when: false
  check_mode: false

# Recorded before creating: the record
# has to reflect what's about to happen even under --check, where the
# command task right below never runs.
- name: Record the datastores that would be created
  ansible.builtin.set_fact:
    pbs_missing: "{{ pbs_missing + ['datastore ' ~ item.name] }}"
  loop: "{{ pbs_datastores | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (pbs_datastores_current.stdout | from_json | map(attribute='name') | list)

- name: Create datastores that do not exist yet
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - create
      - "{{ item.name }}"
      - "{{ item.path }}"
      - --gc-schedule
      - "{{ item.gc_schedule }}"
  loop: "{{ pbs_datastores | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (pbs_datastores_current.stdout | from_json | map(attribute='name') | list)
  changed_when: true

- name: Read the current prune jobs
  ansible.builtin.command: proxmox-backup-manager prune-job list --output-format json
  register: pbs_prune_current
  changed_when: false
  check_mode: false

- name: Record the prune jobs that would be created
  ansible.builtin.set_fact:
    pbs_missing: "{{ pbs_missing + ['prune job ' ~ item.id] }}"
  loop: "{{ pbs_prune_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.id not in (pbs_prune_current.stdout | from_json | map(attribute='id') | list)

- name: Create prune jobs that do not exist yet
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - prune-job
      - create
      - "{{ item.id }}"
      - --store
      - "{{ item.store }}"
      - --schedule
      - "{{ item.schedule }}"
      - --keep-last
      - "{{ item.keep_last }}"
  loop: "{{ pbs_prune_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.id not in (pbs_prune_current.stdout | from_json | map(attribute='id') | list)
  changed_when: true

- name: Read the current verify jobs
  ansible.builtin.command: proxmox-backup-manager verify-job list --output-format json
  register: pbs_verify_current
  changed_when: false
  check_mode: false

- name: Record the verify jobs that would be created
  ansible.builtin.set_fact:
    pbs_missing: "{{ pbs_missing + ['verify job ' ~ item.id] }}"
  loop: "{{ pbs_verify_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.id not in (pbs_verify_current.stdout | from_json | map(attribute='id') | list)

- name: Create verify jobs that do not exist yet
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - verify-job
      - create
      - "{{ item.id }}"
      - --store
      - "{{ item.store }}"
      - --schedule
      - "{{ item.schedule }}"
      - --outdated-after
      - "{{ item.outdated_after }}"
      - --ignore-verified
      - "{{ item.ignore_verified | string | lower }}"
  loop: "{{ pbs_verify_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.id not in (pbs_verify_current.stdout | from_json | map(attribute='id') | list)
  changed_when: true

# --- What already exists: steer it back to the inventory --------------------
# A change in the PBS UI (keep_last, a schedule) is put back, and Drift check
# sees it first: the report below is `changed` under --check too.
- name: Start with an empty list of differences
  ansible.builtin.set_fact:
    pbs_drift: []

- name: Record the datastores whose GC schedule differs
  ansible.builtin.set_fact:
    pbs_drift: >-
      {{ pbs_drift + [{'what': 'datastore ' ~ item.name ~ ': gc-schedule ' ~ live['gc-schedule'] | default('-')
                               ~ ' -> ' ~ item.gc_schedule,
                       'argv': ['proxmox-backup-manager', 'datastore', 'update', item.name,
                                '--gc-schedule', item.gc_schedule]}] }}
  loop: "{{ pbs_datastores | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    live: "{{ pbs_datastores_current.stdout | from_json | selectattr('name', 'eq', item.name) | first | default({}) }}"
  when:
    - live | length > 0
    - live['gc-schedule'] | default('') != item.gc_schedule

- name: Record the prune jobs that differ
  ansible.builtin.set_fact:
    pbs_drift: >-
      {{ pbs_drift + [{'what': 'prune job ' ~ item.id ~ ': schedule ' ~ live.schedule | default('-')
                               ~ ', keep-last ' ~ live['keep-last'] | default('-')
                               ~ ' -> ' ~ item.schedule ~ ', ' ~ item.keep_last,
                       'argv': ['proxmox-backup-manager', 'prune-job', 'update', item.id,
                                '--schedule', item.schedule, '--keep-last', item.keep_last | string]}] }}
  loop: "{{ pbs_prune_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    live: "{{ pbs_prune_current.stdout | from_json | selectattr('id', 'eq', item.id) | first | default({}) }}"
  when:
    - live | length > 0
    - >-
      live.schedule | default('') != item.schedule
      or live['keep-last'] | default(0) | int != item.keep_last | int

- name: Record the verify jobs that differ
  ansible.builtin.set_fact:
    pbs_drift: >-
      {{ pbs_drift + [{'what': 'verify job ' ~ item.id ~ ': schedule ' ~ live.schedule | default('-')
                               ~ ', outdated-after ' ~ live['outdated-after'] | default('-')
                               ~ ', ignore-verified ' ~ live['ignore-verified'] | default('-')
                               ~ ' -> ' ~ item.schedule ~ ', ' ~ item.outdated_after ~ ', ' ~ item.ignore_verified,
                       'argv': ['proxmox-backup-manager', 'verify-job', 'update', item.id,
                                '--schedule', item.schedule,
                                '--outdated-after', item.outdated_after | string,
                                '--ignore-verified', item.ignore_verified | string | lower]}] }}
  loop: "{{ pbs_verify_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    live: "{{ pbs_verify_current.stdout | from_json | selectattr('id', 'eq', item.id) | first | default({}) }}"
  when:
    - live | length > 0
    - >-
      live.schedule | default('') != item.schedule
      or live['outdated-after'] | default(-1) | int != item.outdated_after | int
      or live['ignore-verified'] | default(true) | bool != item.ignore_verified | bool

# A command is skipped under --check, so this report is what Drift check sees.
- name: Report the PBS settings that will be put back
  ansible.builtin.debug:
    msg: "{{ pbs_drift | map(attribute='what') | list }}"
  changed_when: true
  when: pbs_drift | length > 0

- name: Put them back
  ansible.builtin.command:
    argv: "{{ item.argv }}"
  loop: "{{ pbs_drift }}"
  loop_control:
    label: "{{ item.what }}"
  changed_when: true
