---
# Its own file, imported last, so every task file before it has added to
# pbs_missing first.
#
# `changed` when something is listed: the proxmox-backup-manager commands that
# create or correct it are skipped under --check, so without this a dry run
# (and with it playbooks/drift.yml) would count zero changes.
- name: Report which PBS objects are missing or differ
  ansible.builtin.debug:
    msg: >-
      {{ 'Every declared PBS object is in place'
         if pbs_missing | length == 0
         else 'Would be created or corrected: ' ~ pbs_missing | join(', ') }}
  changed_when: pbs_missing | length > 0
