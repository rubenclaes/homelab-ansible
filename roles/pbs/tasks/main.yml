---
# Installs Proxmox Backup Server and declares its datastore and jobs.
#
# The datastore and its prune and verify jobs WERE deliberately unmanaged
# here, on the grounds that recreating them from a playbook means fighting the
# appliance for ownership of its own state. That reasoning was reversed on
# 2026-09-21: it holds for large hand-tuned runtime state like
# AdGuardHome.yaml, but not for one datastore and two jobs that are small,
# stable, and worthless to reconstruct by hand during a rebuild. See
# docs/superpowers/specs/2026-09-21-proxmox-rebuild-path-design.md, decision 1.
#
# API tokens remain unmanaged. They are secrets, and nothing in this repo
# reads /etc/pve/priv or its PBS equivalent.
- name: Install the Proxmox archive keyring
  ansible.builtin.copy:
    src: proxmox-archive-keyring.gpg
    dest: "{{ pbs_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Define the Proxmox Backup Server repository
  ansible.builtin.deb822_repository:
    name: proxmox
    types: [deb]
    uris: "{{ pbs_repo_uri }}"
    suites: ["{{ pbs_repo_suite }}"]
    components: ["{{ pbs_repo_component }}"]
    signed_by: "{{ pbs_keyring }}"
    state: present
    enabled: true
  register: pbs_repo

# A fresh install enables this, and without a subscription every apt run then
# fails on it with 401. Disabled rather than deleted, so the file stays as
# documentation of what would be used with a subscription.
- name: Keep the enterprise repository disabled
  ansible.builtin.deb822_repository:
    name: pbs-enterprise
    types: [deb]
    uris: https://enterprise.proxmox.com/debian/pbs
    suites: ["{{ pbs_repo_suite }}"]
    components: [pbs-enterprise]
    signed_by: "{{ pbs_keyring }}"
    state: present
    enabled: false
  register: pbs_enterprise_repo

- name: Refresh the package list when a repository changed
  ansible.builtin.apt:
    update_cache: true
  when: pbs_repo is changed or pbs_enterprise_repo is changed

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present

- name: Ensure the PBS services are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - proxmox-backup
    - proxmox-backup-proxy

- name: Datastore and job configuration
  ansible.builtin.import_tasks: config.yml

- name: Report and verify
  ansible.builtin.import_tasks: verify.yml
