---
# Off-site kopie naar een S3-bucket (Cloudflare R2): een S3-endpoint, een
# datastore met S3-backend en een prune job erop. Zelfde aanpak als
# config.yml: lees wat er is, maak wat ontbreekt, laat bestaande objecten
# met rust.
#
# De sleutels van het endpoint worden wel bijgewerkt als ze in de vault
# veranderen: een verlopen R2-token zou anders stil blijven hangen.

- name: Read the current S3 endpoints
  ansible.builtin.command: proxmox-backup-manager s3 endpoint list --output-format json
  register: pbs_s3_current
  changed_when: false
  check_mode: false

- name: Create or update the S3 endpoint
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - s3
      - endpoint
      - "{{ 'update' if pbs_offsite.endpoint_id in (pbs_s3_current.stdout | from_json | map(attribute='id') | list) else 'create' }}"
      - "{{ pbs_offsite.endpoint_id }}"
      - --endpoint
      - "{{ pbs_offsite.endpoint }}"
      - --region
      - "{{ pbs_offsite.region }}"
      - --path-style
      - "true"
      - --access-key
      - "{{ pbs_offsite.access_key }}"
      - --secret-key
      - "{{ pbs_offsite.secret_key }}"
  when: >-
    pbs_offsite.endpoint_id not in (pbs_s3_current.stdout | from_json | map(attribute='id') | list)
    or (pbs_s3_current.stdout | from_json | selectattr('id', 'eq', pbs_offsite.endpoint_id) | first).get('access-key') != pbs_offsite.access_key
  changed_when: true
  no_log: true

# Faalt hier, dan klopt het token, de endpoint of de bucketnaam niet. Beter
# nu dan om 04:00 in een sync job die niemand leest.
- name: Check that the bucket answers
  ansible.builtin.command:
    argv: [proxmox-backup-manager, s3, check, "{{ pbs_offsite.endpoint_id }}", "{{ pbs_offsite.bucket }}"]
  changed_when: false
  check_mode: false
  when: pbs_offsite.endpoint_id in (pbs_s3_current.stdout | from_json | map(attribute='id') | list) or not ansible_check_mode

- name: Read the current datastores for the off-site store
  ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
  register: pbs_offsite_ds_current
  changed_when: false
  check_mode: false

- name: Create the local cache directory of the off-site store
  ansible.builtin.file:
    path: "{{ pbs_offsite.cache_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"

# counter-reset-schedule monthly en de drempels: PBS telt zelf de S3-
# verzoeken en meldt (via de bestaande ntfy-matcher) als ze oplopen. Een
# tweede vangnet naast r2-guard, dat wel stopt.
- name: Create the off-site datastore
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - create
      - "{{ pbs_offsite.datastore }}"
      - "{{ pbs_offsite.cache_path }}"
      - --backend
      - "type=s3,client={{ pbs_offsite.endpoint_id }},bucket={{ pbs_offsite.bucket }}"
      - --gc-schedule
      - daily
      - --counter-reset-schedule
      - monthly
      - --notification-thresholds
      - "s3-put=200000,s3-get=2000000"
      # Na een herbouw van PBS staat de bucket al vol: dan met
      # -e pbs_offsite_reuse=true, zie de runbook "Terughalen uit R2".
      - --reuse-datastore
      - "{{ pbs_offsite_reuse | default(false) | string | lower }}"
      - --overwrite-in-use
      - "{{ pbs_offsite_reuse | default(false) | string | lower }}"
  when: pbs_offsite.datastore not in (pbs_offsite_ds_current.stdout | from_json | map(attribute='name') | list)
  changed_when: true

- name: Read the current prune jobs for the off-site store
  ansible.builtin.command: proxmox-backup-manager prune-job list --output-format json
  register: pbs_offsite_prune_current
  changed_when: false
  check_mode: false

- name: Create the prune job of the off-site store
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - prune-job
      - create
      - "{{ pbs_offsite.datastore }}-prune"
      - --store
      - "{{ pbs_offsite.datastore }}"
      - --schedule
      - daily
      - --keep-last
      - "{{ pbs_offsite.keep_last }}"
  when: (pbs_offsite.datastore ~ '-prune') not in (pbs_offsite_prune_current.stdout | from_json | map(attribute='id') | list)
  changed_when: true

- name: Read the current sync jobs
  ansible.builtin.command: proxmox-backup-manager sync-job list --output-format json
  register: pbs_offsite_sync_current
  changed_when: false
  check_mode: false

# Lokaal (geen --remote): van store1 naar de R2-datastore, alleen de
# gekozen groepen, alleen versleutelde snapshots, laatste N.
#
# Zonder schema: alleen r2-guard start hem, na een geslaagde check. En
# nooit remove-vanished: na een herbouw is store1 leeg, en dan zou de sync
# alles in R2 wissen, precies wanneer je het nodig hebt. Opruimen in R2
# doet de prune job (keep-last).
- name: Create the sync job to the off-site store
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 'sync-job', 'create', pbs_offsite.sync_job,
          '--store', pbs_offsite.datastore,
          '--remote-store', pbs_datastores[0].name,
          '--transfer-last', pbs_offsite.keep_last | string,
          '--remove-vanished', 'false',
          '--encrypted-only', 'true',
          '--comment', 'Naar Cloudflare R2; alleen r2-guard start hem']
         + (pbs_offsite.groups | map('regex_replace', '^', 'group:') | map('regex_replace', '^', '--group-filter=') | list) }}
  when: pbs_offsite.sync_job not in (pbs_offsite_sync_current.stdout | from_json | map(attribute='id') | list)
  changed_when: true

# De twee instellingen die over "nooit wissen" en "nooit zonder check" gaan,
# worden wel afgedwongen: een schema of remove-vanished dat er met de hand
# (of in de web-UI) bij kwam, gaat er weer af.
- name: Keep the sync job unscheduled and non-destructive
  ansible.builtin.command:
    argv: [proxmox-backup-manager, sync-job, update, "{{ pbs_offsite.sync_job }}", --delete, schedule, --delete, remove-vanished]
  when: >-
    (pbs_offsite_sync_current.stdout | from_json | selectattr('id', 'eq', pbs_offsite.sync_job) | list | length > 0)
    and (((pbs_offsite_sync_current.stdout | from_json | selectattr('id', 'eq', pbs_offsite.sync_job) | first).get('schedule', '') | length > 0)
         or ((pbs_offsite_sync_current.stdout | from_json | selectattr('id', 'eq', pbs_offsite.sync_job) | first).get('remove-vanished', false) | bool))
  changed_when: true

# r2-guard: zie het script. Meet R2 en start dan pas de sync; stopt als R2
# de gratis laag nadert of als hij het gebruik niet kan opvragen.
- name: Create the r2-guard directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [/etc/r2-guard, /var/lib/r2-guard]

- name: Write the r2-guard credentials
  ansible.builtin.copy:
    content: |
      CF_ACCOUNT={{ vault_r2_account_id }}
      CF_TOKEN={{ vault_cf_analytics_token }}
      R2_ACCESS_KEY={{ pbs_offsite.access_key }}
      R2_SECRET_KEY={{ pbs_offsite.secret_key }}
      BUCKET={{ pbs_offsite.bucket }}
      JOB={{ pbs_offsite.sync_job }}
      WARN_GB={{ pbs_offsite.warn_gb }}
      STOP_GB={{ pbs_offsite.stop_gb }}
      STOP_CLASS_A={{ pbs_offsite.stop_class_a }}
      STOP_CLASS_B={{ pbs_offsite.stop_class_b }}
      NTFY_URL={{ pbs_notification_webhooks | selectattr('name', 'eq', 'ntfy') | map(attribute='url') | first }}
      NTFY_TOKEN={{ hostvars['pve01'].vault_ntfy_pbs_token }}
    dest: /etc/r2-guard/env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install r2-guard
  ansible.builtin.template:
    src: r2-guard.py.j2
    dest: /usr/local/sbin/r2-guard
    owner: root
    group: root
    mode: "0700"

- name: Install the r2-guard service and timer
  ansible.builtin.template:
    src: "r2-guard.{{ item }}.j2"
    dest: "/etc/systemd/system/r2-guard.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: pbs_r2_guard_units

- name: Enable the r2-guard timer
  ansible.builtin.systemd_service:
    name: r2-guard.timer
    enabled: true
    state: started
    daemon_reload: "{{ pbs_r2_guard_units.changed }}"
