---
galaxy_info:
  role_name: pbs
  author: rubenclaes
  description: >-
    Installs Proxmox Backup Server and declares its datastore and its prune
    and verify jobs from pbs_datastores, pbs_prune_jobs and pbs_verify_jobs.
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions:
        - trixie
  galaxy_tags:
    - system
    - backup

# These roles are composed by playbooks, not by role dependencies,
# so the run order stays visible in playbooks/site.yml.
dependencies: []
