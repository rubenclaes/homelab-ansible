---
galaxy_info:
  role_name: tailscale
  author: rubenclaes
  description: >-
    Installs the Tailscale client. Joins the tailnet with a single-use key
    when the host has an OAuth client; otherwise the join stays manual.
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
  galaxy_tags:
    - networking
    - vpn

# These roles are composed by playbooks, not by role dependencies,
# so the run order stays visible in playbooks/site.yml.
dependencies: []
