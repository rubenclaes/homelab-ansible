---
# Installs the Tailscale client and, when the host has an OAuth client in its
# vault, joins the tailnet. The node's identity is state that lives in
# /var/lib/tailscale, so a node that is already Running is never touched; only
# a node that is not on the tailnet - fresh, rebuilt, or expired - mints itself
# a single-use key (mint_key.yml) and runs `tailscale up` with it. Without an
# OAuth client the role reports and leaves the join to you.
- name: Install the Tailscale archive keyring
  ansible.builtin.copy:
    src: tailscale-archive-keyring.gpg
    dest: "{{ tailscale_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Define the Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "{{ tailscale_repo_uri }}"
    suites: ["{{ tailscale_repo_suite }}"]
    components: [main]
    signed_by: "{{ tailscale_keyring }}"
    state: present
    enabled: true
  register: tailscale_repo

- name: Remove the superseded one-line repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent
  register: tailscale_old_repo

- name: Refresh the package list when the repository changed
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo is changed or tailscale_old_repo is changed

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Ensure tailscaled is enabled and running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Read the tailnet backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false
  failed_when: false

- name: Note whether the node is on the tailnet
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ (tailscale_status.stdout | from_json).BackendState | default('unknown')
         if tailscale_status.rc == 0 else 'unknown' }}

- name: Report that the node still needs authenticating
  ansible.builtin.debug:
    msg: >-
      tailscaled runs but this node is not on the tailnet
      ({{ tailscale_backend_state }}). Authenticate once with `tailscale up`,
      or give the host an OAuth client (see roles/tailscale/defaults) and the
      role will do it with a single-use key.
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_oauth_client_secret is not defined or tailscale_status.rc != 0

- name: Report that the node would join the tailnet
  ansible.builtin.debug:
    msg: >-
      This node is not on the tailnet ({{ tailscale_backend_state }}). A real
      run mints a single-use key tagged {{ tailscale_tags | join(', ') }} and
      joins.
  changed_when: true
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_oauth_client_secret is defined
    - tailscale_status.rc == 0
    - ansible_check_mode

# rc == 0: only a tailscaled that answers gets a key. A daemon that does not
# would fail `tailscale up` after the key was minted, and the key is spent.
- name: Join the tailnet with a single-use key
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_oauth_client_secret is defined
    - tailscale_status.rc == 0
    - not ansible_check_mode
  block:
    - name: Mint a key for this node
      ansible.builtin.include_tasks: mint_key.yml
      vars:
        tailscale_key_description: "ansible-{{ inventory_hostname }}"
        tailscale_key_tags: "{{ tailscale_tags }}"

    # argv rather than a shell line: the key must not pass through a shell,
    # and no_log keeps it out of the run's output.
    - name: Bring the node up
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--auth-key=' ~ tailscale_minted_key] + tailscale_up_extra_args }}"
      changed_when: true
      no_log: true

    - name: Re-read the tailnet backend state
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_after
      changed_when: false

    - name: Require the node to be on the tailnet now
      ansible.builtin.assert:
        that: (tailscale_status_after.stdout | from_json).BackendState | default('') == 'Running'
        fail_msg: >-
          `tailscale up` returned but the backend reports
          {{ (tailscale_status_after.stdout | from_json).BackendState | default('unknown') }}.
          Key {{ tailscale_minted_key_id }} was single-use and is spent; check
          `tailscale status` on the host.
        success_msg: "Joined the tailnet with single-use key {{ tailscale_minted_key_id }}."
