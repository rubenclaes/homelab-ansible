---
- name: Refuse to run without the ntfy token
  ansible.builtin.assert:
    that: prometheus_config_ntfy_token | length > 0
    fail_msg: >-
      vault_ntfy_alertmanager_token is empty. It lives in
      inventory/group_vars/all/vault.yml. Nothing was changed.
    quiet: true

# 65534 is `nobody`, de gebruiker van de prometheus- en alertmanager-images.
- name: Create the config and data folders
  ansible.builtin.file:
    path: "{{ prometheus_config_data_dir }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: prometheus/config, owner: root }
    - { path: prometheus/config/rules, owner: root }
    - { path: alertmanager/config, owner: root }
    - { path: alertmanager/data, owner: "65534" }

# Elk bestand wordt eerst gecontroleerd met de tool uit het image zelf
# (validate). Een fout komt dan niet op de host, en de draaiende config blijft.
- name: Write the Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_data_dir }}/prometheus/config/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/prometheus.yml:ro --entrypoint promtool
      prom/prometheus:latest check config --syntax-only /prometheus.yml
  notify: Reload Prometheus

- name: Write the alert rules
  ansible.builtin.copy:
    src: homelab.rules.yml
    dest: "{{ prometheus_config_data_dir }}/prometheus/config/rules/homelab.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/rules.yml:ro --entrypoint promtool
      prom/prometheus:latest check rules /rules.yml
  notify: Reload Prometheus

# Bevat het ntfy-token: alleen leesbaar voor de container.
- name: Write the Alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ prometheus_config_data_dir }}/alertmanager/config/alertmanager.yml"
    owner: "65534"
    group: root
    mode: "0400"
    validate: >-
      docker run --rm --user 0 -v %s:/alertmanager.yml:ro --entrypoint amtool
      prom/alertmanager:latest check-config /alertmanager.yml
  notify: Reload Alertmanager
  no_log: true
