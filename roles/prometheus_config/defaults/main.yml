---
# De config van de monitoring-stack op docker-grafana-stack: wat Prometheus
# ophaalt, wanneer iets een alarm is, waar dat alarm heen gaat (ntfy), en de
# databronnen en dashboards van Grafana.
#
# De containers zelf staan in github.com/rubenclaes/monitoring-stack; hun
# config-mappen zijn bind mounts uit de data-map, en die vult deze rol. Zo
# volgen de scrape-doelen uit de inventory, net als de upstreams van Caddy:
# een host erbij in `linux` is een host erbij in Prometheus.

# ${DATA_PATH} uit de .env van de stack, en het pad van de checkout (zie
# roles/docker_stacks/defaults).
prometheus_config_data_dir: /opt/containers/data/monitoring
prometheus_config_stack_dir: /opt/containers/stacks/monitoring

# Elke host in deze groep draait node_exporter (roles/node_exporter) op 9100.
prometheus_config_node_group: linux
# Hosts buiten die groep die node_exporter ook draaien, bv. een Mac via
# macos_brew_services. Geen hele groep `macs`: de MacBook is vaak uit, en
# dat zou elke keer HostDown geven.
prometheus_config_node_extra_hosts: []
prometheus_config_node_port: 9100

# Naar ntfy op het IP (ntfy_url, group_vars/all/ntfy.yml), niet
# ntfy.neodata.be: een alarm mag niet afhangen van Caddy en AdGuard.
# `template=alertmanager` laat ntfy zelf van de JSON van Alertmanager een
# leesbaar bericht maken.
prometheus_config_ntfy_url: "{{ ntfy_url }}?template=alertmanager"
prometheus_config_ntfy_token: "{{ vault_ntfy_alertmanager_token }}"

# Hoe lang een alarm moet duren voor het een melding wordt, en om de hoeveel
# tijd je het opnieuw hoort zolang het niet opgelost is.
prometheus_config_repeat_interval: 12h

# --- Grafana ---------------------------------------------------------------
# De databronnen en dashboards, als provisioning: Grafana leest ze bij het
# starten uit ${DATA_PATH}/grafana-provisioning. De uids zijn die van de
# databronnen die eerst met de hand gemaakt waren (gelezen op 06-10); zo
# blijven ze dezelfde, en verwijzen de dashboards naar iets vasts.
#
# Niet zomaar wijzigen: files/grafana/homelab-hosts.json noemt de uid van
# Prometheus letterlijk, in elk paneel. Een andere uid hier laat elk paneel
# leeg, tot je hem daar ook vervangt.
prometheus_config_grafana_prometheus_uid: bffp6ddhc3oqoc
prometheus_config_grafana_loki_uid: effp6gq275czka
