# Beheerd door Ansible: roles/prometheus_config/files/homelab.rules.yml in
# homelab-ansible.
#
# Alleen alarmen waar je iets mee moet. Elk alarm hier wordt een melding op je
# telefoon; wat je toch zou negeren, hoort hier niet.
groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} antwoordt niet"
          description: "node_exporter op {{ $labels.instance }} is al 5 minuten onbereikbaar: de host ligt plat, of de exporter."

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
            / node_filesystem_size_bytes < 0.10
          and node_filesystem_readonly == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} bijna vol"
          description: "Nog {{ $value | humanizePercentage }} vrij op {{ $labels.mountpoint }}."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: bijna geen geheugen meer"
          description: "Nog {{ $value | humanizePercentage }} beschikbaar."

      # unattended-upgrades zet kernels neer, maar niets herstart. Uit
      # roles/node_exporter (homelab-reboot-check).
      - alert: RebootNeeded
        expr: |
          homelab_reboot_needed == 1
          and time() - homelab_reboot_needed_since_seconds > 7 * 86400
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} draait al een week een oude kernel"
          description: >-
            ansible-playbook playbooks/update.yml --limit {{ $labels.instance }}
            (pve01: met -e allow_hypervisor_reboot=true).

      # RebootNeeded kijkt naar reboot.prom. Schrijft de timer niet meer, of
      # nooit, dan is er geen metric en gaat RebootNeeded nooit af. Elke
      # Linux-host krijgt de timer (roles/node_exporter); de Macs niet.
      - alert: RebootCheckStale
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*reboot\\.prom"} > 3 * 3600
          or (up{job="node", kind!="mac"} == 1
              unless on (instance) node_textfile_mtime_seconds{file=~".*reboot\\.prom"})
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: de reboot-check schrijft niets"
          description: >-
            systemctl status homelab-reboot-check.timer homelab-reboot-check.service.
            Ontbreekt de timer: ansible-playbook playbooks/monitoring.yml --limit {{ $labels.instance }}.

  - name: updates
    interval: 1h
    rules:
      # Alleen waar de apt-collector draait (pve01): die krijgt geen updates
      # op schema, zie de template "Update pve01" in Semaphore.
      #
      # Niet `for: 14d`: die teller begint opnieuw na elke herstart van
      # Prometheus of elk gat in de reeks, en zo gaat het alarm nooit af. Dit
      # kijkt terug: twee weken lang nooit nul. De tweede regel wacht tot er
      # (bijna) twee weken data is, anders gaat het af op een verse Prometheus.
      # Prometheus moet daarvoor 14 dagen bewaren; de standaard is 15.
      #
      # Een eigen groep met `interval: 1h`: twee weken terugkijken elke 15
      # seconden is verspilling voor iets dat hooguit per uur verandert.
      - alert: UpdatesPending
        expr: |
          min_over_time((sum by (instance) (apt_upgrades_pending))[14d:1h]) > 0
          and on (instance)
          count_over_time((sum by (instance) (apt_upgrades_pending))[14d:1h]) > 13 * 24
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: al twee weken minstens {{ $value }} updates open"
          description: "Semaphore → Update pve01, of ansible-playbook playbooks/update.yml --limit {{ $labels.instance }}."

  - name: disks
    rules:
      - alert: ZfsPoolUnhealthy
        expr: node_zfs_zpool_state{state!="online"} > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: ZFS-pool {{ $labels.zpool }} is {{ $labels.state }}"
          description: "zpool status {{ $labels.zpool }} op {{ $labels.instance }}."

      - alert: SmartFailing
        expr: smartmon_device_smart_healthy == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: schijf {{ $labels.disk }} faalt SMART"
          description: "smartctl -H {{ $labels.disk }} geeft FAILED. Vervangen."

      # SATA: Percent_Lifetime_Remain (Crucial, attribuut 202), genormaliseerd
      # 100 -> 0. NVMe: percentage_used, als ratio 0 -> 1 (en kan erboven).
      - alert: SsdWearing
        expr: |
          smartmon_percent_lifetime_remain_value < 20
          or nvme_percentage_used_ratio > 0.8
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: SSD {{ $labels.disk }}{{ $labels.device }} raakt versleten"
          description: "Minder dan 20% levensduur over. Plan een vervanging."

      # Zonder dit merk je niet dat de SMART-timer stil ligt: dan verdwijnen
      # de metrics, en een alarm op een metric die er niet is gaat nooit af.
      - alert: SmartCollectorStale
        expr: time() - node_textfile_mtime_seconds{file=~".*(smartmon|nvme)\\.prom"} > 3600
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: SMART-gegevens zijn ouder dan een uur"
          description: >-
            Linux: systemctl status prometheus-node-exporter-smartmon.timer (of -nvme).
            Mac: launchctl list be.neodata.smartmon, en de log in
            /opt/homebrew/var/log/smartmon.log.

  # Uit `tailscale metrics write` (roles/tailscale) via de textfile-collector.
  - name: tailscale
    rules:
      # ct 108 is de weg naar het LAN van buitenaf. Een route die niet
      # goedgekeurd is, merk je pas onderweg.
      - alert: TailscaleRouteNotApproved
        expr: tailscaled_advertised_routes > tailscaled_approved_routes
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: Tailscale-route niet goedgekeurd"
          description: >-
            De node biedt routes aan die Tailscale niet doorlaat: via Tailscale
            kom je niet op het LAN. Herbouwd? `bin/tofu tailscale apply` keurt
            de route goed (tofu/tailscale/devices.tf).

      - alert: TailscaleUnhealthy
        expr: tailscaled_health_messages{type="warning"} > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: Tailscale meldt een probleem"
          description: "`tailscale status` op de host toont de melding."

      # Ook als het bestand er nooit was: dan zijn er geen tailscaled-metrics,
      # en zwijgen de twee alarmen hierboven. `tailnet` zet prometheus.yml.j2
      # op de hosts uit die inventory-groep.
      - alert: TailscaleMetricsStale
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*tailscaled\\.prom"} > 600
          or (up{job="node", tailnet="true"} == 1
              unless on (instance) node_textfile_mtime_seconds{file=~".*tailscaled\\.prom"})
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: Tailscale-metrics zijn oud of ontbreken"
          description: "systemctl status tailscale-metrics.timer tailscale-metrics.service"

  # De pc van je ouders (kind="windows"). Hij wordt niet gescrapet: Alloy op
  # de pc pusht via remote write (files/alloy/windows-family.alloy). Staat hij
  # uit, dan is er gewoon geen data, en gaat geen enkel alarm hieronder af
  # behalve WindowsNotSeen. Daarom ook geen HostDown voor deze pc.
  - name: windows
    rules:
      # De tellers uit de eventlog beginnen op nul bij elke start van Alloy,
      # dus bij elke opstart. Boven nul = sinds deze opstart gezien. Het alarm
      # blijft staan tot de volgende opstart zonder nieuwe fout; elke 12 uur
      # hoor je het opnieuw zolang de pc aanstaat. Wat er precies gebeurde,
      # staat in Loki: {job="windows-events"}.
      - alert: WindowsBlueScreen
        expr: loki_process_custom_windows_bugcheck_total > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: blauw scherm vóór de laatste opstart"
          description: >-
            Windows logde een BugCheck (1001) bij het opstarten. Stopcode in Grafana:
            {job="windows-events", source="Microsoft-Windows-WER-SystemErrorReporting"}.

      - alert: WindowsHardwareErrors
        expr: loki_process_custom_windows_hardware_errors_total > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: de hardware meldt fouten (WHEA)"
          description: >-
            Cpu, geheugen of chipset. Bij blauwe schermen bijna altijd het RAM:
            MemTest86. Details: {job="windows-events", source="Microsoft-Windows-WHEA-Logger"}.

      - alert: WindowsUnexpectedShutdown
        expr: loki_process_custom_windows_unexpected_shutdown_total > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: onverwacht uitgevallen vóór de laatste opstart"
          description: >-
            Kernel-Power 41: crash, stroom weg of de aan-knop ingedrukt gehouden.
            Samen met WindowsBlueScreen: een crash.

      - alert: WindowsDiskErrors
        expr: loki_process_custom_windows_disk_errors_total > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: fouten van de schijf of het bestandssysteem"
          description: >-
            {{ $value }} sinds de opstart. Details: {job="windows-events", source=~"disk|Ntfs|stornvme|storahci|volmgr|Microsoft-Windows-Ntfs"}.

      - alert: WindowsUpdateFailed
        expr: loki_process_custom_windows_update_failed_total > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: een Windows-update is mislukt"
          description: "Instellingen → Windows Update → Updategeschiedenis, via RustDesk."

      # Uit disk-health.ps1 (geplande taak op de pc): Get-PhysicalDisk en
      # Get-StorageReliabilityCounter.
      - alert: WindowsDiskUnhealthy
        expr: windows_disk_healthy == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: schijf {{ $labels.disk }} is niet gezond"
          description: "Windows noemt de schijf niet meer Healthy. Maak een backup en vervang hem."

      - alert: WindowsSsdWearing
        expr: windows_disk_wear_percent > 80
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: SSD {{ $labels.disk }} raakt versleten"
          description: "{{ $value }}% van de levensduur gebruikt. Plan een vervanging."

      # Zonder dit merk je niet dat de geplande taak stil ligt: dan blijft het
      # oude disk.prom staan en ziet alles er gezond uit.
      - alert: WindowsDiskHealthStale
        expr: time() - windows_disk_health_last_run_timestamp_seconds > 3 * 3600
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: de schijfcontrole draait niet meer"
          description: >-
            Taakplanner → "Homelab disk health". Script:
            C:\ProgramData\homelab\disk-health.ps1.

      - alert: WindowsDiskAlmostFull
        expr: |
          windows_logical_disk_free_bytes{volume=~"[A-Z]:"}
            / windows_logical_disk_size_bytes < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.volume }} bijna vol"
          description: "Nog {{ $value | humanizePercentage }} vrij."

      # Optionele drivers (category="Drivers") installeert Windows nooit zelf;
      # die staan er jaren. Alleen echte updates die al twee weken uit zijn.
      - alert: WindowsUpdatesPending
        expr: |
          count by (instance) (
            time() - windows_update_pending_published_timestamp > 14 * 86400
            and on (instance, id) windows_update_pending_info{category!="Drivers"}
          ) > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $value }} Windows-updates staan al twee weken open"
          description: "Instellingen → Windows Update, via RustDesk. Lukt het niet: zie WindowsUpdateFailed."

      # Een pc bij je ouders staat vaak dagen uit; een week is wel vreemd. Het
      # instance-label staat er met de hand: absent_over_time kent alleen de
      # labels uit de selector.
      - alert: WindowsNotSeen
        expr: absent_over_time(up{instance="pc-ouders", job="integrations/windows"}[7d])
        labels: { severity: warning }
        annotations:
          summary: "pc-ouders is al een week niet gezien"
          description: >-
            Uit, of Tailscale of Alloy draait niet. Bel even; daarna RustDesk
            naar 100.124.225.1.
