---
macos_brew_path: /opt/homebrew/bin
macos_brew_packages:
  - jq
  - htop
  - tmux
  - wget
macos_brew_packages_extra: []
macos_casks: []

# Formulae die als dienst draaien (`brew services`). Als gebruikersdienst, dus
# ze starten bij het inloggen van die gebruiker: op een Mac die automatisch
# inlogt (de Mini) is dat bij het opstarten. De formula zelf hoort ook in een
# van de lijsten hierboven.
macos_brew_services: []

# Explicitly unwanted, as opposed to merely undeclared. Dropping a name from
# the lists above only stops it being reinstalled; what is already on the disk
# stays. A machine is only described once what it should NOT have is written
# down too, so removals survive a rebuild instead of living in someone's head.
macos_brew_packages_absent: []
macos_casks_absent: []
macos_defaults:
  - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: true }
  - { domain: com.apple.desktopservices, key: DSDontWriteNetworkStores, type: bool, value: true }

# SMART van de schijven naar Prometheus, via de textfile-collector van de
# brew-service node_exporter. Zelfde metric-namen als de Debian-collectors op
# pve01, dus de SMART-alarmen gelden hier ook. Vraagt smartmontools en
# node_exporter in de brew-lijst en node_exporter in macos_brew_services.
macos_smart: false
macos_smart_textfile_dir: "{{ macos_brew_path | dirname }}/var/node_exporter/textfile"
