---
- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ macos_brew_packages + macos_brew_packages_extra }}"
    state: present
    path: "{{ macos_brew_path }}"

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ macos_casks }}"
    state: present
    path: "{{ macos_brew_path }}"
  when: macos_casks | length > 0

- name: Apply macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  notify: Restart Finder
