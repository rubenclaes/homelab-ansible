---
- name: Install the sandbox command
  ansible.builtin.template:
    src: sandbox.sh.j2
    dest: /usr/local/sbin/sandbox
    owner: root
    group: root
    mode: "0755"

- name: Install the sandbox prune service and timer
  ansible.builtin.template:
    src: "sandbox-prune.{{ item }}.j2"
    dest: "/etc/systemd/system/sandbox-prune.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: proxmox_host_sandbox_units

# In check mode bestaat een unit die nog moet komen er niet.
- name: Enable the sandbox prune timer
  when: not (ansible_check_mode and proxmox_host_sandbox_units is changed)
  ansible.builtin.systemd_service:
    name: sandbox-prune.timer
    enabled: true
    state: started
    daemon_reload: "{{ proxmox_host_sandbox_units is changed }}"
