---
- name: Install the CPU power unit
  ansible.builtin.template:
    src: cpu-power.service.j2
    dest: /etc/systemd/system/cpu-power.service
    owner: root
    group: root
    mode: "0644"
  register: proxmox_host_cpu_unit
  notify: Apply the CPU power settings

# In check mode bestaat een unit die nog moet komen er niet.
- name: Enable the CPU power unit
  when: not (ansible_check_mode and proxmox_host_cpu_unit is changed)
  ansible.builtin.systemd_service:
    name: cpu-power.service
    enabled: true
    state: started
    daemon_reload: true
