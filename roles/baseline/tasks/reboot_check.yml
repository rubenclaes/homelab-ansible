- name: Find newest installed kernel
  ansible.builtin.shell: set -o pipefail && ls -1 /boot/vmlinuz-* | sort -V | tail -n1 | sed 's|/boot/vmlinuz-||'
  args:
    executable: /bin/bash
  register: newest_kernel
  changed_when: false
  check_mode: false
  when: ansible_facts['virtualization_type'] != 'lxc'

- name: Decide whether a reboot is needed
  ansible.builtin.set_fact:
    reboot_needed: "{{ newest_kernel.stdout | default(ansible_facts['kernel']) != ansible_facts['kernel'] }}"

- name: Report pending reboot
  ansible.builtin.debug:
    msg: "REBOOT NEEDED: running {{ ansible_facts['kernel'] }}, newest installed is {{ newest_kernel.stdout }}"
  when: reboot_needed | bool