---
# De regel staat in files/homelab-reboot-check, en roles/node_exporter zet
# hetzelfde script neer voor het alarm RebootNeeded. Hier draait het via
# `script`: dat zet niets op de host, want report.yml leest alleen.
- name: Check whether the newest kernel is running
  ansible.builtin.script: homelab-reboot-check
  register: baseline_reboot_check
  changed_when: false
  check_mode: false

- name: Decide whether a reboot is needed
  ansible.builtin.set_fact:
    baseline_reboot_needed: "{{ baseline_reboot_check.stdout.split()[0] == '1' }}"
    baseline_newest_kernel: "{{ baseline_reboot_check.stdout.split()[2] }}"

- name: Report pending reboot
  ansible.builtin.debug:
    msg: "REBOOT NEEDED: running {{ ansible_facts['kernel'] }}, newest installed is {{ baseline_newest_kernel }}"
  when: baseline_reboot_needed | bool
