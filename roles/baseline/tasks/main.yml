---
- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Hold pinned packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ baseline_held_packages }}"

- name: Count pending upgrades # noqa: command-instead-of-module
  ansible.builtin.shell: set -o pipefail; apt-get -s dist-upgrade | grep -c '^Inst' || true
  args:
    executable: /bin/bash
  register: baseline_pending_upgrades
  changed_when: false
  check_mode: false

- name: Report pending upgrades
  ansible.builtin.debug:
    msg: "{{ baseline_pending_upgrades.stdout }} package upgrades pending"
  when: baseline_pending_upgrades.stdout | int > 0

- name: Automatic security updates
  when: baseline_unattended_upgrades
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: [unattended-upgrades, apt-listchanges]
        state: present

    - name: Enable daily security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

# The dynamic inventory resolves ansible_host for QEMU guests through the
# guest agent. A VM without it running reports no address and drops out of
# inventory, so the agent is part of the baseline rather than something
# remembered per host.
#
# Both conditions are required. A Proxmox hypervisor also reports
# virtualization_type 'kvm' - it is the thing running KVM - so testing the
# type alone tries to install a guest agent on the host itself, where the
# service does not exist. LXC guests have no agent either and are skipped by
# the type check.
- name: Install the QEMU guest agent on virtual machines
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when:
    - ansible_facts['virtualization_type'] == 'kvm'
    - ansible_facts['virtualization_role'] == 'guest'

- name: Ensure the QEMU guest agent is running
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - ansible_facts['virtualization_type'] == 'kvm'
    - ansible_facts['virtualization_role'] == 'guest'

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: baseline_journal_max_use | length > 0

- name: Cap the systemd journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-size.conf
    content: |
      [Journal]
      SystemMaxUse={{ baseline_journal_max_use }}
    owner: root
    group: root
    mode: "0644"
  when: baseline_journal_max_use | length > 0
  notify: Restart journald

- name: Use classic ssh.service, not socket activation
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  register: baseline_ssh_socket

- name: Ensure ssh.service is enabled and running
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: "{{ 'restarted' if baseline_ssh_socket is changed else 'started' }}"

- name: SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
  when: baseline_ssh_hardening

- name: Reboot check
  ansible.builtin.import_tasks: reboot_check.yml
