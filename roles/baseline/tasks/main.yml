- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Count pending upgrades
  ansible.builtin.shell: apt-get -s dist-upgrade | grep -c '^Inst' || true
  register: pending_upgrades
  changed_when: false
  check_mode: false

- name: Report pending upgrades
  ansible.builtin.debug:
    msg: "{{ pending_upgrades.stdout }} package upgrades pending"
  when: pending_upgrades.stdout | int > 0

- name: Automatic security updates
  when: baseline_unattended_upgrades
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: [unattended-upgrades, apt-listchanges]
        state: present

    - name: Enable daily security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

- name: SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
  when: baseline_ssh_hardening

- ansible.builtin.import_tasks: reboot_check.yml