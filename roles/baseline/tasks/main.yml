- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Find newest installed kernel
  ansible.builtin.shell: set -o pipefail && ls -1 /boot/vmlinuz-* | sort -V | tail -n1 | sed 's|/boot/vmlinuz-||'
  args:
    executable: /bin/bash
  register: newest_kernel
  changed_when: false
  check_mode: false
  when: ansible_virtualization_type != 'lxc'

- name: Report pending reboot
  ansible.builtin.debug:
    msg: "REBOOT NEEDED: running {{ ansible_kernel }}, newest installed is {{ newest_kernel.stdout }}"
  when:
    - ansible_virtualization_type != 'lxc'
    - newest_kernel.stdout != ansible_kernel