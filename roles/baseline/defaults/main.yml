---
baseline_timezone: Europe/Brussels
# dnsutils staat hier voor `dig`, en niet alleen om een storing te kunnen
# uitzoeken: playbooks/dns-smoketest.yml roept dig aan op de host die het
# playbook draait. Dat is jouw werkplek als je het met de hand doet, maar de
# Semaphore-container zodra het op een schema staat, en Debian levert dig niet
# standaard mee.
baseline_packages:
  - acl
  - curl
  - vim
  - htop
  - git
  - tmux
  - jq
  - ncdu
  - ca-certificates
  - dnsutils

baseline_unattended_upgrades: true
baseline_ssh_hardening: true
baseline_held_packages: []

# Cap on journald's on-disk size. Vacuuming is a treadmill - it frees space
# once and the log grows straight back. The cap is what stops it. Set to an
# empty string to leave journald's own default alone.
baseline_journal_max_use: 500M
