---
# The parts of this role that only exist on a Debian host with systemd:
# the apt-packaged Python libraries the docker modules import, the NFS
# mounts the stacks read from, and the drop-in that stops Docker starting
# before those mounts are there.
#
# Split out so the rest of the role - the deploy key, the repo checkout, the
# .env files and `compose up` - can run on the Mac mini too, where Docker
# Desktop provides the engine and there is no apt, no fstab and no systemd.
# macOS mounts its own shares; the Mini is where the NFS export lives, not a
# host that consumes one.
- name: Ensure Python libraries for the Docker modules
  ansible.builtin.apt:
    name: [python3-yaml, python3-docker]
    state: present

- name: Mount the NFS shares the stacks need
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: "{{ item.opts | default('vers=3,hard,noresvport,proto=tcp,timeo=30,retrans=3,_netdev') }}"
    state: mounted
  loop: "{{ docker_stacks_nfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"

# force is off: a disk that already has a filesystem is left alone, so a
# mistyped dev cannot wipe data. Only an empty disk gets one.
- name: Make a filesystem on empty local data disks
  community.general.filesystem:
    dev: "{{ item.dev }}"
    fstype: ext4
  loop: "{{ docker_stacks_local_disks }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the local data disks
  ansible.posix.mount:
    src: "{{ item.dev }}"
    path: "{{ item.path }}"
    fstype: ext4
    opts: defaults,discard
    state: mounted
  loop: "{{ docker_stacks_local_disks }}"
  loop_control:
    label: "{{ item.path }}"

- name: Verify mount units exist # noqa: command-instead-of-module
  ansible.builtin.command: systemctl show -p LoadState --value {{ item.strip('/') | replace('/', '-') }}.mount
  loop: "{{ docker_stacks_wait_for_mounts }}"
  register: docker_stacks_mount_state
  changed_when: false
  # Must run under --check too, otherwise stdout is undefined and failed_when
  # blows up instead of reporting the real mount state.
  check_mode: false
  failed_when: docker_stacks_mount_state.stdout != 'loaded'

- name: Ensure Docker drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  when: docker_stacks_wait_for_mounts | length > 0

- name: Let Docker wait for network mounts at boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-wait-for-mounts.conf
    content: |
      [Unit]
      {% for m in docker_stacks_wait_for_mounts %}
      Wants={{ m.strip('/') | replace('/', '-') }}.mount
      After={{ m.strip('/') | replace('/', '-') }}.mount
      {% endfor %}
    mode: "0644"
  when: docker_stacks_wait_for_mounts | length > 0
  notify: Reload systemd

# Ports that only the reverse proxy may reach (docker_stacks_proxy_only_ports).
# A systemd unit tied to docker.service, so the rules come back after a
# reboot or a Docker restart; Docker itself leaves DOCKER-USER empty.
- name: Proxy-only ports in the DOCKER-USER chain
  when: docker_stacks_proxy_only_ports | length > 0
  block:
    - name: Install the DOCKER-USER firewall script
      ansible.builtin.template:
        src: docker-user-firewall.sh.j2
        dest: /usr/local/sbin/docker-user-firewall
        owner: root
        group: root
        mode: "0755"
      register: docker_stacks_fw_script

    - name: Install the DOCKER-USER firewall unit
      ansible.builtin.template:
        src: docker-user-firewall.service.j2
        dest: /etc/systemd/system/docker-user-firewall.service
        owner: root
        group: root
        mode: "0644"
      register: docker_stacks_fw_unit

    - name: Enable the DOCKER-USER firewall
      ansible.builtin.systemd_service:
        name: docker-user-firewall
        enabled: true
        state: started
        daemon_reload: "{{ docker_stacks_fw_unit is changed }}"
      # Under --check a new unit was not written, so there is nothing to enable.
      when: not (ansible_check_mode and docker_stacks_fw_unit is changed)

    # A oneshot that already ran does not run again on `started`, so a new
    # port list needs an explicit restart to take effect.
    - name: Apply a changed port list now
      ansible.builtin.systemd_service:
        name: docker-user-firewall
        state: restarted
      when:
        - docker_stacks_fw_script is changed or docker_stacks_fw_unit is changed
        - not ansible_check_mode
