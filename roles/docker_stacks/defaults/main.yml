---
docker_stacks_root: /opt/containers/stacks
docker_stacks_owner: ruben
# Resolved from the role, not the playbook, so the role keeps working if a
# playbook is ever added outside playbooks/.
docker_stacks_env_dir: "{{ role_path }}/../../files/env"
docker_stacks_list: []
docker_stacks_repo: git@github.com:rubenclaes/containers.git
docker_stacks_repo_dir: /opt/containers
docker_stacks_repo_version: master
docker_stacks_deploy_key: "/home/{{ docker_stacks_owner }}/.ssh/containers_deploy"

docker_stacks_wait_for_mounts: []
# [{src, path, opts, server}]. server: the inventory host behind src; mounts
# of a host in the group `away` are skipped.
docker_stacks_nfs_mounts: []
# Extra local disks for stack data: [{dev, path}]. dev is a stable path
# (/dev/disk/by-id/...): sdX names shift when a disk is added. The role makes
# an ext4 filesystem only on a disk that has none, and mounts it on path.
docker_stacks_local_disks: []

# Published ports that only the reverse proxy may reach, because their login is
# forward-auth in Caddy. Empty = no firewall rules at all.
docker_stacks_proxy_only_ports: []
docker_stacks_proxy_source: ""
docker_stacks_lan_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
