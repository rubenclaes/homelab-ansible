---
- name: Read existing guests (VMs and containers)
  community.proxmox.proxmox_vm_info:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    node: "{{ ansible_facts['hostname'] }}"
    validate_certs: false
  delegate_to: localhost
  become: false
  register: proxmox_lxc_existing

- name: Work out which containers are missing
  ansible.builtin.set_fact:
    proxmox_lxc_missing: "{{ pve_lxcs | default([]) | rejectattr('vmid', 'in', proxmox_lxc_existing.proxmox_vms | map(attribute='vmid') | list) | list }}"

- name: Report
  ansible.builtin.debug:
    msg: "Missing containers: {{ proxmox_lxc_missing | map(attribute='hostname') | list }}"

- name: Create missing containers
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs: false
    node: "{{ ansible_facts['hostname'] }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.hostname }}"
    ostemplate: "{{ item.template | default(pve_lxc_defaults.template) }}"
    disk_volume: "{{ item.disk }}"
    cores: "{{ item.cores }}"
    memory: "{{ item.memory }}"
    swap: "{{ item.swap }}"
    unprivileged: "{{ pve_lxc_defaults.unprivileged }}"
    features: "{{ item.features | default(omit) }}"
    netif:
      net0: "name=eth0,bridge={{ pve_lxc_defaults.bridge }},ip={{ item.ip }},gw={{ pve_lxc_defaults.gateway }}"
    pubkey: "{{ pve_lxc_defaults.pubkey }}"
    onboot: "{{ pve_lxc_defaults.onboot }}"
    cmode: tty
    state: present
  loop: "{{ proxmox_lxc_missing }}"
  loop_control:
    label: "{{ item.hostname }}"
  delegate_to: localhost
  become: false

- name: Start created containers
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs: false
    node: "{{ ansible_facts['hostname'] }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.hostname }}"
    state: started
  loop: "{{ proxmox_lxc_missing }}"
  loop_control:
    label: "{{ item.hostname }}"
  delegate_to: localhost
  become: false
  register: proxmox_lxc_start
  retries: "{{ proxmox_lxc_start_retries }}"
  delay: "{{ proxmox_lxc_start_delay }}"
  until: proxmox_lxc_start is succeeded
