---
galaxy_info:
  role_name: proxmox_lxc
  author: rubenclaes
  description: >-
    Creates missing LXC containers on a Proxmox node from a declarative list. Never modifies existing guests.
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
  galaxy_tags:
    - cloud
    - virtualization

# These roles are composed by playbooks, not by role dependencies,
# so the run order stays visible in playbooks/site.yml.
dependencies: []
