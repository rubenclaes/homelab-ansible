---
# The container list and its shared settings are inventory data, not role
# settings: they describe this estate. They live in
# inventory/group_vars/proxmox/lxcs.yml as `pve_lxcs` and `pve_lxc_defaults`,
# and are deliberately NOT redeclared here - ansible-lint requires role
# defaults to carry the role's own prefix, and renaming inventory data to
# satisfy that would be the tail wagging the dog. The role reads them with
# `| default(...)` so a host without them skips rather than failing.
#
# Shape of each pve_lxcs entry:
#   vmid:     104                              required, the Proxmox VM id
#   hostname: semaphore                        required
#   cores:    2                                required
#   memory:   2048                             required, MB
#   swap:     512                              required, MB
#   disk:     { storage: local-lvm, size: 8 }  required, size in GB
#   ip:       192.168.0.30/24                  required, literal - see lxcs.yml
#   features: [nesting=1]                      optional
#   template: local:vztmpl/...                 optional

# How long to keep retrying a newly created container's start: it can take a
# moment to become startable after creation.
proxmox_lxc_start_retries: 6
proxmox_lxc_start_delay: 5
