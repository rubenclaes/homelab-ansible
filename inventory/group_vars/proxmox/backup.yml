---
# Backup jobs on pve01, transcribed from `pvesh get /cluster/backup`.
#
# `params` keys are the Proxmox API's own names, passed through unchanged.
# That is deliberate: a translation layer here would mean maintaining a
# mapping that drifts from the API every time Proxmox adds a field.
#
# Value TYPES matter. The reconcile in backup_job.yml compares a merged dict
# against the live one, so a string "1" where the API returns an integer 1
# reports a difference on every run, forever.
#
# Two deliberate departures from a plain transcription:
#   - vmid 109 is dropped from the weekly job. That guest no longer exists,
#     so it is a stale reference and does not belong in an accurate
#     transcription.
#   - The orphaned PBS groups ct/109 and vm/110 are NOT touched. No role here
#     deletes anything; remove them by hand in the PBS UI.
#
# On 23-09 the weekly job stopped being a transcription and became a
# declaration. It had spent months aborting every Sunday on "can't use storage
# 'local' for backups - wrong content type" - `local` carries import,iso,vztmpl
# and no `backup`, so vzdump failed during storage validation before it ever
# read the vmid list, and /var/lib/vz/dump stayed empty. It was then deleted
# from the node, so this file is now the only place it exists. Re-create it
# with `-e proxmox_datacenter_create=true`; the role will not do it unasked.
pve_backup_jobs:
  # De tweede kopie, wekelijks naar de Mac mini. De dagelijkse job hieronder
  # naar `pbs` blijft de primaire: die dedupliceert, is incrementeel en houdt
  # zeven snapshots. Deze schrijft volledige zstd-dumps naar een andere
  # machine, zodat een pve01 die sterft niet elke kopie meeneemt. Twee
  # kopieen, twee machines, twee formaten - nog geen off-site.
  #
  # 100 blijft erbuiten. Dat is PBS zelf, en zijn schijf is de datastore waar
  # de andere kopie in staat; die meenemen is een back-up van je back-ups op
  # de schijf waar je back-ups al niet staan.
  #
  # Retentie hangt niet aan deze job maar aan de storage
  # (`prune-backups keep-last=2` in storage.yml), want dat is waar de ruimte
  # op is. Zie daar waarom twee en niet meer.
  - id: backup-e6cc3e8b-ac39
    params:
      schedule: "sun 01:00"
      storage: macmini-backup
      vmid: "101,102,103,104,106,107,108"
      mode: snapshot
      compress: zstd
      enabled: 1
      # {{guestname}} is a Proxmox template, not a Jinja one. Without the raw
      # block Ansible tries to resolve it and fails with an undefined variable.
      notes-template: "{% raw %}{{guestname}}{% endraw %}"
      notification-mode: notification-system

  - id: backup-a6c792f3-ad6c
    params:
      schedule: "02:30"
      storage: pbs
      all: 1
      exclude: "100"
      mode: snapshot
      enabled: 1
      notes-template: "{% raw %}{{guestname}}{% endraw %}"
      notification-mode: notification-system
