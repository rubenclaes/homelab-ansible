---
# Backup jobs on pve01, transcribed from `pvesh get /cluster/backup`.
#
# `params` keys are the Proxmox API's own names, passed through unchanged.
# That is deliberate: a translation layer here would mean maintaining a
# mapping that drifts from the API every time Proxmox adds a field.
#
# Value TYPES matter. The reconcile in backup_job.yml compares a merged dict
# against the live one, so a string "1" where the API returns an integer 1
# reports a difference on every run, forever.
#
# Two corrections to the live state are made here deliberately:
#   - vmid 109 is dropped from the weekly job. That guest no longer exists,
#     so it is a stale reference and does not belong in an accurate
#     transcription. It is NOT why the job has been failing - see below.
#   - The orphaned PBS groups ct/109 and vm/110 are NOT touched. No role here
#     deletes anything; remove them by hand in the PBS UI.
#
# This weekly job has never produced a backup, for a reason unrelated to its
# vmid list: its storage, `local`, has content `vztmpl,import,iso` - no
# `backup` type. vzdump aborts during storage validation before it ever reads
# which vmids to back up. Confirmed live on pve01: /var/log/pve/tasks/index
# carries "can't use storage 'local' for backups - wrong content type" on
# every run of this job, and /var/lib/vz/dump is empty. Dropping vmid 109
# above is a faithful transcription and changes nothing about whether this
# job works. Fixing it - giving `local` the `backup` content type, or
# retargeting the job at `pbs` - is an estate decision with retention
# consequences and is deliberately left to TODO.md, not done here.
pve_backup_jobs:
  - id: backup-e6cc3e8b-ac39
    params:
      schedule: "sun 01:00"
      storage: local
      vmid: "101,102,103,104,106,107,108"
      mode: snapshot
      compress: zstd
      enabled: 1
      # {{guestname}} is a Proxmox template, not a Jinja one. Without the raw
      # block Ansible tries to resolve it and fails with an undefined variable.
      notes-template: "{% raw %}{{guestname}}{% endraw %}"
      notification-mode: notification-system

  - id: backup-a6c792f3-ad6c
    params:
      schedule: "02:30"
      storage: pbs
      all: 1
      exclude: "100"
      mode: snapshot
      enabled: 1
      notes-template: "{% raw %}{{guestname}}{% endraw %}"
      notification-mode: notification-system
