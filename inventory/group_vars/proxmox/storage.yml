---
# Storage definitions for pve01, transcribed from `pvesh get /storage`.
#
# `params` keys are the Proxmox API's own names, passed through unchanged, and
# their VALUE TYPES matter: the reconcile compares a merged dict against the
# live one, so a string "0" where the API returns an integer 0 reports a
# difference on every run, forever.
#
# `content` is written here in alphabetical order, but that order is
# cosmetic, not load-bearing: pvesh spawns a fresh Perl process per call, and
# Perl randomises hash-key iteration order per process, so `pvesh get`
# returns this field in a different comma order on almost every call, with
# no configuration change involved. The role's comparison (storage_entry.yml)
# sorts both sides before comparing this one field for exactly that reason -
# see the comment there. Every other field is still compared as a literal
# string, so its value here must still match the API's own representation.
#
# `digest` is never declared. It is a checksum of the whole storage.cfg and
# changes whenever any storage does, so declaring it would mean permanent
# drift on every entry.
pve_storages:
  - id: local
    params:
      type: dir
      path: /var/lib/vz
      content: import,iso,vztmpl
      shared: 0

  - id: local-lvm
    params:
      type: lvmthin
      vgname: pve
      thinpool: data
      content: images,rootdir

  - id: vm-hdd
    params:
      type: zfspool
      pool: vm-hdd
      mountpoint: /vm-hdd
      nodes: pve01
      content: images,rootdir

  # The second copy, on the Mac mini over NFS. Declared on 23-09 to give the
  # weekly backup job a storage that actually accepts backups: it ran against
  # `local` for months and aborted every Sunday on "can't use storage 'local'
  # for backups - wrong content type", because that storage carries
  # import,iso,vztmpl and no `backup`. The daily job to `pbs` was unaffected
  # and is still the primary; this one exists so a dead pve01 does not take
  # every copy with it.
  #
  # `export` is a SUBDIRECTORY of the share, not its root. The Mini exports
  # /Volumes/media01 with -alldirs (see roles/nfs_exports/defaults/main.yml),
  # which is precisely what makes that legal - measured on 23-09 by mounting
  # the path directly from pve01 and writing to it. Without -alldirs this
  # would have to be the share root, and vzdump would drop a `dump/` beside
  # Movies and Photos. The directory itself is created by hand, once: an
  # export cannot be mounted at a path that does not exist yet.
  #
  # `options: vers=3` because macOS serves NFSv3. The share also demands
  # reserved ports (`resvport` on the docker host's mount of the same volume);
  # Linux uses those by default, so it needs no option here.
  #
  # `prune-backups keep-last=2`, and that number is load-bearing. media01 sits
  # at 95% with ~293 GiB free and already carries Time Machine (and the old,
  # frozen Duplicati backups), so this job filling it would break both at once. Two full dumps of
  # the declared guests is roughly 50 GB - the guests hold ~45 GB of real data
  # and zstd roughly halves it. Raising this number spends someone else's
  # headroom; check `df` on the Mini first.
  - id: macmini-backup
    params:
      type: nfs
      server: 192.168.0.26
      export: /Volumes/media01/backups/proxmox
      content: backup
      options: vers=3
      prune-backups: keep-last=2
      # Proxmox sets this itself for an NFS storage and never asks; it is
      # declared anyway so the transcription is complete, the same way `local`
      # declares shared: 0. Two fields the API also returns are left out on
      # purpose: `digest` (a checksum of the whole file, see the header) and
      # `path`, which Proxmox derives from the storage id as /mnt/pve/<id>.
      shared: 1

# The `pbs` storage is deliberately absent, and this is a real gap rather than
# a tidy exclusion.
#
# Its API representation carries an `encryption-key` field. Telling a key
# apart from a key's fingerprint requires reading /etc/pve/priv/storage/,
# which the spec puts out of bounds, so the value is not safe to commit on the
# assumption that it is harmless. Recreating the entry on a rebuilt node also
# needs the pve@pbs password, which lives only in the PBS UI.
#
# Consequence: after a rebuild of pve01 this storage is restored by hand, and
# the backups in it are unreadable without the encryption key. That key must
# be exported once with `proxmox-backup-client key show` and kept outside this
# repo and outside the building. See the design spec, Risk 1.
