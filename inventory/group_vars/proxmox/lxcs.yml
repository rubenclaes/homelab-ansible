---
# ntfy (een OCI-container), /dev/net/tun en de restore-drill.
#
# De Debian-containers staan hier niet meer: OpenTofu maakt en beschrijft ze,
# in tofu/proxmox/containers.tf.

# Het netwerk van de containers die Ansible nog zelf maakt (ntfy, via
# roles/proxmox_oci). Dezelfde drie waarden staan in tofu/proxmox/; één plek
# zodra ntfy ook naar OpenTofu verhuist.
pve_guest_network:
  bridge: vmbr0
  gateway: 192.168.0.1
  # Zonder erft een container `search neodata.be` van pve01, en schrijft
  # Proxmox `<ip> <naam>.neodata.be` in zijn /etc/hosts. Dan praat de
  # container voor zijn eigen publieke naam met zichzelf in plaats van met
  # Caddy.
  searchdomain: home.arpa

# Containers uit een OCI-image, gemaakt door roles/proxmox_oci
# (playbooks/proxmox-oci.yml). Apart van de Debian-containers in OpenTofu, want
# die gaan uit van SSH en een baseline, en hier is er niets van dat: één programma uit
# een image, en alles wat het nodig heeft staat in env. De rol zet er tag `oci`
# op, en daardoor houdt de inventory ze buiten `linux`.
#
# `version` is de enige manier om te updaten. Een andere waarde dan wat draait
# geeft een waarschuwing; pas met -e proxmox_oci_recreate=true wordt de
# container opnieuw gebouwd. Dat gooit ook de volumes weg, dus alles wat moet
# overleven hoort in env, niet op de schijf.
pve_oci_lxcs:
  - vmid: 109
    hostname: ntfy
    image: docker.io/binwiederhier/ntfy
    version: v2.28.0
    # Het image heeft ENTRYPOINT ["ntfy"] zonder CMD; kaal start dat de help
    # en stopt meteen.
    entrypoint: ntfy serve
    cores: 1
    memory: 256
    disk: { storage: vm-hdd, size: 2 }
    ip: 192.168.0.32/24
    # Vast, net als de MAC's in vms.yml. Een herbouw zonder vaste MAC geeft een
    # nieuwe, en wie het oude adres nog in zijn ARP-cache heeft - Caddy, je
    # laptop - bereikt ntfy dan een tijd niet. Gezien op 23-09: de eerste
    # herbouw was een minuut onbereikbaar via ntfy.neodata.be.
    hwaddr: BC:24:11:2A:34:48
    port: 80
    # Het image heeft deze map niet, en zonder stopt ntfy met "cache database
    # directory does not exist". Wordt meegenomen in de PBS-back-up.
    volumes:
      - { mp: /var/lib/ntfy, storage: vm-hdd, size: 1 }
    env:
      NTFY_BASE_URL: https://ntfy.neodata.be
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Een mislukte vzdump stuurt de hele log van elke guest mee, al snel
      # 15 KB of meer. Boven 4 KB maakt ntfy er een bijlage van, en zonder
      # deze map weigert hij het bericht (400): de ene melding waar het om
      # draait kwam dan nooit aan. Proxmox kapt zelf af op 1 MiB.
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 2M
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 200M
      # Voor de iPhone: Apple laat een app alleen via hun eigen push wekken.
      # ntfy.sh stuurt enkel een seintje door, de inhoud haalt de app hier.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_AUTH_USERS: "ruben:{{ vault_ntfy_ruben_hash }}:admin,proxmox:{{ vault_ntfy_proxmox_hash }}:user"
      NTFY_AUTH_ACCESS: "proxmox:homelab:wo"
      # Vier tokens voor hetzelfde schrijf-account: Proxmox, PBS,
      # unifi-watch.yml en de Vaultwarden-back-up. Zo trek je het ene in
      # zonder de andere.
      NTFY_AUTH_TOKENS: >-
        {{ ['proxmox:' ~ vault_ntfy_proxmox_token ~ ':proxmox',
            'proxmox:' ~ vault_ntfy_pbs_token ~ ':pbs',
            'proxmox:' ~ vault_ntfy_unifi_token ~ ':unifi',
            'proxmox:' ~ vault_ntfy_vaultwarden_token ~ ':vaultwarden'] | join(',') }}

# Containers die /dev/net/tun krijgen, voor Tailscale: adguard (107, DNS van
# de tailnet) en tailscale (108, subnet-router). Zie roles/proxmox_tun.
proxmox_tun_guests: [107, 108]

# The vmid playbooks/restore-drill.yml restores onto and destroys. It is declared
# here, not guessed at run time, so a glance at this file shows the one id a
# playbook is allowed to destroy. 199 sits well above the ids in
# tofu/proxmox/ (100-108) and is asserted free before every drill.
drill_vmid: 199

# Wat playbooks/restore-drill.yml in de teruggezette container opzoekt. Eén
# pad per guest dat alléén bestaat als zijn data echt terug is: /etc/hostname
# bewijst dat er een bestandssysteem is, niet dat je iets terugkreeg. Een
# guest die hier niet in staat valt terug op /etc/hostname, en dan bewijst de
# drill minder dan je denkt.
drill_probes:
  adguard: /opt/AdGuardHome/AdGuardHome.yaml
  caddy: /etc/caddy/Caddyfile
  semaphore: /etc/semaphore/config.json
  tailscale: /var/lib/tailscale/tailscaled.state

# De opslag waar de drill zijn teruggezette container neerzet. Los van waar
# het origineel staat: een drill hoort niet te concurreren met de echte guest
# om ruimte op dezelfde pool.
drill_storage: vm-hdd

# De PVE-storage die naar PBS wijst. De drill leest hier zijn back-uplijst
# uit; de naam moet overeenkomen met wat Datacenter -> Storage toont.
drill_pbs_storage: pbs

# Welke guest de drill terugzet als je er geen meegeeft. adguard is de
# kleinste (2G) en de snelste, en zijn AdGuardHome.yaml is echte staat die
# geen enkele rol terugzet.
drill_restore_guest: adguard
