---
# LXC definitions: used to (re)create containers that are missing.
# Existing containers are never modified by the role.
#
# The addresses here are deliberately literal, not derived from inventory.
# This list describes containers that do not exist yet: a missing container
# has no entry in the Proxmox dynamic inventory, so there is no ansible_host
# to read. This file IS the source of truth for a container's address until
# Proxmox knows about it, after which inventory takes over.
pve_lxc_defaults:
  template: local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst
  bridge: vmbr0
  gateway: 192.168.0.1
  unprivileged: true
  onboot: true
  pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHLNyIywwfWQG5AzOf6ZGXYDIeNz3gcthJnpkQPdoFRq ansible@neodata"

pve_lxcs:
  - vmid: 104
    hostname: semaphore
    cores: 2
    memory: 2048
    swap: 512
    # 16G rather than the 8G the other containers get: Semaphore is the
    # Ansible controller, so playbooks/docs.yml builds the Nextra site here.
    # node_modules, the .next output and npm's cache together run to several
    # gigabytes, on top of the Ansible virtualenv and Semaphore's per-template
    # repository clones.
    disk: { storage: local-lvm, size: 16 }
    ip: 192.168.0.30/24
    features: [nesting=1]

  - vmid: 106
    hostname: caddy
    cores: 1
    memory: 512
    swap: 512
    disk: { storage: vm-hdd, size: 6 }
    ip: 192.168.0.25/24 # live container still uses DHCP (see TODO)
    features: [nesting=1, keyctl=1]

  - vmid: 107
    hostname: adguard
    cores: 1
    memory: 512
    swap: 512
    disk: { storage: vm-hdd, size: 2 }
    ip: 192.168.0.29/24 # live container still uses DHCP (see TODO)
    features: [nesting=1, keyctl=1]
    # Zit sinds 23-09 op de tailnet, zodat hij als globale nameserver kan
    # dienen met een 100.x-adres. Tailscale heeft daarvoor /dev/net/tun nodig;
    # zonder deze twee regels start tailscaled niet en faalt hij stil in een
    # herstartlus. Na herbouw opnieuw zetten, als root op pve01 (de API-token
    # kan geen rauwe lxc-sleutels zetten), en daarna de container herstarten,
    # want een mount-entry geldt pas na een start:
    # `pct set` weigert rauwe lxc-sleutels op deze versie ("400 unable to
    # parse option"), dus rechtstreeks onderaan /etc/pve/lxc/107.conf:
    #   lxc.cgroup2.devices.allow: c 10:200 rwm
    #   lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
    # en daarna `pct reboot 107`.

  - vmid: 108
    hostname: tailscale
    cores: 4
    memory: 1024
    swap: 1024
    disk: { storage: vm-hdd, size: 8 }
    ip: 192.168.0.50/24
    features: [nesting=1]
    # After recreation, as root on pve01 (the API token can't set raw lxc keys):
    #   pct set 108 -lxc.cgroup2.devices.allow "c 10:200 rwm"
    #   pct set 108 -lxc.mount.entry "/dev/net/tun dev/net/tun none bind,create=file"

# The vmid playbooks/recovery-drill.yml builds and destroys. It is declared
# here, not guessed at run time, so a glance at this file shows the one id a
# playbook is allowed to destroy. 199 sits well above the range pve_lxcs uses
# and is asserted free before every drill.
drill_vmid: 199

# Wat playbooks/restore-drill.yml in de teruggezette container opzoekt. Eén
# pad per guest dat alléén bestaat als zijn data echt terug is: /etc/hostname
# bewijst dat er een bestandssysteem is, niet dat je iets terugkreeg. Een
# guest die hier niet in staat valt terug op /etc/hostname, en dan bewijst de
# drill minder dan je denkt.
drill_probes:
  adguard: /opt/AdGuardHome/AdGuardHome.yaml
  caddy: /etc/caddy/Caddyfile
  semaphore: /etc/semaphore/config.json
  tailscale: /var/lib/tailscale/tailscaled.state

# De opslag waar de drill zijn teruggezette container neerzet. Los van waar
# het origineel staat: een drill hoort niet te concurreren met de echte guest
# om ruimte op dezelfde pool.
drill_storage: vm-hdd

# De PVE-storage die naar PBS wijst. De drill leest hier zijn back-uplijst
# uit; de naam moet overeenkomen met wat Datacenter -> Storage toont.
drill_pbs_storage: pbs

# Welke guest de drill terugzet als je er geen meegeeft. adguard is de
# kleinste (2G) en de snelste, en zijn AdGuardHome.yaml is echte staat die
# geen enkele rol terugzet.
drill_restore_guest: adguard
