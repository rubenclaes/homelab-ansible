---
# ntfy (een OCI-container), /dev/net/tun en de restore-drill.
#
# De Debian-containers staan hier niet meer: OpenTofu maakt en beschrijft ze,
# in tofu/proxmox/containers.tf.

# Bridge, gateway en zoekdomein: guest_network.yml, gedeeld met OpenTofu.

# Containers uit een OCI-image, gemaakt door roles/proxmox_oci
# (playbooks/proxmox-oci.yml). Apart van de Debian-containers in OpenTofu, want
# die gaan uit van SSH en een baseline, en hier is er niets van dat: één programma uit
# een image, en alles wat het nodig heeft staat in env. De rol zet er tag `oci`
# op, en daardoor houdt de inventory ze buiten `linux`.
#
# Bewust niet in OpenTofu (25-09): de ntfy-tokens hieronder gebruiken ook
# Proxmox, PBS, pbs_client, r2-guard en unifi-watch, en die lezen de vault.
# In OpenTofu stond elk token dan twee keer, en het ophalen van een image
# vraagt Sys.AccessNetwork (de rol doet het als root). Opnieuw bekijken bij
# een tweede OCI-container.
#
# `version` is de enige manier om te updaten. Een andere waarde dan wat draait
# geeft een waarschuwing; pas met -e proxmox_oci_recreate=true wordt de
# container opnieuw gebouwd. Dat gooit ook de volumes weg, dus alles wat moet
# overleven hoort in env, niet op de schijf.
#
# `onboot: false` voor een container die alleen af en toe draait (lancache):
# pve01 start hem niet na een herstart, en proxmox-oci.yml en
# proxmox-autostart.yml laten hem uit. Weglaten is `true`.
#
# `remove_paths`: bestanden die het image in een latere laag weghaalt. De
# OCI-import van Proxmox past die verwijderingen niet toe; de rol haalt ze na
# het aanmaken alsnog weg.
pve_oci_lxcs:
  - vmid: 109
    hostname: ntfy
    image: docker.io/binwiederhier/ntfy
    version: v2.28.0
    # Het image heeft ENTRYPOINT ["ntfy"] zonder CMD; kaal start dat de help
    # en stopt meteen.
    entrypoint: ntfy serve
    cores: 1
    memory: 256
    disk: { storage: vm-hdd, size: 2 }
    ip: 192.168.0.32/24
    # Vast, net als de MAC's in tofu/proxmox/. Een herbouw zonder vaste MAC geeft een
    # nieuwe, en wie het oude adres nog in zijn ARP-cache heeft - Caddy, je
    # laptop - bereikt ntfy dan een tijd niet. Gezien op 23-09: de eerste
    # herbouw was een minuut onbereikbaar via ntfy.neodata.be.
    hwaddr: BC:24:11:2A:34:48
    port: 80
    # Het image heeft deze map niet, en zonder stopt ntfy met "cache database
    # directory does not exist". Wordt meegenomen in de PBS-back-up.
    volumes:
      - { mp: /var/lib/ntfy, storage: vm-hdd, size: 1 }
    env:
      NTFY_BASE_URL: https://ntfy.neodata.be
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      # Hoe lang een bericht te halen blijft. Buitenshuis zonder VPN krijgt
      # de iPhone alleen een leeg seintje; de tekst haalt de app pas op als
      # hij ntfy weer bereikt. De standaard is 12 uur, te kort voor een
      # weekend weg.
      NTFY_CACHE_DURATION: 72h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Een mislukte vzdump stuurt de hele log van elke guest mee, al snel
      # 15 KB of meer. Boven 4 KB maakt ntfy er een bijlage van, en zonder
      # deze map weigert hij het bericht (400): de ene melding waar het om
      # draait kwam dan nooit aan. Proxmox kapt zelf af op 1 MiB.
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 2M
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 200M
      # Voor de iPhone: Apple laat een app alleen via hun eigen push wekken.
      # ntfy.sh stuurt enkel een seintje door, de inhoud haalt de app hier.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_AUTH_USERS: "ruben:{{ vault_ntfy_ruben_hash }}:admin,proxmox:{{ vault_ntfy_proxmox_hash }}:user"
      NTFY_AUTH_ACCESS: "proxmox:homelab:wo"
      # Zeven tokens voor hetzelfde schrijf-account: Proxmox, PBS,
      # unifi-watch.yml, de Vaultwarden-back-up, NeoGate, Alertmanager en
      # Semaphore. Zo trek je het ene in zonder de andere.
      NTFY_AUTH_TOKENS: >-
        {{ ['proxmox:' ~ vault_ntfy_proxmox_token ~ ':proxmox',
            'proxmox:' ~ vault_ntfy_pbs_token ~ ':pbs',
            'proxmox:' ~ vault_ntfy_unifi_token ~ ':unifi',
            'proxmox:' ~ vault_ntfy_vaultwarden_token ~ ':vaultwarden',
            'proxmox:' ~ vault_ntfy_neogate_token ~ ':neogate',
            'proxmox:' ~ vault_ntfy_alertmanager_token ~ ':alertmanager',
            'proxmox:' ~ vault_ntfy_semaphore_token ~ ':semaphore'] | join(',') }}

  # LANCache voor LAN parties: houdt game-downloads bij, zodat de tweede
  # download uit huis komt. Staat uit; playbooks/lancache.yml zet hem aan en
  # uit, samen met de rewrite in AdGuard. Niet in de back-ups
  # (group_vars/proxmox/backup.yml): de cache is weggooibaar.
  - vmid: 110
    hostname: lancache
    # Er is alleen `latest`. Het template wordt één keer opgehaald en blijft
    # dan staan, dus dit is in de praktijk vast. Bijwerken: het template
    # weghalen en opnieuw bouwen met -e proxmox_oci_recreate=true; de cache
    # gaat dan mee, en dat mag. Daarna proxmox-datacenter.yml: het weggooien
    # haalt 110 ook uit de uitsluiting van de back-upjob.
    image: docker.io/lancachenet/monolithic
    version: latest
    # ENTRYPOINT plus CMD van het image.
    entrypoint: /bin/bash -e /init/entrypoint.sh /init/supervisord.sh
    cores: 2
    memory: 2048
    disk: { storage: vm-hdd, size: 4 }
    # Het adres zelf staat in group_vars/all/lancache.yml.
    ip: "{{ lancache_ip }}/24"
    hwaddr: BC:24:11:97:37:2A
    port: 80
    onboot: false
    # Wat de Dockerfile van het image met `rm` weghaalt, maar de OCI-import
    # van Proxmox laat staan. Vooral site.conf: die antwoordt met
    # default_server op poort 80 en geeft op alles een 404.
    remove_paths:
      - /etc/nginx/sites-enabled/site.conf
      - /etc/nginx/sites-enabled/status.conf
      - /etc/nginx/sites-enabled/default
      - /etc/nginx/stream-enabled/stream_proxy_example
      - /etc/nginx/conf.d/gzip.conf
    volumes:
      - { mp: /data/cache, storage: vm-hdd, size: 600 }
      - { mp: /data/logs, storage: vm-hdd, size: 2 }
    # De rol vervangt de hele env van het image. Dit is die van het image
    # (lancachenet/monolithic:latest, 09-2026), met onze waarden erover.
    env:
      LC_ALL: en_GB.UTF-8
      LANG: en_GB.UTF-8
      LANGUAGE: en_GB.UTF-8
      TZ: Europe/Brussels
      SUPERVISORD_EXIT_ON_FATAL: "1"
      SUPERVISORD_LOGLEVEL: WARN
      GENERICCACHE_VERSION: "2"
      CACHE_MODE: monolithic
      WEBUSER: www-data
      CACHE_INDEX_SIZE: 500m
      # Onder de 600 GB van het volume, zodat nginx opruimt voor het vol is.
      CACHE_DISK_SIZE: 550g
      MIN_FREE_DISK: 10g
      CACHE_MAX_AGE: 3560d
      CACHE_SLICE_SIZE: 1m
      # Nooit AdGuard: die stuurt de omgeleide namen naar deze container terug.
      UPSTREAM_DNS: 9.9.9.9 149.112.112.112
      BEAT_TIME: 1h
      LOGFILE_RETENTION: "3560"
      CACHE_DOMAINS_REPO: https://github.com/uklans/cache-domains.git
      CACHE_DOMAINS_BRANCH: master
      NGINX_WORKER_PROCESSES: auto
      NGINX_LOG_FORMAT: cachelog

# Containers die /dev/net/tun krijgen, voor Tailscale: adguard (107, DNS van
# de tailnet) en tailscale (108, subnet-router). Zie roles/proxmox_tun.
proxmox_tun_guests: [107, 108]

# The vmid playbooks/restore-drill.yml restores onto and destroys. It is declared
# here, not guessed at run time, so a glance at this file shows the one id a
# playbook is allowed to destroy. 199 sits well above the ids in
# tofu/proxmox/ (100-108) and is asserted free before every drill.
drill_vmid: 199

# Wat playbooks/restore-drill.yml in de teruggezette container opzoekt. Eén
# pad per guest dat alléén bestaat als zijn data echt terug is: /etc/hostname
# bewijst dat er een bestandssysteem is, niet dat je iets terugkreeg. Een
# guest die hier niet in staat valt terug op /etc/hostname, en dan bewijst de
# drill minder dan je denkt.
drill_probes:
  adguard: /opt/AdGuardHome/AdGuardHome.yaml
  caddy: /etc/caddy/Caddyfile
  semaphore: /etc/semaphore/config.json
  tailscale: /var/lib/tailscale/tailscaled.state

# De opslag waar de drill zijn teruggezette container neerzet. Los van waar
# het origineel staat: een drill hoort niet te concurreren met de echte guest
# om ruimte op dezelfde pool.
drill_storage: vm-hdd

# De PVE-storage die naar PBS wijst. De drill leest hier zijn back-uplijst
# uit; de naam moet overeenkomen met wat Datacenter -> Storage toont.
drill_pbs_storage: pbs

# Welke guest de drill terugzet als je er geen meegeeft. adguard is de
# kleinste (2G) en de snelste, en zijn AdGuardHome.yaml is echte staat die
# geen enkele rol terugzet.
drill_restore_guest: adguard
