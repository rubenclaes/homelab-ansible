# ntfy, rechtstreeks op het IP: net als de Proxmox-meldingen mag dit niet
# afhangen van Caddy of AdGuard.
unifi_ntfy_url: http://192.168.0.32/homelab
unifi_ntfy_token: "{{ vault_ntfy_unifi_token }}"

# De DNS-servers die elk netwerk in UniFi via DHCP uitdeelt, in volgorde.
# Ansible schrijft niet naar UniFi: playbooks/unifi-routes.yml vergelijkt
# alleen, en faalt als het afwijkt. Wijzigt het hier, dan eerst in UniFi.
#
# Waarom het ertoe doet: deelt Home iets anders uit dan AdGuard, dan gaat
# elk toestel er stil omheen.
#
# Alleen AdGuard, sinds 25-09. Tot dan stond `1.1.1.1` als tweede, zodat het
# huis online bleef als ct 107 stilstond. Maar een Mac vraagt beide, en kreeg
# van 1.1.1.1 "bestaat niet" voor elke *.neodata.be en *.home.arpa: sites
# openden dan willekeurig niet, en de reclame kwam erdoor. Gekozen: namen die
# altijd werken, met als prijs dat ct 107 nu alleen staat. De echte oplossing,
# een tweede AdGuard als DNS 2, staat in TODO.md.
#
# Niet de VPN: UniFi bewaart daar nog `192.168.0.26` (de oude AdGuard), maar
# toont dat veld nergens in de UI, en de API-sleutel schrijft het niet. Wat
# een VPN-client echt gebruikt staat in zijn profiel: op de iPhone met de
# hand op `.29` gezet. Zie TODO.md.
unifi_expected_dns:
  Home: [192.168.0.29]

# De naam van een toestel in DNS: <naam>.home.arpa, per MAC. Staat in UniFi
# als Local DNS Record, met een Fixed IP (zonder vast adres kan UniFi er geen
# record van maken). Ansible schrijft het niet, net als hierboven:
# playbooks/unifi-routes.yml vergelijkt en faalt als het afwijkt.
#
# Waarom in UniFi en niet in AdGuard: AdGuard vraagt de naam bij een IP al
# aan de UCG (local_ptr_upstreams). Zo staat een naam op één plek. De alias
# in UniFi telt daarvoor niet; alleen dit record, of anders de naam die het
# toestel zelf opgeeft (`iPhone`, `Mac`).
#
# Servers staan hier ook in, hoewel roles/adguard hun *.home.arpa al zet:
# die rewrite werkt alleen van naam naar IP, niet terug. Voor de Query Log
# moet de UCG ze ook kennen. `mac-mini` en niet `macmini` zoals de inventory,
# want zo stond hij al in UniFi; beide wijzen naar .26.
unifi_dns_names:
  "46:bf:32:25:e6:9c": iphone-karen
