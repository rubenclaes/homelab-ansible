---
# Hosts die Proxmox niet kent, plus de groepen waar de dynamische inventory
# guests aan hangt.
#
# Proxmox-guests horen hier niet: die komen uit homelab.proxmox.yml. Zet je
# er toch een bij, dan overschrijft die de ontdekte host met een vast adres.
#
# De bestandsnaam begint met 00 zodat dit vóór homelab.proxmox.yml laadt.
all:
  children:
    linux:
      vars:
        ansible_user: ansible
        ansible_become: true
      children:
        proxmox:
          hosts:
            # De hypervisor zelf. Staat in exclude_nodes van de dynamische
            # inventory, want een node is geen guest van zichzelf.
            pve01: { ansible_host: 192.168.0.14 }

    # Guests met Docker. Proxmox weet dat niet, dus staat het hier. De hosts
    # zelf komen uit de dynamische inventory; hier worden ze enkel gegroepeerd.
    docker_hosts:
      hosts:
        docker: {}
        docker-grafana-stack: {}

    # Guests op de tailnet.
    #
    # adguard is de DNS-server van het huis en moet daarom een tailnet-adres
    # hebben. Een LAN-adres werkt alleen voor toestellen die de subnet-route
    # accepteren, en dat doet hier geen enkel toestel (RouteAll: False op de
    # Mini en op ct 108). Onderweg zou je dan helemaal geen DNS hebben.
    #
    # Alleen ct 108 adverteert routes (zie zijn host_vars); adguard niet.
    tailnet:
      hosts:
        tailscale: {}
        adguard: {}

    # Hosts die een Alloy-logagent krijgen.
    #
    # De docker-hosts staan er bewust niet bij: daar haalt de Alloy uit de
    # monitoring-stack de containerlogs al op via de Docker-socket. Een tweede
    # agent zou dezelfde logs dubbel naar Loki sturen.
    alloy_hosts:
      hosts:
        caddy: {}

    # Hosts die geen Debian draaien en de baseline-rol niet krijgen. De groep
    # staat hier zodat site.yml hem altijd kent, ook als alle leden uit de
    # dynamische inventory komen.
    appliances:
      hosts: {}

    macs:
      hosts:
        macmini: { ansible_host: 192.168.0.26, ansible_user: rubenclaes }
        mbp: { ansible_connection: local }

    # Werkplekken buiten Proxmox. Ze staan vaak uit, dus een nachtelijke run
    # zou hier elke nacht falen.
    workstations:
      hosts:
        work-wsl:
          {
            ansible_host: work-wsl.brill-atlas.ts.net,
            ansible_user: rubenclaes,
          }
