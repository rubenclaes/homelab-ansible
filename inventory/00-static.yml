---
# The hosts Proxmox does not know about, and the group definitions the
# dynamic inventory attaches guests to.
#
# Proxmox guests are NOT listed here: they come from homelab.proxmox.yml.
# Adding one here would shadow the discovered host and reintroduce the
# hand-maintained address this migration removed.
#
# Sorted before homelab.proxmox.yml so these definitions load first.
all:
  children:
    linux:
      vars:
        ansible_user: ansible
        ansible_become: true
      children:
        proxmox:
          hosts:
            # The hypervisor itself. Excluded from the dynamic source
            # (exclude_nodes), since a node is not one of its own guests.
            pve01: { ansible_host: 192.168.0.14 }

    # Which guests run the Docker engine is not something Proxmox knows, so
    # it is declared here. The hosts themselves still come from the dynamic
    # inventory; this only adds them to a group.
    docker_hosts:
      hosts:
        docker: {}
        docker-grafana-stack: {}

    # Welke guests op de tailnet horen. Dat wist Proxmox ook niet, dus staat
    # het hier, net als docker_hosts.
    #
    # adguard staat erbij sinds 23-09, en dat heeft één reden: hij is de DNS
    # van het huis, en een nameserver die je vanaf de tailnet wil gebruiken
    # moet een tailnet-adres hebben. Een LAN-adres als globale nameserver
    # werkt alleen voor toestellen die de subnet-route accepteren, en dat doet
    # er hier geen enkele (`RouteAll: False` op de Mini en op ct 108). Dan heb
    # je onderweg geen DNS in plaats van half - erger dan de instelling
    # uitzetten.
    #
    # Alleen ct 108 adverteert routes. Dat staat in zijn eigen host_vars, dus
    # adguard krijgt de lege default en biedt niets aan.
    tailnet:
      hosts:
        tailscale: {}
        adguard: {}

    # Welke hosts een logagent krijgen. Ook dat weet Proxmox niet, dus staat
    # het hier, net als docker_hosts en tailnet.
    #
    # De docker-hosts staan er bewust NIET bij: daar draait al een Alloy in de
    # monitoring-stack zelf, die de containerlogs via de Docker-socket ophaalt.
    # Een tweede agent op dezelfde host zou dezelfde regels een tweede keer
    # naar Loki duwen.
    alloy_hosts:
      hosts:
        caddy: {}

    # Hosts that are not Debian and cannot take the baseline role.
    # Declared here so site.yml can reason about the group even when the
    # dynamic inventory contributes every member.
    appliances:
      hosts: {}

    macs:
      hosts:
        macmini: { ansible_host: 192.168.0.26, ansible_user: rubenclaes }
        mbp: { ansible_connection: local }
