---
# Hosts die Proxmox niet kent, plus de groepen waar de dynamische inventory
# guests aan hangt.
#
# Proxmox-guests horen hier niet: die komen uit homelab.proxmox.yml. Zet je
# er toch een bij, dan overschrijft die de ontdekte host met een vast adres.
#
# De bestandsnaam begint met 00 zodat dit vóór homelab.proxmox.yml laadt.
all:
  children:
    linux:
      vars:
        ansible_user: ansible
        ansible_become: true
      children:
        proxmox:
          hosts:
            # De hypervisor zelf. Staat in exclude_nodes van de dynamische
            # inventory, want een node is geen guest van zichzelf.
            pve01: { ansible_host: 192.168.0.14 }

    # Groepen die uit Proxmox-tags komen. homelab.proxmox.yml maakt van elke
    # tag een groep met dezelfde naam; een guest met tag `docker_hosts` zit dus
    # in docker_hosts. Een nieuwe guest krijgt zijn rollen door hem te taggen,
    # niet door hem hier te zetten. Welke guest welke tag heeft en waarom staat
    # bij de guest zelf, in group_vars/proxmox/lxcs.yml en vms.yml.
    #
    # Ze staan hier leeg zodat een playbook de groep altijd kent, ook als geen
    # enkele guest de tag heeft.
    docker_hosts:
      hosts: {}
    tailnet:
      hosts: {}
    alloy_hosts:
      hosts: {}

    # Hosts die geen Debian draaien en de baseline-rol niet krijgen. De groep
    # staat hier zodat site.yml hem altijd kent, ook als alle leden uit de
    # dynamische inventory komen.
    appliances:
      hosts: {}

    macs:
      hosts:
        macmini: { ansible_host: 192.168.0.26, ansible_user: rubenclaes }
        mbp: { ansible_connection: local }

    # Werkplekken buiten Proxmox. Ze staan vaak uit, dus een nachtelijke run
    # zou hier elke nacht falen.
    workstations:
      hosts:
        work-wsl:
          {
            ansible_host: work-wsl.brill-atlas.ts.net,
            ansible_user: rubenclaes,
          }
