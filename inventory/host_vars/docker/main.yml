  - { name: media, path: media, project: media-stack }
  - { name: outline, path: outline, desc: "Outline — wiki voor het gezin, inloggen via Pocket ID" }

# Alle drie de shares van de Mac mini, niet alleen faststore. Ze stonden op
# 22-09 alle drie in /etc/fstab van deze host maar maar één stond hier, dus
# een herbouwde docker-host kwam met twee mounts minder terug - en dan blijft
# hij hangen op wait_for_mounts hieronder in plaats van op te starten.
#
# De opties zijn letterlijk overgenomen van wat er nu in fstab staat, met
# opzet: `state: mounted` hermount bij een afwijking, en dat wil je niet
# terwijl de media-stack draait. media01 wijkt af van de andere twee
# (`resvport` in plaats van `noresvport`, plus x-systemd.automount); dat is
# geen vergissing van nu, dat stond er al. Gelijktrekken is een aparte klus
# op een rustig moment, niet iets om er stilletjes bij te doen.
docker_stacks_nfs_mounts:
  # LET OP: hier staat een ECHTE spatie, geen \040. De mount-module escapet
  # zelf, en doet dat in deze volgorde:
  #
  #     v.replace('\\', '\\134').replace(' ', '\\040')
  #
  # De backslash gaat dus eerst. Een waarde die hier al geescapet staat als
  # `SSD\040Nas` wordt daardoor `SSD\134040Nas`, en dat matcht nooit met wat
  # er in /etc/fstab staat. Gevolg tot 23-09: deze taak meldde `changed` bij
  # elke droogloop, en de dagelijkse Drift check werd er rood van.
  #
  # En het bleef niet bij ruis. Bij een ECHTE run schrijft de module die
  # dubbel geescapete waarde weg, en `\134040` decodeert naar een letterlijke
  # backslash gevolgd door `040` - een pad dat niet bestaat. Dat is nooit
  # gebeurd omdat deze mountlijst pas op 22-09 compleet werd en er daarna geen
  # converge meer over `docker` is gegaan; anders was /mnt/ssdnas na de
  # eerstvolgende herstart weg geweest.
  - src: '192.168.0.26:/Volumes/SSD Nas'
    path: /mnt/ssdnas
    opts: 'nfsvers=3,proto=tcp,noresvport,hard,timeo=30,retrans=3,nofail,_netdev'
  - src: '192.168.0.26:/Volumes/media01'
    path: /mnt/media01
    opts: 'rw,hard,intr,nofail,_netdev,x-systemd.automount,nfsvers=3,tcp,resvport'
  - src: '192.168.0.26:/Volumes/FastStore'
    path: /mnt/faststore
    opts: 'vers=3,hard,noresvport,proto=tcp,timeo=30,retrans=3,_netdev'

docker_stacks_wait_for_mounts:
  - /mnt/ssdnas
  - /mnt/media01
  - /mnt/faststore

# Published ports that deliberately have no Caddy route, so the drift table in
# report.yml stays signal rather than noise. Anything not listed here and not
# proxied shows up as "geen route".
# De andere kant op: routes waarvan de backend geen gepubliceerde
# containerpoort is, en die dus niet als "dode route" gemeld moeten worden.
# qbittorrent draait met `network_mode: host`, en dan toont `docker ps` geen
# poortmapping - terwijl qbittorrent-nox wel degelijk op 8089 luistert en
# torrent.neodata.be netjes 200 geeft. Zonder deze lijst meldt report.yml hem
# elke run als kapot, en dat is precies hoe je een rapport leert negeren.
docker_routes_without_container:
  - { port: 8089, why: "qbittorrent draait met host-netwerk, geen poortmapping" }

docker_ports_without_route:
  - { port: 21115, why: "rustdesk hbbs - raw TCP, not HTTP" }
  - { port: 21116, why: "rustdesk hbbs - raw TCP, not HTTP" }
  - { port: 21117, why: "rustdesk hbbr - raw TCP, not HTTP" }
  - { port: 8000, why: "portainer edge agent tunnel, not the UI" }

# Diensten die je wél gebruikt maar die geen webroute hebben, en dus niet in
# caddy_sites staan. docs.yml maakt er toch een pagina voor onder Services,
# anders bestaan ze in de docs alleen als een regel in de stack-tabel en weet
# je niet dat ze er zijn. De poorten staan ook in docker_ports_without_route
# hierboven; dat is voor report.yml, dit is voor een lezer.
docker_services_without_route:
  - name: rustdesk
    stack: rustdesk
    ports: ["21115/tcp", "21116/tcp", "21116/udp", "21117/tcp"]
    desc: "RustDesk — eigen server voor remote support (ID en relay)"
    how: >-
      Geen webpagina: de RustDesk-app praat rechtstreeks met de server. Zet in
      de app bij Netwerk de ID-server op het adres van deze host en vul de
      publieke sleutel in (`id_ed25519.pub` in de datamap van de stack).
      Buiten het LAN werkt hij alleen als de router deze poorten doorstuurt.

