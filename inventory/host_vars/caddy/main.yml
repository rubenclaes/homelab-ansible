---
baseline_held_packages:
  - caddy

caddy_email: ruben.claes@neodata.be
caddy_domain: neodata.be

# Upstreams are named by inventory host, not by IP. Re-addressing a host means
# changing it in one place - in Proxmox for a guest, or ansible_host in
# inventory/00-static.yml for a host the hypervisor does not know about.
#
#   host:  an inventory hostname; its ansible_host becomes the upstream IP
#   port:  the upstream port
#   upstream: escape hatch for a target that is not in the inventory;
#             overrides host/port when present
#
# Flags: https (upstream speaks TLS with a self-signed cert), host_header
# (pass the original Host through), forwarded (add X-Real-IP / X-Forwarded-*).
#
# Er was ook een `auth`-vlag, die een site achter tinyauth zette. Die is op
# 22-09 weg: tinyauth draaide nergens meer, geen enkele site gebruikte de
# vlag, en `caddy_tinyauth_upstream` wees naar een dode poort op de Mac mini.
# Wil je ooit weer een site achter een forward_auth, bouw hem dan opnieuw
# tegen wat er dan draait - een snippet dat naar niets wijst is erger dan
# geen snippet.

caddy_sites:
  - { name: memos, host: docker, port: 5230, desc: "Memos - snelle notities" }
  # --- Infra ---
  - { name: portainer, host: docker, port: 9443, https: true, desc: "Docker-beheer voor de docker-host" }
  - { name: semaphore, host: semaphore, port: 3000, desc: "Ansible control plane — draait de playbooks volgens schema" }
  # Poort 3001 is Grafana, niet Uptime Kuma: `docker ps` op die host geeft
  # monitoring-grafana 192.168.0.17:3001->3000/tcp, gecontroleerd 22-09.
  # Uptime Kuma draait nergens in deze estate. De oude omschrijving hier was
  # de enige plek waar hij nog bestond, en die geloof je tijdens een storing.
  - { name: monitoring, host: docker-grafana-stack, port: 3001, host_header: true, desc: "Grafana — dashboards op Prometheus en Loki" }
  - { name: prometheus, host: docker-grafana-stack, port: 9090, desc: "Metrics-store die Grafana scrapet" }
  # Meldingen voor de telefoon. Een OCI-container op pve01 (vmid 109), niet op
  # de docker-host: wie meldt dat de docker-VM plat ligt, mag er niet zelf op
  # draaien. Proxmox stuurt NIET via deze naam maar rechtstreeks naar het IP,
  # zodat een melding niet van Caddy of AdGuard afhangt.
  - { name: ntfy, host: ntfy, port: 80, desc: "ntfy — meldingen van de homelab naar je telefoon" }

  # --- Beheer ---
  # De vier webinterfaces van de infrastructuur zelf. Ze draaiden alleen op
  # hun IP: 8006 en 8007 met een zelfondertekend certificaat, dus elke keer
  # door een waarschuwing klikken, en AdGuard zelfs onversleuteld.
  #
  # `https: true` bij proxmox en backup omdat die zelf TLS doen met een eigen
  # certificaat; het snippet https_upstream_insecure vangt dat af.
  #
  # LET OP dat je het IP blijft onthouden. Caddy draait als container op
  # pve01, dus als er iets stuk is, is de interface waarmee je het repareert
  # bereikbaar via het ding dat stuk is. https://192.168.0.14:8006 blijft
  # gewoon werken - hou die in je bladwijzers, niet alleen de mooie naam.
  - { name: proxmox, host: pve01, port: 8006, https: true, desc: "Proxmox VE — de hypervisor" }
  - { name: backup, host: pbs, port: 8007, https: true, desc: "Proxmox Backup Server — de back-ups en hun verificatie" }
  - { name: dns, host: adguard, port: 80, desc: "AdGuard Home — DNS voor de hele estate, en filtering" }
  # Home Assistant weigert een reverse proxy die hij niet kent. Zet Caddy in
  # zijn configuration.yaml onder http.trusted_proxies (192.168.0.25), anders
  # krijg je een 400 en niet de UI. Dat is handwerk in HA zelf.
  - { name: haos, host: haos, port: 8123, forwarded: true, desc: "Home Assistant — domotica" }

  # --- docker ---
  - { name: home, host: docker, port: 8085, desc: "Homepage — startpagina met alle diensten" }
  - { name: pairdrop, host: docker, port: 3000, desc: "Bestanden tussen toestellen in huis, zoals AirDrop" }
  - { name: code, host: docker, port: 8443, desc: "code-server — VS Code in de browser" }
  - { name: tools, host: docker, port: 8082, desc: "IT-Tools — ontwikkelaarsgereedschap, offline" }
  - { name: metube, host: docker, port: 8081, desc: "MeTube — webinterface voor yt-dlp" }
  - { name: pdf, host: docker, port: 8084, desc: "BentoPDF — PDF's samenvoegen, splitsen en omzetten" }
  - { name: termix, host: docker, port: 8086, desc: "SSH in de browser" }
  - { name: torrent, host: docker, port: 8089, desc: "qBittorrent — schrijft naar de NFS-share van de Mac mini" }
  - { name: openbooks, host: docker, port: 8080, desc: "OpenBooks — e-books zoeken en downloaden via IRC" }
  - { name: neogate, host: docker, port: 4000, desc: "NeoGate — toegangsbeheer voor het homelab (eigen app)" }
  - { name: photos, host: docker, port: 2283, desc: "Immich — foto- en videobibliotheek" }
  - { name: id, host: docker, port: 1411, desc: "Pocket ID — OIDC-provider (huidige instantie)" }
  - { name: spullen, host: docker, port: 7745, desc: "Homebox — wat ligt waar, met QR-labels" }

  - { name: prowlarr, host: docker, port: 9696, desc: "Indexerbeheer voor Sonarr en Radarr" }
  - { name: overseerr, host: docker, port: 5055, desc: "Aanvragen voor films en series" }
  - { name: audiobooks, host: docker, port: 13378, desc: "Audiobookshelf — luisterboeken en podcasts" }
  - { name: sonarr, host: docker, port: 8989, desc: "Beheer van series" }
  - { name: radarr, host: docker, port: 7878, desc: "Beheer van films" }


  # --- Mac mini ---
  # Op 22-09 nagelopen met een poortscan op 192.168.0.26: alleen wat hier nog
  # staat luistert daar ook echt. tinyauth (3000), bazarr (6767) en jellyfin
  # (8096) zijn weg - geen container, geen proces, niets op de poort. Die drie
  # routes stonden hier nog wel, en een route die een 502 teruggeeft is erger
  # dan geen route: tijdens een storing kost hij je de eerste tien minuten.
  - { name: plex, host: macmini, port: 32400, desc: "Plex — de hoofdtaak van de Mac mini" }
  - { name: duplicati, host: macmini, port: 8200, desc: "Back-ups vanaf de Mac mini" }
  - { name: auth, host: macmini, port: 1411, desc: "Pocket ID — oude instantie, wordt uitgefaseerd" } # TODO: old Pocket ID instance
  - { name: books, host: macmini, port: 6061, desc: "Grimmory — bibliotheek voor e-books, strips en luisterboeken" }
  - { name: shelfmark, host: macmini, port: 8084, desc: "Shelfmark — leest de bookdrop van Grimmory uit en zet metadata recht" }

# --- Logverzameling -------------------------------------------------------
# Deze host is sinds 23-09 de eerste met een Grafana Alloy erop. Reden: hij
# schrijft al JSON met rotatie naar /var/log/caddy, en dat is het enige
# volledige beeld dat er is van wie er van buiten aanklopt. Dat beeld stond
# tot nu toe alleen op deze container, waar niemand kijkt, en verdween na
# veertien dagen met de rotatie.
#
# Alleen de levende bestanden. De geroteerde staan als .gz naast ze, en die
# leest loki.source.file niet - ze zijn ook al verstuurd toen ze nog open
# stonden, dus meelezen zou dubbel zijn.
#
# Twee bronnen, twee job-labels, zodat je toegangsverkeer en het gedrag van
# Caddy zelf apart kunt bekijken: {job="caddy"} tegenover {job="caddy-runtime"}.
# In dat eerste zit per regel de hele request als JSON, dus in Grafana pel je
# af met `| json` - bijvoorbeeld {job="caddy"} | json | status >= 500.
alloy_log_targets:
  - name: caddy_access
    job: caddy
    paths:
      - /var/log/caddy/access.log
  - name: caddy_runtime
    job: caddy-runtime
    paths:
      - /var/log/caddy/runtime.log

# Alloy draait als gebruiker `alloy` en niet als root; via deze groep mag hij
# de bestanden hierboven lezen. Werkt alleen samen met caddy_log_mode (0640,
# zie roles/caddy/defaults/main.yml) - op Caddy's eigen default van 0600 heeft
# een groep niets te zoeken.
alloy_extra_groups:
  - caddy
