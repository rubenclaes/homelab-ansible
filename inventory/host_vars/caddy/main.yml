---
baseline_held_packages:
  - caddy

caddy_email: ruben.claes@neodata.be
caddy_domain: neodata.be

# Upstreams are named by inventory host, not by IP. Re-addressing a host means
# editing its ansible_host in inventory/hosts.yml and nothing else.
#
#   host:  an inventory hostname; its ansible_host becomes the upstream IP
#   port:  the upstream port
#   upstream: escape hatch for a target that is not in the inventory;
#             overrides host/port when present
#
# Flags: https (upstream speaks TLS with a self-signed cert), host_header
# (pass the original Host through), forwarded (add X-Real-IP / X-Forwarded-*),
# auth (require tinyauth).
# Safe because it is only ever resolved while rendering the Caddyfile on the
# caddy host, where hostvars is populated. A var containing hostvars[...] is
# NOT safe to read from a localhost-delegated task: arg finalisation there
# fails with "'hostvars' is undefined". That is what broke docs.yml and
# report.yml, whose addresses are literal for this reason.
caddy_tinyauth_upstream: "{{ hostvars['macmini']['ansible_host'] }}:3000"

