---
baseline_held_packages:
  - caddy

caddy_email: ruben.claes@neodata.be
caddy_domain: neodata.be
caddy_cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# Waar NeoGate draait; die host mag de sitelijst op :2020 altijd lezen.
caddy_neogate_host: docker

# Mogen de sitelijst op :2020 ook lezen.
caddy_config_readers:
  - 192.168.0.86 # Mac (NeoGate dev)

# host:      inventory-host; zijn ansible_host wordt het upstream-IP
# port:      upstream-poort
# upstream:  vast adres voor iets buiten de inventory; wint van host/port
# stack:     stack in docker_stacks_list van die host, enkel voor docs.yml
# https:     upstream doet TLS met een zelfondertekend certificaat
# host_header, forwarded: Host doorgeven / X-Real-IP en X-Forwarded-* toevoegen
caddy_sites:
  - { name: vault, host: docker, port: 8086, stack: vaultwarden, desc: "Vaultwarden — wachtwoordkluis voor de familie, met de Bitwarden-apps" }

  # --- Infra ---
  - { name: portainer, host: docker, port: 9443, stack: portainer, https: true, desc: "Docker-beheer voor de docker-host" }
  - { name: semaphore, host: semaphore, port: 3000, desc: "Ansible control plane — draait de playbooks volgens schema" }
  - { name: monitoring, host: docker-grafana-stack, port: 3001, stack: monitoring, host_header: true, desc: "Grafana — dashboards op Prometheus en Loki" }
  - { name: prometheus, host: docker-grafana-stack, port: 9090, stack: monitoring, desc: "Metrics-store die Grafana scrapet" }
  # upstream vast: een gestopte container heeft geen IP in de inventory, en
  # dan faalt de hele Caddyfile.
  - { name: ntfy, host: ntfy, port: 80, upstream: "192.168.0.32:80", desc: "ntfy — meldingen van de homelab naar je telefoon" }

  # --- Beheer ---
  # Caddy draait op pve01: hou https://192.168.0.10:8006 in je bladwijzers.
  - { name: proxmox, host: pve01, port: 8006, https: true, desc: "Proxmox VE — de hypervisor" }
  - { name: backup, host: pbs, port: 8007, https: true, desc: "Proxmox Backup Server — de back-ups en hun verificatie" }
  - { name: dns, host: adguard, port: 80, desc: "AdGuard Home — DNS voor de hele estate, en filtering" }
  # Vereist 192.168.0.25 in http.trusted_proxies van HA, anders een 400.
  - { name: haos, host: haos, port: 8123, forwarded: true, desc: "Home Assistant — domotica" }
  - { name: unifi, host: ucg, upstream: "192.168.0.1:443", https: true, host_header: true, desc: "UniFi — gateway en netwerkbeheer" }

  # --- docker ---
  - { name: home, host: docker, port: 8085, stack: homepage, desc: "Homepage — startpagina met alle diensten" }
  - { name: pairdrop, host: docker, port: 3000, stack: utils, desc: "Bestanden tussen toestellen in huis, zoals AirDrop" }
  - { name: code, host: docker, port: 8443, stack: utils, desc: "code-server — VS Code in de browser" }
  - { name: tools, host: docker, port: 8082, stack: utils, desc: "IT-Tools — ontwikkelaarsgereedschap, offline" }
  - { name: metube, host: docker, port: 8081, stack: utils, desc: "MeTube — webinterface voor yt-dlp" }
  - { name: pdf, host: docker, port: 8084, stack: utils, desc: "BentoPDF — PDF's samenvoegen, splitsen en omzetten" }
  - { name: torrent, host: docker, port: 8089, stack: media, desc: "qBittorrent — schrijft naar de NFS-share van de Mac mini" }
  - { name: openbooks, host: docker, port: 8080, stack: media, desc: "OpenBooks — zoekt e-books via IRC en legt ze in de bookdrop van Grimmory" }
  - { name: neogate, host: docker, port: 4000, stack: neogate, desc: "NeoGate — toegangsbeheer voor het homelab (eigen app)" }
  - { name: photos, host: docker, port: 2283, stack: media, desc: "Immich — foto- en videobibliotheek" }
  - { name: id, host: docker, port: 1411, stack: infra, desc: "Pocket ID — OIDC-provider (huidige instantie)" }
  - { name: prowlarr, host: docker, port: 9696, stack: media, desc: "Indexerbeheer voor Sonarr en Radarr" }
  - { name: overseerr, host: docker, port: 5055, stack: media, desc: "Aanvragen voor films en series" }
  - { name: audiobooks, host: docker, port: 13378, stack: media, desc: "Audiobookshelf — luisterboeken en podcasts" }
  - { name: sonarr, host: docker, port: 8989, stack: media, desc: "Beheer van series" }
  - { name: radarr, host: docker, port: 7878, stack: media, desc: "Beheer van films" }
  - { name: bazarr, host: docker, port: 6767, stack: media, desc: "Bazarr — ondertitels voor series en films, Nederlands en Engels" }
  - { name: cleanuparr, host: docker, port: 11011, stack: media, desc: "Cleanuparr — ruimt vastgelopen en valse downloads op" }
  - { name: books, host: docker, port: 6061, stack: media, desc: "Grimmory — bibliotheek voor e-books, strips en luisterboeken" }
  - { name: shelfmark, host: docker, port: 8087, stack: media, desc: "Shelfmark — zoekt boeken en legt ze in de bookdrop van Grimmory" }

  # --- Mac mini ---
  - { name: plex, host: macmini, port: 32400, desc: "Plex — de hoofdtaak van de Mac mini" }

# In Grafana: {job="caddy"} | json | status >= 500
alloy_log_targets:
  - name: caddy_access
    job: caddy
    paths:
      - /var/log/caddy/access.log
  - name: caddy_runtime
    job: caddy-runtime
    paths:
      - /var/log/caddy/runtime.log

# Leesrecht op de logs; werkt enkel met caddy_log_mode 0640.
alloy_extra_groups:
  - caddy
