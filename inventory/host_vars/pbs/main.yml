---
baseline_unattended_upgrades: false

# Datastore and job configuration, transcribed from
# `proxmox-backup-manager <thing> list --output-format json`.
#
# ADDITIVE ONLY, like everything else in this repo's Proxmox layer. A
# datastore is a directory full of backups; nothing here removes one.
#
# keep-last: 7 against a daily schedule is one week of history, and the
# PVE-side storage entry says `prune-backups keep-all=1`, which leaves all
# pruning to this side. Both are transcribed as they are. Whether one week is
# enough is a decision to take deliberately, not to change here by accident.
pbs_datastores:
  - name: store1
    path: /mnt/datastore/store1
    gc_schedule: daily

pbs_prune_jobs:
  - id: s-b173aef0-8cbf
    store: store1
    schedule: daily
    keep_last: 7

pbs_verify_jobs:
  - id: v-5885e27b-efbc
    store: store1
    schedule: sat 05:00
    outdated_after: 30
    ignore_verified: true

# Waar PBS zijn meldingen heen stuurt, naast mail-to-root. Zelfde opzet als
# pve_notification_webhooks in group_vars/proxmox/notifications.yml: rechtstreeks
# naar het IP van ntfy, niet via Caddy, en alleen waarschuwingen en fouten.
#
# pbs zit niet in de groep proxmox, dus het IP en het token komen via
# hostvars['pve01']. Het token is een eigen token, apart van dat van Proxmox.
#
# {{ title }}, {{ message }}, {{ severity }} en {{ secrets.token }} zijn
# Handlebars van PBS zelf, geen Jinja; vandaar de raw-blokken.
pbs_notification_webhooks:
  - name: ntfy
    url: "http://{{ (hostvars['pve01'].pve_oci_lxcs | selectattr('hostname', 'eq', 'ntfy') | first).ip | split('/') | first }}/homelab"
    method: post
    headers:
      Authorization: "Bearer {% raw %}{{ secrets.token }}{% endraw %}"
      Title: "{% raw %}{{ title }}{% endraw %}"
      Tags: "{% raw %}{{ severity }}{% endraw %}"
    body: "{% raw %}{{ message }}{% endraw %}"
    secrets:
      token: "{{ hostvars['pve01'].vault_ntfy_pbs_token }}"
    comment: "ntfy op ct 109, topic homelab"

# match-severity is één regel "warning,error", niet twee: met mode all moeten
# alle regels kloppen, en een melding is nooit tegelijk warning én error.
pbs_notification_matchers:
  - name: ntfy-warnings
    params:
      target: ntfy
      match-severity: "warning,error"
      mode: all
      comment: "Waarschuwingen en fouten naar de telefoon"
