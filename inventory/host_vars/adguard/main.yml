---
# Login for the AdGuard Home web API, used by roles/adguard to sync the
# rewrite list. It is the same user you log into the web UI with. Defined in
# the encrypted vault.yml next to this file; without that file the role
# fails with a message that says so.
adguard_api_user: "{{ vault_adguard_api_user }}"
adguard_api_password: "{{ vault_adguard_api_password }}"

# The zone the inventory's names live in: <host>.home.arpa for every managed
# host. The role has the same default; it is repeated here as a plain value so
# a reader of the inventory sees it without opening the role.
adguard_rewrite_domain: home.arpa

# Alle diensten achter Caddy: één wildcard, zodat een nieuwe route geen eigen
# regel nodig heeft. Stond tot 24-09 met de hand in AdGuard; een herbouw was
# hem dan kwijt, en zonder deze regel opent geen enkele *.neodata.be.
# Het adres komt van caddy zelf, zoals zijn caddy.home.arpa-regel.
adguard_rewrites_extra:
  - domain: "*.neodata.be"
    answer: "{{ hostvars['caddy']['ansible_host'] }}"

# De blocklists, op 23-09 van de draaiende instantie afgelezen. De rol bezit
# deze lijst: wat hier niet staat wordt weggehaald. Voeg je er een toe in de
# web-UI, zet hem dan ook hier neer, anders haalt de volgende run hem weg.
#
# Dat is met opzet streng. Sinds de DNS van het hele huis hierlangs loopt, is
# een filterlijst die alleen in de container bestaat iets wat je bij een
# herbouw stil kwijtraakt - je namen komen dan terug en je filtering niet.
#
# `AdAway Default Blocklist` staat hier bewust NIET tussen: die stond uit en
# laadde 0 regels, dus hij deed niets. De eerste run haalt hem weg.
adguard_filters:
  - name: AdGuard DNS filter
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
  - name: HaGeZi's Normal Blocklist
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_34.txt
  - name: HaGeZi's Badware Hoster Blocklist
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_55.txt
  - name: Phishing URL Blocklist (PhishTank and OpenPhish)
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_30.txt

# Deze node gaat de tailnet op zodat hij een 100.x-adres krijgt en als globale
# nameserver gebruikt kan worden. Maar hij mag zijn eigen DNS NIET van de
# tailnet aannemen: die wijst straks naar hemzelf, en dan zoekt hij zijn
# antwoorden bij zichzelf op via een omweg. `--accept-dns=false` houdt zijn
# /etc/resolv.conf zoals hij is (127.0.0.1 met 1.1.1.1 erachter).
#
# ct 108 staat wel op accept-dns; die is een gewone client en heeft er baat
# bij. Het verschil zit daarom hier en niet in de rol-defaults.
tailscale_up_extra_args:
  - --accept-dns=false
