---
# VM 102. Debian, zit in docker_hosts en krijgt dus de docker_engine-rol.
#
# Zijn stack staat in github.com/rubenclaes/monitoring-stack, niet in de
# containers-repo. Alleen de repo-naam en de branch wijken daarvoor af; de
# checkout staat op /opt/containers en de stacks eronder, precies zoals de
# defaults in roles/docker_stacks/defaults/main.yml het al zeggen. Dat is op
# 22-09 van de host zelf gelezen: `docker compose ls` geeft project
# `monitoring` op /opt/containers/stacks/monitoring, en `git remote -v` daar
# geeft monitoring-stack. Eerder stond hier /opt/monitoring-stack; dat pad
# bestaat op die host niet en de eerste echte run zou de clone dus naast de
# draaiende stack hebben gezet in plaats van erop.
docker_stacks_repo: git@github.com:rubenclaes/monitoring-stack.git
docker_stacks_repo_version: main

docker_stacks_list:
  - { name: monitoring, path: monitoring }

# Draait hier met een gepubliceerde poort en hoort bewust geen route te
# krijgen, anders meldt report.yml hem elke run als drift.
docker_ports_without_route:
  - { port: 9001, why: "portainer agent - gesproken door de portainer op docker, geen UI" }
  - { port: 12345, why: "alloy ui - alleen lokaal, scrapet zichzelf" }
  - { port: 3100, why: "loki - push/query api voor alloy en grafana, geen UI" }

# De read-only deploy key op /home/ruben/.ssh/containers_deploy is op 22-09
# aangemaakt en als deploy key aan monitoring-stack toegevoegd. Nagekeken met
# `git ls-remote` als ruben over die sleutel: die geeft main terug. De
# git-taak van de rol kan hier dus zelfstandig trekken.
#
# `remove_orphans` is hier veilig: het project heet al `monitoring` en staat
# al op het pad dat de rol gebruikt, dus de eerste run herkent de vier
# draaiende containers als de zijne. De portainer-agent op 9001 draait zonder
# compose-project-label en valt er dus buiten - nagekeken met docker inspect.
#
# MAAR: `docker compose up --dry-run` op 22-09 zegt Recreate voor alle vier.
# De draaiende containers zijn ooit met een andere config gestart dan wat er
# nu in de compose-file en de .env staat. De eerste echte run herstart dus
# grafana, prometheus, loki en alloy. Dat is te overleven - hun data staat in
# ${DATA_PATH} en niet in de container - maar het is een korte onderbreking
# van je monitoring, en je wil hem plannen in plaats van hem tegenkomen.
