---
# Inloggegevens voor de Semaphore-API, gebruikt door roles/semaphore_templates.
# Het is dezelfde gebruiker als waarmee je de web-UI opent. Ze staan in de
# gevaulte vault.yml hiernaast; zonder dat bestand faalt de rol met een
# melding die dat zegt. Zelfde opzet als inventory/host_vars/adguard/.
#
# Dat bestand maak je zelf, want het wachtwoord staat nergens in deze repo:
#
#   ansible-vault create --encrypt-vault-id infra \
#     inventory/host_vars/semaphore/vault.yml
#
# `--encrypt-vault-id`, niet `--vault-id`: ansible.cfg kent twee identiteiten
# (infra en stacks), dus bij aanmaken moet je zeggen mét welke je versleutelt.
# Zonder dat stopt vault met "Specify the vault-id to encrypt with".
#
# met daarin vault_semaphore_api_user en vault_semaphore_api_password.
semaphore_api_user: "{{ vault_semaphore_api_user }}"
semaphore_api_password: "{{ vault_semaphore_api_password }}"

# --- Templates ------------------------------------------------------------
# Welk playbook wanneer draait. Dit was tot nu toe klikwerk in de UI, en dus
# het enige deel van deze estate dat nergens opgeschreven stond.
#
# LET OP bij de eerste run. `name` is de sleutel waarop gezocht wordt, en die
# moet letterlijk overeenkomen met wat er nu in Semaphore staat. Draai daarom
# eerst een droogloop en lees de rapportageregel: staat een template die je
# dacht bij te werken onder `create`, dan wijkt de naam af en zou je een
# tweede maken. Hernoem er dan één van voor je het echt draait.
#
# De rol verwijdert nooit iets. Een template die je hier weghaalt blijft in de
# UI staan, inclusief zijn schema.
semaphore_templates_list:
  # LET OP de namen. Ze zijn NIET verzonnen: dit zijn de namen die al in de UI
  # stonden. Op 23-09 is deze lijst er eerst met eigen namen ingezet, en dat
  # leverde drie dubbele templates op - `Cleanup (apply)` naast het bestaande
  # `Cleanup (Apply)`, met alleen een hoofdletter verschil, en allebei met een
  # schema op zaterdag 03:00. Hernoemen hier is hernoemen in Semaphore, dus
  # kijk eerst met `--check` of een naam onder `update` staat en niet onder
  # `create`.

  # Wekelijks gelijktrekken; met een schema repareert drift zichzelf.
  #
  # De limit is geen versiering. `mbp` heeft ansible_connection: local, dus
  # vanuit Semaphore betekent die host "de container die de job draait" en
  # niet jouw MacBook. En `semaphore` zit erbuiten omdat site.yml die
  # container kan herstarten terwijl hij zijn eigen job draait.
  - name: "Site converge"
    playbook: playbooks/site.yml
    description: "Trekt elke host gelijk met de repo. Zonder mbp en zonder Semaphore zelf."
    arguments: ["--limit", "all:!mbp:!semaphore"]
    schedule: "0 5 * * 0"

  # Draait site.yml --check --diff en vat samen. Met drift_fail=true wordt hij
  # rood bij drift, en dat is de versie die op een schema hoort - een groene
  # samenvatting die je moet lezen om te zien dat hij rood had moeten zijn is
  # geen melding.
  #
  # `drift_limit` en niet `--limit`: dit playbook draait zelf op localhost en
  # start de droogloop als los commando. Een --limit hier zou die play raken
  # in plaats van de converge eronder.
  - name: "Drift check"
    playbook: playbooks/drift.yml
    description: "Wat zou site.yml veranderen? Faalt als het antwoord niet 'niets' is."
    arguments: ["-e", "drift_fail=true", "-e", "drift_limit=all:!mbp:!semaphore"]
    schedule: "0 6 * * *"

  # Vraagt elke <host>.home.arpa bij AdGuard op en vergelijkt met het adres uit
  # de inventory. Sinds 22-09 loopt de hele estate via één LXC, dus dit is
  # precies het soort ding dat je niet wil ontdekken op het moment dat je het
  # nodig hebt.
  #
  # 06:30 en niet 06:00 of 07:00: die twee zijn al bezet door Drift check en
  # Docs, en twee jobs op dezelfde minuut vechten om dezelfde controller.
  #
  # Geen limit nodig. Het playbook draait op `adguard` en delegeert de dig
  # naar de host die de job draait - de Semaphore-container, en die heeft dig
  # (gecontroleerd op 23-09, /usr/bin/dig).
  - name: "DNS smoketest"
    playbook: playbooks/dns-smoketest.yml
    description: "Antwoordt AdGuard nog wat de inventory zegt? Plus één publieke naam voor de forwarding."
    schedule: "30 6 * * *"

  # De hoofdletter A is die van de bestaande template. Naast deze staat
  # `Cleanup (report)` in de UI, zonder schema - die rapporteert alleen en
  # staat hier bewust niet in.
  # De limit is hier geen versiering maar een reparatie. `mbp` heeft
  # ansible_connection: local, dus vanuit Semaphore betekent die host "de
  # container die de job draait" - en die zit in groep `macs` en krijgt dus de
  # macOS-taken. Op 23-09 liep `Cleanup (report)` daarop vast: de play voor de
  # Macs deed "Measure the Homebrew cache" op een Debian-container zonder
  # Homebrew, en de job werd rood terwijl er niets mis was.
  #
  # Zelfde reden als bij Site converge en Drift check hierboven, alleen viel
  # het daar eerder op omdat die twee een schema hadden.
  - name: "Cleanup (Apply)"
    playbook: playbooks/cleanup.yml
    description: "Maakt schijfruimte vrij. Raakt geen volumes, containers of held packages aan."
    arguments: ["-e", "cleanup_apply=true", "--limit", "all:!mbp"]
    schedule: "0 3 * * 6"

  # Een drill die je alleen draait als je eraan denkt, draai je precies niet in
  # het half jaar waarin de back-ups stilletjes stukgaan. Maandelijks, want hij
  # maakt en sloopt een echte guest en dat wil je niet elke nacht.
  - name: "Restore drill"
    playbook: playbooks/restore-drill.yml
    description: "Zet een PBS-back-up terug op een wegwerp-guest, leest er staat uit, sloopt hem."
    schedule: "0 4 1 * *"

  # De limit houdt hem van zijn eigen container af; die machine patch je met
  # de hand. Herstart Semaphore halverwege een run, dan is de job dood en weet
  # je niet of de upgrade af is.
  #
  # Het schema stond al in de UI en staat nu hier, want dat is het hele punt
  # van dit bestand: zondag 04:00, een uur voor de converge.
  - name: "Update guests"
    playbook: playbooks/update.yml
    description: "Pakketupdates op de guests. Niet op Semaphore zelf - zie de limit."
    arguments: ["--limit", "guests:!semaphore"]
    schedule: "0 4 * * 0"

  # --- De losse playbooks, zonder schema tenzij vermeld ------------------
  # Overgenomen uit de UI op 23-09, precies zoals ze daar stonden: allemaal
  # zonder argumenten, en alleen Docs en Homelab Report met een cron.

  # De `--check` hier is de reparatie van 23-09. Tot die dag droeg deze
  # template de naam "dry run" terwijl ze `baseline.yml` gewoon uitvoerde - en
  # dat playbook convergeert, het is de eerste play van site.yml, los. Wie
  # erop klikte om te kijken wat er zou gebeuren, paste de baseline toe op
  # elke Linux-host.
  #
  # Gekozen voor de argumenten aanpassen en niet voor hernoemen: `name` is de
  # sleutel waarop deze rol zoekt, dus hernoemen had een tweede template
  # gemaakt en de taakgeschiedenis van deze achtergelaten.
  #
  # `--diff` staat erbij omdat een droogloop zonder diff alleen taaknamen laat
  # zien en niet wát er zou veranderen. Wil je een korter scherm, haal hem weg.
  - name: "Baseline (dry run)"
    playbook: playbooks/baseline.yml
    description: "Droogloop van de baseline op elke Linux-host. Verandert niets."
    arguments: ["--check", "--diff"]

  - name: "Caddy"
    playbook: playbooks/caddy.yml
    description: "Reverse proxy: Caddyfile uit caddy_sites, en de route-certificaten."

  # Zelfde limit en zelfde reden als Cleanup (Apply) hierboven.
  - name: "Cleanup (report)"
    playbook: playbooks/cleanup.yml
    description: "Rapporteert wat er vrij te maken valt. Verwijdert niets - dat doet Cleanup (Apply)."
    arguments: ["--limit", "all:!mbp"]

  - name: "Docs"
    playbook: playbooks/docs.yml
    description: "Bouwt docs.neodata.be uit de inventory en publiceert naar de caddy-host."
    schedule: "0 7 * * *"

  # `all:!mbp:localhost` en NIET `all:!mbp`, en die localhost is load-bearing.
  # report.yml rendert de HTML in een `hosts: localhost`-play en ruimt daar
  # ook op. Ansible telt de impliciete localhost niet mee in `all`, dus
  # `all:!mbp` laat die twee plays op nul hosts vallen: de run wordt groen,
  # er verschijnt niets op report.neodata.be, en je merkt het pas als je gaat
  # kijken. Gemeten met --list-hosts op 23-09, niet aangenomen.
  #
  # Deze job had hetzelfde mbp-probleem als de twee Cleanups, maar was nog
  # nooit gefaald: zijn schema is zondag 08:00 en dat is sinds het opzetten
  # van deze lijst nog niet langsgekomen.
  - name: "Homelab Report"
    playbook: playbooks/report.yml
    description: "Leest de hele vloot en publiceert naar report.neodata.be. Traag, vandaar wekelijks."
    arguments: ["--limit", "all:!mbp:localhost"]
    schedule: "0 8 * * 0"

  # Dagelijks, en dat schema is de reparatie voor een concreet probleem: na een
  # herstart van OrbStack komen `duplicati` en `shelfmark` op de Mini niet
  # terug. Het zijn precies de twee die een schijf onder /Volumes aankoppelen;
  # OrbStack deelt die schijf pas later de VM in en `restart: unless-stopped`
  # helpt niet tegen een start die niet lukt. Met een dagelijkse run herstelt
  # dat zich binnen een dag in plaats van pas als je het merkt.
  #
  # 05:30 en niet vroeger: op zondag draait Site converge om 05:00 en die roept
  # stacks.yml zelf al aan. Die run is in anderhalve minuut klaar, dus om 05:30
  # vechten ze niet om dezelfde controller. En het is vóór Drift check van
  # 06:00, zodat die een estate ziet die al bijgetrokken is.
  #
  # De eerste beheerde run op de Mini is op 23-09 met de hand gedaan en was
  # schoon (changed=0, alle zes stacks ok), dus dit schema erft geen
  # onbewaakte eerste keer - dat was de voorwaarde die in TODO.md stond.
  - name: "Stacks"
    playbook: playbooks/stacks.yml
    description: "Trekt de compose-stacks gelijk met de repo en zet ze op."
    schedule: "30 5 * * *"

# Hiermee staat elke template van dit project in git. Komt er een bij in de UI,
# zet hem dan ook hier neer - anders is dit bestand weer een deellijst en
# geloof je hem ten onrechte.
