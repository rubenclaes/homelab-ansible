---
# De Mac mini (M6, 16 GB, sinds 10-2026). Draait Plex als macOS-app, Ollama,
# en exporteert drie shares over NFS naar de docker-host. Geen containers:
# de media-apps draaien op `docker` (zie "Docker" onderaan).
#
# Staat in de groep `away` (inventory/00-static.yml) zolang hij er niet is.

# Wat de macos-rol terugzet. Dezelfde lijst als `brew leaves` op de oude
# Mini, min wat daar alleen voor Kubernetes of Docker stond.
macos_brew_packages_extra:
  - autojump
  - ffmpeg
  - gh
  - go
  - iperf3
  - kubectx
  - node
  - node_exporter
  - ollama
  - pass
  - ripgrep
  - smartmontools   # voor macos_smart, onderaan
  - ssh-copy-id
  - tailscale
  - tldr

# Plex staat NIET in deze lijst en dat is met opzet: hij draait als
# /Applications/Plex Media Server.app, van plex.tv. Zet je hem hier als
# `plex-media-server`, dan gaat brew over een installatie heen die hij niet
# geplaatst heeft.

# node_exporter: de metrics van de Mini voor Prometheus (roles/prometheus_config),
# vooral zijn schijven. De docker-host ziet ze ook via NFS, maar node_exporter
# slaat NFS daar over, en terecht: een NFS-mount die hangt, legt hem mee stil.
#
# ollama: voor NeoGate en Home Assistant. De brew-dienst luistert alleen op
# localhost; op het LAN is nog een stap (TODO.md).
macos_brew_services:
  - node_exporter
  - ollama

# De gezondheid van de schijven in Grafana ("Schijven Mac mini") en in de
# SMART-alarmen. smartctl leest ze hier zonder root, ook de externe.
macos_smart: true

macos_casks:
  - chromium
  - iterm2
  - spotify

# --- Docker ---------------------------------------------------------------
# Hier draait geen enkele container, en de Mini zit niet in docker_hosts.
# Docker op macOS kostte op de oude Mini 1,4 GB van de 8 GB RAM; wat er
# draaide, staat sinds 25-09-2026 op `docker`.

# --- NFS ------------------------------------------------------------------
# De drie shares die de docker-host mount; roles/nfs_exports zet ze in
# /etc/exports. De docker-kant staat in docker_stacks_nfs_mounts in
# host_vars/docker/main.yml en mount alle drie.
#
# -alldirs, -mapall=1000:1000 en het netwerk zijn voor alle drie hetzelfde en
# staan als default in roles/nfs_exports/defaults/main.yml.
#
# LET OP dat "SSD Nas" een spatie heeft. De template quote elk pad, want
# zonder aanhalingstekens leest macOS dat als twee exports - /Volumes/SSD en
# Nas - en exporteert hij stilletjes het verkeerde.
#
# Terugzetten na een herbouw: `ansible-playbook playbooks/nfs.yml -K`. Dit
# playbook staat niet in site.yml, omdat sudo hier een wachtwoord vraagt.
nfs_exports_shares:
  - path: /Volumes/media01
  - path: /Volumes/FastStore
  - path: "/Volumes/SSD Nas"
