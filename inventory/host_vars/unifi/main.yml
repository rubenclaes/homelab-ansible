---
# Local UniFi account used by roles/unifi to create client entries and address
# reservations. Make it in the gateway's UI under Settings, Admins, as a
# *local* account with Site Admin rights: the Ubiquiti cloud login needs a
# second factor and cannot be automated.
#
# Defined in the encrypted vault.yml next to this file. Without it the role
# fails with a message that says so, rather than skipping quietly.
unifi_user: "{{ vault_unifi_user }}"
unifi_password: "{{ vault_unifi_password }}"
