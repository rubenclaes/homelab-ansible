---
# Voorstel voor inventory/host_vars/docker.yml
# Gelezen van de host zelf op 2026-09-22. Geen inventory:
# lees het na, snoei het, en zet wat blijft in het echte host_vars-bestand.

# --- De stacks ------------------------------------------------------------
# `path` is relatief aan docker_stacks_root (/opt/containers/stacks).
# Staat de compose-file daar niet onder, dan hoort hij eerst in de
# containers-repo voor deze regel klopt - de rol kan alleen uitrollen wat
# daarin staat.
docker_stacks_list:
  - { name: homebox, path: homebox }
  - { name: homepage, path: homepage }
  - { name: infra, path: infra }
  - { name: media-stack, path: media }
  - { name: memos, path: memos }
  - { name: metrics, path: metrics }
  - { name: neogate, path: neogate }
  - { name: portainer, path: portainer }
  - { name: rustdesk, path: apps/rustdesk }
  - { name: utils, path: utils }

# --- Wat er nu luistert ---------------------------------------------------
# Eén regel per container met een gepubliceerde poort. Hoort er een route bij,
# zet hem in caddy_sites (inventory/host_vars/caddy/main.yml). Hoort er
# bewust géén route bij, zet de poort in docker_ports_without_route, anders
# meldt report.yml hem elke run als drift.
#   apps-rustdesk-hbbr           192.168.0.15:21117->21117/tcp
#   apps-rustdesk-hbbs           192.168.0.15:21115-21116->21115-21116/tcp, 192.168.0.15:21116->21116/udp
#   audiobookshelf               192.168.0.15:13378->80/tcp
#   flaresolverr                 8191-8192/tcp
#   immich-machine-learning      (geen gepubliceerde poort)
#   immich-postgres              5432/tcp
#   immich-redis                 6379/tcp
#   immich-server                192.168.0.15:2283->2283/tcp
#   infra-pocket-id              0.0.0.0:1411->1411/tcp, [::]:1411->1411/tcp
#   infra-watchyourlan           (geen gepubliceerde poort)
#   monitoring-agent-alloy       (geen gepubliceerde poort)
#   neodata-homebox              192.168.0.15:7745->7745/tcp
#   neodata-homepage             192.168.0.15:8085->3000/tcp
#   neodata-memos                192.168.0.15:5230->5230/tcp
#   neogate                      0.0.0.0:4000->3000/tcp, [::]:4000->3000/tcp
#   openbooks                    192.168.0.15:8080->80/tcp
#   portainer                    0.0.0.0:8000->8000/tcp, [::]:8000->8000/tcp, 0.0.0.0:9443->9443/tcp, [::]:9443->9443/tcp, 9000/tcp
#   prowlarr                     192.168.0.15:9696->9696/tcp
#   qbittorrent                  (geen gepubliceerde poort)
#   radarr                       192.168.0.15:7878->7878/tcp
#   seerr                        192.168.0.15:5055->5055/tcp
#   sonarr                       192.168.0.15:8989->8989/tcp
#   utils-bentopdf               192.168.0.15:8084->8080/tcp
#   utils-code-server            192.168.0.15:8443->8443/tcp
#   utils-it-tools               192.168.0.15:8082->80/tcp
#   utils-metube                 192.168.0.15:8081->8081/tcp
#   utils-pairdrop               192.168.0.15:3000->3000/tcp
#   utils-termix                 30001-30006/tcp, 192.168.0.15:8086->8080/tcp

# --- Waar de rol zijn spullen zet -----------------------------------------
# Alleen nodig als deze host afwijkt van de defaults in
# roles/docker_stacks/defaults/main.yml.
# docker_stacks_owner: root
# docker_stacks_root: /opt/containers/stacks
