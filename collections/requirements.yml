---
# Pinned to the major version in use, so a breaking upstream release cannot
# silently change behaviour between a green CI run and a production run.
#
# The lower bound is the version everyone runs. Raising it is how an update
# reaches every control node: an installed collection below the bound is
# replaced on the next `ansible-galaxy collection install -r`, no --force
# needed. CI picks it up because its cache key is this file's hash, Semaphore
# on the next `playbooks/semaphore.yml`.
collections:
  - name: community.general
    version: ">=13.5.0,<14.0.0"
  - name: community.docker
    version: ">=5.4.0,<6.0.0"
  - name: community.proxmox
    version: ">=2.0.0,<3.0.0"
  - name: community.crypto
    version: ">=3.5.0,<4.0.0"
  - name: ansible.posix
    version: ">=2.2.2,<3.0.0"
  - name: ansible.utils
    version: ">=6.1.1,<7.0.0"
