[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent

# Facts are reachable only via ansible_facts[...], never as bare top-level
# variables. Every playbook and role in this repo relies on that.
inject_facts_as_vars = False

# Keep the repo self-contained: no shell environment needed to decrypt.
# This is an executable resolver, not a password file - see bin/vault-pass.
vault_password_file = bin/vault-pass

private_key_file = ~/.ssh/ansible_ed25519
forks = 20
# community.general.yaml was removed in v12; this is the supported equivalent.
result_format = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = False

[ssh_connection]
# Big win on task-heavy roles; all managed hosts have requiretty disabled.
pipelining = True
# Note: no PreferredAuthentications=publickey here. bootstrap.yml connects to
# a brand-new host with `-u root -k`, i.e. password auth, before the ansible
# key exists. Forcing publickey would make first contact impossible.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
