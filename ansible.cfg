[defaults]
# A directory, not a file: Ansible merges every source in it alphabetically
# and skips group_vars/ and host_vars/. 00-static.yml holds the hosts Proxmox
# does not know about; homelab.proxmox.yml discovers the guests.
inventory = inventory/
roles_path = roles
interpreter_python = auto_silent
# Facts once per host per run, not once per play: stacks.yml, site.yml and
# report.yml have several plays on the same hosts.
gathering = smart

# Facts are reachable only via ansible_facts[...], never as bare top-level
# variables. Every playbook and role in this repo relies on that.
inject_facts_as_vars = False

# Two vault identities rather than one password for everything, split by blast
# radius: `infra` holds credentials that control the estate (Proxmox, Cloudflare,
# PBS, Semaphore), `stacks` holds application secrets for the Docker stacks.
# Either can be rotated without touching the other.
#
# bin/vault-pass-client is an executable client script, not a password file:
# Ansible passes it --vault-id and it resolves the right password. See README.
vault_identity_list = infra@bin/vault-pass-client, stacks@bin/vault-pass-client

private_key_file = ~/.ssh/ansible_ed25519
forks = 20
# community.general.yaml was removed in v12; this is the supported equivalent.
result_format = yaml
# ntfy_on_failure zwijgt tenzij Semaphore zijn env zet (roles/semaphore).
callback_plugins = plugins/callback
callbacks_enabled = profile_tasks, ntfy_on_failure
retry_files_enabled = False
# Run the handlers of changed tasks even when a later task fails. Without it a
# failed play forgets them: the next run sees the config already in place and
# never notifies again, so a service is never restarted (proxmox_tun,
# proxmox_usb, caddy).
force_handlers = True

[ssh_connection]
# Big win on task-heavy roles; all managed hosts have requiretty disabled.
pipelining = True
# Note: no PreferredAuthentications=publickey here. bootstrap.yml connects to
# a brand-new host with `-u root -k`, i.e. password auth, before the ansible
# key exists. Forcing publickey would make first contact impossible.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[inventory]
# `auto` hands homelab.proxmox.yml to the Proxmox plugin by reading its
# `plugin:` key; `yaml` handles 00-static.yml. Without this the plugin config
# is parsed as a plain YAML inventory and fails.
enable_plugins = community.proxmox.proxmox, yaml, ini, auto
