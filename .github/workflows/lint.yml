---
name: Lint

on:
  push:
    branches: [master]
  pull_request:
  # Handmatig startbaar, zodat een feature-branch ook gecontroleerd kan worden
  # zonder dat er al een pull request voor open staat.
  workflow_dispatch:

# Een push naar een PR-branch triggerde dit twee keer. `push` beperken tot
# master lost dat op; dit annuleert een run die nog loopt als er nieuwe
# commits binnenkomen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deze workflow leest alleen. Zonder dit blok krijgt de token de standaard
# rechten van de repo, en die zijn ruimer dan nodig.
permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Goedkoopste controle met de vervelendste gevolgen, dus als eerste.
      - name: Verify no secret is committed in plaintext
        run: bin/check-vaulted

      # Zelfde pins als het werkstation: requirements.txt is de enige bron.
      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Galaxy collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: collections-${{ hashFiles('collections/requirements.yml') }}

      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      # bin/vault-pass-client geeft een placeholder als er geen wachtwoord is,
      # dus deze stappen draaien in een clone zonder secrets.
      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax-check every playbook
        run: |
          status=0
          for playbook in playbooks/*.yml; do
            echo "::group::${playbook}"
            ansible-playbook --syntax-check "${playbook}" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Een template die naar een hernoemd of verwijderd playbook wijst, faalt
      # anders pas als Semaphore hem 's nachts start.
      - name: Every Semaphore template points at a playbook that exists
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          hv = yaml.safe_load(pathlib.Path("inventory/host_vars/semaphore/main.yml").read_text())
          missing = [t["playbook"] for t in hv["semaphore_templates_list"]
                     if not pathlib.Path(t["playbook"]).is_file()]
          for m in missing:
              print(f"::error::semaphore_templates_list: {m} bestaat niet")
          sys.exit(1 if missing else 0)
          PY

  scripts:
    name: shellcheck + ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Alleen warnings en erger: de info-meldingen (ls in plaats van find)
      # gaan over namen die in deze repo niet voorkomen.
      - name: Shell scripts
        run: shellcheck --severity=warning bin/* .githooks/pre-commit

      - name: Callback plugin
        run: pipx run ruff check --isolated plugins/

  docs:
    name: docs-site build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Dezelfde major als Semaphore, die de site echt bouwt (Debian 13: Node 20).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # Een MDX- of _meta.js-fout valt anders pas op als docs.yml draait.
      - name: Build
        working-directory: docs-site
        run: |
          npm ci
          npm run build

  tofu:
    name: tofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Dezelfde versie als Semaphore (semaphore_tofu_version) en de laptop.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.6"

      # De providers uit de cache in plaats van elke run van GitHub: op 05-10
      # werd een run rood omdat die download drie keer mislukte, zonder dat er
      # iets mis was met de code. Nieuwe sleutel zodra een lock-bestand wijzigt.
      - name: Cache OpenTofu providers
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-providers-${{ hashFiles('tofu/*/.terraform.lock.hcl') }}

      # Zelfde controle als .githooks/pre-commit: zonder backend en zonder
      # secrets, dus ook op een fork. Vangt een commit met --no-verify.
      - name: Check formatting and validity
        env:
          TF_VAR_state_passphrase: ci-validate-only
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for d in tofu/*/; do
            echo "::group::${d}"
            tofu fmt -check -diff "$d" || status=1
            tofu -chdir="$d" init -backend=false -input=false -lockfile=readonly || status=1
            tofu -chdir="$d" validate || status=1
            echo "::endgroup::"
          done
          exit $status
