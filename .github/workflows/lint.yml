---
name: Lint

on:
  push:
    branches: [master]
  pull_request:

# A push to a PR branch used to trigger this twice (once for `push`, once for
# `pull_request`). Limiting `push` to master fixes that; this cancels any run
# still in flight when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI cannot drift away from the workstation toolchain.
  # Bump deliberately, together with collections/requirements.yml.
  ANSIBLE_CORE_VERSION: "2.21.4"
  ANSIBLE_LINT_VERSION: "26.8.0"

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cheapest check, and the one with the worst failure mode, so run it
      # before anything else has a chance to time out.
      - name: Verify no secret is committed in plaintext
        run: bin/check-vaulted

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ansible-core==${ANSIBLE_CORE_VERSION}" \
            "ansible-lint==${ANSIBLE_LINT_VERSION}"

      - name: Cache Galaxy collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: collections-${{ hashFiles('collections/requirements.yml') }}

      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      # bin/vault-pass emits a placeholder when no secret is available, so
      # these steps run in a clone with no vault password at all.
      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax-check every playbook
        run: |
          status=0
          for playbook in playbooks/*.yml; do
            echo "::group::${playbook}"
            ansible-playbook --syntax-check "${playbook}" || status=1
            echo "::endgroup::"
          done
          exit $status
